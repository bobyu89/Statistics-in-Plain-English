c/tr>\u003ctr>\u003ctd>相關\u003c/td>\u003ctd>第 8 章\u003c/td>\u003ctd>第 12 章\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第 14 章\u003c/td>\u003ctd>卡方\u003c/td>\u003ctd>無母數統計\u003c/td>\u003c/tr>\u003c/table>","long":"\u003cdiv class=\"lead\">結論:兩者差了兩個原文版次。簡體版(2013)= 英文 3E,15 章、5 個附錄;台灣雙葉三版(2025)= 英文 5E 的架構,16 章、8 個附錄。內容上真正與簡體版同源的台灣版,是 2013 年已絕版的雙葉一版。\u003c/div>\u003ch4>主要差異\u003c/h4>\u003cul>\u003cli>\u003cb>原文版次差兩版\u003c/b>:簡體版譯自 3E;台灣三版的架構與 5E 一致。3E 到 5E 之間多了一整章、三張附錄表,並擴寫了常態分布與迴歸假設。\u003c/li>\u003cli>\u003cb>「相關」的位置不同\u003c/b>:簡體版把相關放在第 8 章(t 檢定之前);台灣三版移到第 12 章(ANOVA 之後、迴歸之前)。所以簡體版第 9–12 章,在台灣三版是第 8–11 章。\u003c/li>\u003cli>\u003cb>第 14 章範圍不同\u003c/b>:簡體版只講卡方獨立性檢定;台灣三版改名「無母數統計」,另外納入 Mann-Whitney U、Wilcoxon signed-rank、Kruskal-Wallis。\u003c/li>\u003cli>\u003cb>台灣三版多了第 16 章\u003c/b>:「個人中心取向的分析」(person-centered analysis),介紹集群分析與潛在類別分析。簡體版完全沒有。\u003c/li>\u003cli>\u003cb>附錄 5 張 vs 8 張\u003c/b>:台灣三版多了 Fisher Z 轉換表、Mann-Whitney U 臨界值、Wilcoxon signed-rank 臨界值;卡方表從附錄 E 變成附錄 H。\u003c/li>\u003cli>\u003cb>書內交叉引用的章號\u003c/b>:簡體版內文說「見第 9 章 t 檢驗」時,對台灣三版讀者是第 8 章;對照閱讀時請用下方章節對照表換算。\u003c/li>\u003c/ul>\u003cdiv class=\"chips\">\u003ca href=\"index.html#compare\">打開完整對照表\u003c/a>\u003c/div>"},{"title":"該用哪個檢定?","tone":"g","html":"\u003ctable>\u003ctr>\u003ctd>一組樣本 vs 已知母體平均數\u003c/td>\u003ctd>\u003cb>單一樣本 t 檢定\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩組不同的人,比平均數\u003c/td>\u003ctd>\u003cb>獨立樣本 t 檢定\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人前後測,或配對樣本\u003c/td>\u003ctd>\u003cb>相依(成對)樣本 t 檢定\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>三組以上不同的人,比平均數\u003c/td>\u003ctd>\u003cb>單因子變異數分析 + 事後比較\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個以上類別自變項,想看交互作用\u003c/td>\u003ctd>\u003cb>多因子變異數分析\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人量三次以上\u003c/td>\u003ctd>\u003cb>重複測量變異數分析\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin-top:6px;opacity:.7\">點開看完整 10 列\u003c/p>","long":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>你的問題\u003c/th>\u003cth>方法\u003c/th>\u003cth>章\u003c/th>\u003c/tr>\u003ctr>\u003ctd>一組樣本 vs 已知母體平均數\u003c/td>\u003ctd>\u003cb>單一樣本 t 檢定\u003c/b>\u003c/td>\u003ctd>CH 07\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩組不同的人,比平均數\u003c/td>\u003ctd>\u003cb>獨立樣本 t 檢定\u003c/b>\u003c/td>\u003ctd>CH 09\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人前後測,或配對樣本\u003c/td>\u003ctd>\u003cb>相依(成對)樣本 t 檢定\u003c/b>\u003c/td>\u003ctd>CH 09\u003c/td>\u003c/tr>\u003ctr>\u003ctd>三組以上不同的人,比平均數\u003c/td>\u003ctd>\u003cb>單因子變異數分析 + 事後比較\u003c/b>\u003c/td>\u003ctd>CH 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個以上類別自變項,想看交互作用\u003c/td>\u003ctd>\u003cb>多因子變異數分析\u003c/b>\u003c/td>\u003ctd>CH 11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人量三次以上\u003c/td>\u003ctd>\u003cb>重複測量變異數分析\u003c/b>\u003c/td>\u003ctd>CH 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個連續變項有沒有關係\u003c/td>\u003ctd>\u003cb>Pearson 相關係數 r\u003c/b>\u003c/td>\u003ctd>CH 08\u003c/td>\u003c/tr>\u003ctr>\u003ctd>用一個或多個變項預測連續結果\u003c/td>\u003ctd>\u003cb>簡單/多元迴歸\u003c/b>\u003c/td>\u003ctd>CH 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個類別變項有沒有關聯\u003c/td>\u003ctd>\u003cb>卡方獨立性檢定\u003c/b>\u003c/td>\u003ctd>CH 14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一堆題目想縮成幾個構面、檢查一致性\u003c/td>\u003ctd>\u003cb>因素分析 + Cronbach's α\u003c/b>\u003c/td>\u003ctd>CH 15\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"title":"每章固定三段","tone":"l","html":"\u003cp>每章三部分:1–2 頁的統計量簡介(用途與提供的資訊)、3–8 頁的詳解(用法、公式、優缺點、前提條件)、章末應用與解釋的實例。\u003c/p>","long":"\u003cdiv class=\"lead\">每章三部分:1–2 頁的統計量簡介(用途與提供的資訊)、3–8 頁的詳解(用法、公式、優缺點、前提條件)、章末應用與解釋的實例。\u003c/div>\u003ch4>前言在說什麼\u003c/h4>\u003cp>作者是常用統計的研究者,看到人們寧可相信個人軼事也不信數據,又普遍懷疑「統計會說謊」,因此想把統計講得讓人看得懂:數字本身不說謊,會出入的是解讀,懂原理才能自己判斷。他說明統計的三種用途:把眾人的資料概括成典型經驗、比較群體之間的整體差異、檢視變項間的關係並做預測;統計談的是普遍趨勢,不適用於單一個人。本書刻意精簡,適合搭配傳統教科書或當複習參考。每章先簡介、再詳解、最後舉例,各章自成一體,可依需要跳讀。\u003c/p>\u003ch4>作者建議的讀法\u003c/h4>\u003cul>\u003cli>當作補充讀物:搭配較詳盡的傳統教科書一起讀,不要指望一本學完。\u003c/li>\u003cli>當作複習參考書:學過一兩門統計課的人用來溫習概念。\u003c/li>\u003cli>各取所需:每章先讀 1–2 頁簡介,需要再讀詳解與例子。\u003c/li>\u003cli>各章獨立,可跳讀;例如已懂 t 檢定就直接從第 9 章跳到第 10 章。\u003c/li>\u003cli>想更完整理解某概念時,回頭查更傳統、更詳細的教科書。\u003c/li>\u003c/ul>\u003ch4>第三版新增\u003c/h4>\u003cul>\u003cli>新增第 15 章:因素分析與信度分析等資料整理技術。\u003c/li>\u003cli>第 1 章新增「理解資料分布」一節,並加入數張圖表示範如何使用與解讀。\u003c/li>\u003cli>許多章新增「行文表述」一節,示範論文中如何報告統計量。\u003c/li>\u003cli>設有配套網站:各章課件摘要、多數章的互動習題與延伸學習連結。\u003c/li>\u003cli>訂正前一版的全部已知錯誤(作者自嘲可能又寫進新的)。\u003c/li>\u003c/ul>"}]},"chapters":[{"n":1,"title_en":"Introduction to Social Science Research Principles and Terminology","pages":"1–14","one_liner":"先弄清母體與樣本、抽樣、變項尺度與研究設計,才談得上任何統計。","summary":"本章是全書的詞彙課。作者先分清母體與樣本、母數與統計量,提醒樣本未必能代表研究者心中的母體,而能否把結果類推出去正是描述統計與推論統計的分野。接著比較隨機、代表性與便利三種抽樣,說明變項的質性/量性之分與名義、次序、等距、比率四種測量尺度,再對照實驗設計與相關性設計在因果推論上的強弱。第三版新增的最後一節談「分布」與圖表:任何一組變項取值都是分布,選圖與讀圖的重點是讓資料一目了然,並留意座標軸刻度。","sections":[{"heading":"母體與樣本、統計量與母數","points":["母體是研究者關心的那一類對象的全體,樣本是從中取出的子集;由母體算出的值叫母數,由樣本算出的叫統計量。","作者以哈佛終身職教師的平均收入為例:查完整名單得到母數,隨機抽一部分人計算則得到統計量。","母體不一定很大,也不一定是人(班上 5 名學生、獸醫院看診的狗、某年在美國組裝的福特汽車都可以是母體)。","母體要由研究者定義;只收康乃狄克州一家心理衛生機構的 15 歲個案,卻談「青少年憂鬱症」,樣本與想談的母體就對不上。","描述統計只說明手上這批資料;推論統計假定樣本能代表母體,藉樣本對母體下結論,所以第一步是把母體定義清楚。"]},{"heading":"抽樣問題","points":["隨機抽樣指母體中每個成員被選中的機率相等,不是「隨便抽」;好處是樣本與母體的差異來自機會而非系統性偏差。","代表性抽樣是刻意讓樣本在重要特徵上的比例與母體一致,例如舊金山成人有 15% 退休、55% 男性,樣本也照此配置;費工但較能類推。","便利抽樣依距離、可接觸性與參與意願取樣,如就近國中 300 位家長中 220 位同意、當天到校 200 人。","便利樣本未必不好:只要它與目標母體的差異不致影響研究結果,就是可以接受的做法。"]},{"heading":"變項類型與測量尺度","points":["變項是有一個以上取值、可被編碼的東西;若樣本中人人取值相同(例如全是男性),它就成了常數。","量性(連續)變項的數字代表多寡;質性(類別)變項的數字只是標籤,如三個州編成 1、2、3;只有兩類者稱二分變項。","名義尺度的數字純為名稱;次序尺度有先後(富豪排名)但不知相鄰名次差多少。","等距與比率尺度的單位間距相等,既知順序也知差距(以英寸量身高);書中說比率尺度另含零值,圖 1-2 以賽跑名次與秒差對照。"]},{"heading":"研究設計","points":["實驗設計把樣本分組後比較,例如 40 名學生隨機分派各 20 人使用新舊數學課程,期望其他差異在兩組間平均抵銷。","相關性設計不分組、不操弄,只蒐集多個變項看彼此關聯強度,例如 100 名員工的睡眠時數與生產力。","相關不等於因果:睡得多可能使工作更有效率,也可能是工作順利才睡得好。","實驗能分離自變項對依變項的影響,但難以排除其他干擾、也難類推到真實情境;相關研究易執行、可同時看多個變項,卻缺乏控制。"]},{"heading":"分布與圖表的重要性","points":["分布就是某變項一組取值的集合;書中後面的常態、t、F、卡方分布都建立在這個概念上。","名義變項無法由低排到高,只能報各類百分比:500 位選民中民主黨 45%、共和黨 40%、無黨派 15%,長條圖或圓餅圖皆可。","長條圖可同時比較多個變項(虛構的五國高中生看電視與做功課時數),折線圖適合看趨勢(100 名大一生的 GPA 分組次數)。","1990–2007 美國犯罪率三張圖顯示:y 軸刻度太大時,暴力犯罪由每十萬人約 800 降到約 500 件的趨勢幾乎看不出來。"]}],"concepts":[{"tw":"母體與樣本","en":"population and sample","note":"母體是關心對象的全體,樣本是其中被實際觀察的子集。"},{"tw":"母數與統計量","en":"parameter and statistic","note":"母數描述母體,統計量由樣本算出並用來估計母數。"},{"tw":"概化(類推)","en":"generalize / generalizability","note":"把樣本結果推到母體的能力,取決於樣本像不像母體。"},{"tw":"描述統計與推論統計","en":"descriptive and inferential statistics","note":"前者只描述手上資料,後者藉樣本對母體下結論。"},{"tw":"隨機抽樣","en":"random sampling","note":"每個母體成員入選機率相等,差異只來自機會。"},{"tw":"測量尺度","en":"scales of measurement","note":"名義、次序、等距、比率四級,決定數字帶有多少資訊。"},{"tw":"自變項與依變項","en":"independent and dependent variables","note":"自變項被假定影響依變項;實驗中自變項由研究者操弄。"},{"tw":"實驗設計與相關性設計","en":"experimental vs. correlational design","note":"前者隨機分派可談因果,後者只能說有無關聯。"},{"tw":"分布","en":"distribution","note":"任一變項取值的集合,可用圖表呈現其樣貌。"}],"symbols":[{"sym":"N","meaning":"母體中的個體數(圖 1-1:N = 10)"},{"sym":"n","meaning":"樣本中的個體數(圖 1-1:n = 3)"},{"sym":"f","meaning":"次數(frequency),折線圖 y 軸所代表的人數"}],"formulas":[],"example":{"title":"1990–2007 年美國犯罪率的三張圖","takeaway":"同一份資料先畫成堆疊長條圖,只看得出總犯罪率由每十萬人近 6,000 件降到不足 4,000 件;改成折線圖分開兩類犯罪,暴力犯罪的變化仍被大刻度壓扁;最後單獨畫暴力犯罪、y 軸改為 0–800,才看清約由 800 降到 500。結論:好圖要讓重點不費力就看見。"},"pitfalls":["「隨機」不是隨便,而是人人入選機率相等;小樣本即使隨機也可能與母體差很多。","樣本實際代表的母體可能比研究問題宣稱的窄得多,類推前先問母體怎麼定義。","相關性研究只能說兩變項有關,不能判定誰造成誰。","讀圖要看座標軸刻度,刻度不合適會讓重要趨勢消失或被誤讀。"],"apa":null,"clinical":"只在單一醫學中心某病房收案的壓力性損傷研究,樣本實際代表的是「該院該病房住院病人」,不是「所有住院病人」;疼痛分數 0–10 屬等距/比率、壓傷分級屬次序、病房別屬名義尺度。","quiz":[{"q":"研究者只在一家心理衛生機構收了 15 歲個案,卻宣稱在研究「青少年憂鬱盛行率」,問題出在哪裡?","a":"樣本實際對應的母體(某年該機構接案的 15 歲者)遠窄於研究者宣稱的母體(青少年),且求診者本來就較可能憂鬱,存在系統性差異,結果難以類推。"},{"q":"富豪排行榜的名次與以英寸測得的身高,在測量尺度上差在哪裡?","a":"名次是次序尺度,只知道誰先誰後,不知道相鄰名次差多少;身高單位間距相等,屬等距/比率尺度,既能排序也能說出差多少。"},{"q":"發現員工睡眠時數與生產力高度相關,為何不能斷言「多睡使人更有生產力」?","a":"這是相關性設計,沒有隨機分派也沒有操弄變項;也可能是工作順利、壓力小才睡得久,因果方向無法由相關資料判定。"}],"slide":{"headline":"統計之前:先懂研究語言","bullets":["母體→母數;樣本→統計量","隨機抽樣:人人入選機率相等","尺度四級:名義、次序、等距、比率","實驗可談因果,相關只談關聯"],"stat":{"num":"N vs. n","label":"母體數與樣本數"}},"title_tw":"引介社會科學研究的原則與術語","brief":{"analogy_title":"試喝一口湯","analogy":"整鍋湯是母體,舀起來的那一匙是樣本。先把湯攪勻再舀(隨機抽樣),那一匙的味道才代表整鍋。","takeaways":["母體的數值叫母數,樣本的數值叫統計量","變項的測量尺度決定能用哪種統計","只有隨機分派的實驗才能談因果"],"table":{"caption":"四種測量尺度","head":["尺度","特性","例子","適合的集中趨勢"],"rows":[["名義","只分類別,沒有大小","血型、性別","眾數"],["次序","有順序,間距不一定相等","疼痛分級、名次","中位數"],["等距","間距相等,沒有絕對零點","攝氏溫度","平均數"],["比率","有絕對零點,可以說「幾倍」","體重、收入","平均數"]]}}},{"n":2,"title_en":"Measures of Central Tendency","pages":"15–22","one_liner":"平均數、中位數、眾數各說一件事;偏態或有離群值時三者會分家。","summary":"本章介紹描述分布中心的三個量數。平均數是所有取值的算術平均,最常用,但不透露資料多分散,也會被極端值拉走;中位數是第 50 百分位數,把資料對半切開,不受離群值影響;眾數只是出現最多的值,資訊最少,但能看出雙峰或多峰。常態分布下三者重合,偏態分布則各在不同位置:負偏時平均數小於中位數,正偏時相反。作者以 30 名五年級生的評分與各國預期壽命示範,並提醒樣本越小,一個離群值對平均數的影響越大;只看平均數容易忽略變異而流於一概而論。","sections":[{"heading":"三個集中趨勢量數是什麼","points":["平均數把整個分布濃縮成一個數,方便但有代價:它不告訴你取值多分散,也不保證有很多取值真的落在平均數附近。","中位數是第 50 百分位數,上下各一半取值;研究者常用它做中位數分割,把樣本分成人數相等的高、低兩組。","眾數是分布中次數最高的取值,提供的資訊最少,也是三者中最少被使用的一個。","樣本平均數記為 X̄,母體平均數記為 μ;樣本統計量是母體母數的估計。"]},{"heading":"怎麼算","points":["平均數:所有取值相加後除以取值個數(樣本除以 n,母體除以 N)。","中位數:先排序再找正中間;個數為奇數時就是中間那一個(11 個值取第 6 個),偶數時取中間兩個的平均(10 個值取第 5、6 個)。","眾數不必計算:10 位學生的智商分數中 100 出現三次,眾數就是 100。","最高次數的取值不只一個時稱多峰,兩個稱雙峰;100 人對死刑態度的量表兩端各有 45 人,就是典型雙峰分布。"]},{"heading":"例子:偏態分布中的三個量數","points":["30 名五年級生以 1–5 分評「學業成績有多重要」,多數選 4 或 5,少數選 1、2,尾巴拖向低分端,是負偏態分布。","眾數為 5;總和 113 除以 30 得平均數 3.77;第 15、16 個值都是 4,中位數為 4。平均數被低分尾巴拉低,略小於中位數。","13 國預期壽命中烏干達是離群值:不含它平均 78.17 歲,含它降為 76.21 歲,差了將近 2 歲。","只取日、英、美三國平均 79.75 歲,加入烏干達(約 52 歲)後降為 72.99 歲,少了近 7 歲,而中位數約 78.5 歲幾乎不動。"]},{"heading":"報告寫法與本章提醒","points":["集中趨勢的報告通常很短:寫出平均數與中位數的數值,再點出兩者關係所反映的分布形狀即可。","一個平均數能概括數百萬人(如美國男性平均身高 5 呎 9 吋),但也抹去了個體之間的巨大差異。","不看變異只看平均數,容易做出一體適用的概化甚至刻板印象;因此下一章接著談變異量數。"]}],"concepts":[{"tw":"平均數","en":"mean","note":"所有取值的算術平均;最常用,但會被極端值拉動。"},{"tw":"中位數","en":"median","note":"排序後正中間的值(第 50 百分位),不受離群值影響。"},{"tw":"眾數","en":"mode","note":"出現次數最多的取值;資訊最少。"},{"tw":"偏態","en":"skew","note":"取值擠在一端、另一端拖出尾巴;尾巴朝哪邊就是哪種偏。"},{"tw":"負偏態/正偏態","en":"negative / positive skew","note":"尾巴在低端為負偏(平均數\u003c中位數),在高端為正偏。"},{"tw":"離群值","en":"outlier","note":"異常大或小的值;樣本越小,對平均數的衝擊越大。"},{"tw":"雙峰/多峰分布","en":"bimodal / multimodal","note":"有兩個或更多最高次數的取值,常見於意見兩極的題目。"},{"tw":"中位數分割","en":"median split","note":"以中位數把樣本切成人數相等的高、低兩組。"},{"tw":"母數與統計量","en":"parameter and statistic","note":"μ 是母體平均數,X̄ 是用來估計它的樣本平均數。"}],"symbols":[{"sym":"X","meaning":"分布中的單一取值"},{"sym":"ΣX","meaning":"X 的總和;把分布中所有取值加起來"},{"sym":"X̄","meaning":"樣本平均數"},{"sym":"μ","meaning":"母體平均數"},{"sym":"n","meaning":"樣本中的個體或取值個數"},{"sym":"N","meaning":"母體中的個體或取值個數"},{"sym":"P₅₀","meaning":"中位數(第 50 百分位數)的符號"}],"formulas":[{"name":"樣本平均數","expr":"X̄ = ΣX / n","note":"所有取值相加,除以樣本取值個數"},{"name":"母體平均數","expr":"μ = ΣX / N","note":"算法相同,只是對象是整個母體"},{"name":"中位數(偶數個取值)","expr":"P₅₀ = (排序後中間兩個取值之和) / 2","note":"奇數個時直接取正中間那一個"}],"example":{"title":"五年級生對「成績重要性」的評分與各國預期壽命","takeaway":"30 名五年級生的 1–5 分評分呈負偏:眾數 5、中位數 4、平均數 113/30 = 3.77,平均數被低分尾巴拉到中位數之下。預期壽命資料示範離群值效應:13 國時加入烏干達使平均由 78.17 降到 76.21;只有 4 國時由 79.75 降到 72.99。"},"pitfalls":["平均數不代表「多數人的情況」;分布中可能很少有取值真的落在平均數附近。","偏態或有離群值時只報平均數會誤導,應同時看中位數。","小樣本裡一個極端值就能大幅改變平均數。","只看集中趨勢、不看變異,容易做出一體適用的結論或刻板印象。"],"apa":"此分布的平均數(X̄ = 3.77)略低於中位數(P₅₀ = 4.00),顯示分布呈負偏態。","clinical":"住院天數多半是正偏態:大多數病人住幾天,少數住上百天把平均拉高。報告病房住院天數時,中位數比平均數更能代表「典型病人」,這也是臨床常報中位數與四分位距的原因。","quiz":[{"q":"某量表分數平均數 3.77、中位數 4.00,不看圖你能推測分布形狀嗎?","a":"平均數小於中位數,代表有少數偏低的取值把平均數往下拉,尾巴在低分端,屬於負偏態分布;多數人其實集中在高分端。"},{"q":"為什麼同一個離群值在 4 國資料中讓平均數掉近 7 歲,在 13 國資料中只掉約 2 歲?","a":"平均數是所有取值合起來除以個數,個數越少,每一個值占的權重越大;樣本小,單一極端值的影響就被放大,樣本大則被稀釋。"},{"q":"調查 100 人對死刑的態度,平均數落在量表中間,能說「大家意見中立」嗎?","a":"不能。書中例子兩端各有 45 人,是雙峰分布,中間幾乎沒人;平均數落在中間只是兩極相抵的結果,要看眾數與次數分配才知道。"}],"slide":{"headline":"三種「中心」,三種故事","bullets":["平均數:最常用,但怕極端值","中位數:第 50 百分位,不怕離群值","眾數:出現最多,可看出雙峰","負偏:平均數\u003c中位數;正偏相反"],"stat":{"num":"3.77 \u003c 4","label":"負偏的訊號"}},"title_tw":"集中趨勢之測量","brief":{"analogy_title":"一桌人的薪水","analogy":"九個上班族同桌吃飯,走進一位億萬富翁。這桌的平均薪水瞬間暴衝,中位數卻幾乎沒動。","takeaways":["平均數用到每一個數值,但怕極端值","中位數是排序後正中間的那一位","分布偏斜時三者分家,平均數被長尾拉走"],"table":{"caption":"三種集中趨勢比一比","head":["指標","怎麼算","優點","弱點"],"rows":[["平均數","總和 ÷ 個數","用到全部資料","容易被極端值拉走"],["中位數","排序後正中間的值","不怕極端值","沒用到每個數值的大小"],["眾數","出現最多次的值","類別資料也能用","可能不只一個"]]}}},{"n":3,"title_en":"Measures of Variability","pages":"23–34","one_liner":"平均數要配上標準差才看得出分布樣貌;樣本公式用 n − 1 是為了不低估母體變異。","summary":"只知道平均數與中位數,無從得知資料是擠在一起還是四散。本章介紹三個變異量數:全距只看最大與最小值,容易誤導;變異數是離均差平方的平均,單位是平方,難以直接解讀,主要當其他統計的零件;標準差是變異數開根號,回到原單位,可理解為各取值離平均數的典型距離,最有用。作者說明為何先平方(離均差加總必為零)再開根號,以及樣本公式為何除以 n − 1。最後以 491 名中學生兩道五點量表題示範:全距相同,平均數與標準差卻能分辨兩個分布。","sections":[{"heading":"全距、四分位距、變異數、標準差","points":["100 名五年級生憂鬱分數的平均數與中位數都是 10,但仍不知道分數是人人相同還是差異極大,這就是需要變異量數的原因。","全距是最大值減最小值。若 98 人都得 10 分、另兩人得 1 與 20 分,全距 19 看似分散其實不然;常用來檢查量表各分數是否都有人選。","四分位距是第 75 與第 25 百分位數之差,涵蓋排序後中間 50% 的取值。","變異數是離散程度的一種平均,因單位與原始分數不同而少單獨使用;開根號成為標準差後才好解釋。","全距量的是總離散程度,變異數與標準差量的是平均離散程度;平均數加標準差就能大致描繪一個分布。"]},{"heading":"為什麼樣本公式除以 n − 1","points":["母體公式分母用 N;樣本公式分母用 n − 1,因為母體平均數未知,只能用樣本平均數代替。","以樣本平均數算出的離均差平方和,會比用真正母體平均數算的小,所以會低估母體變異;把分母縮小成 n − 1 就是在修正。","差多少看樣本大小:分子同為 100,n = 500 時兩式相差不到 1%;n = 10 時是 3.16 與 3.33,大了近五分之一。","社會科學研究幾乎都把參與者視為代表更大母體的樣本,所以實務上用的多是樣本公式。"]},{"heading":"拆解公式:離均差、平方和、開根號","points":["直覺做法是把每個取值減平均數後加總再平均,但平均數是分布的數學中心,正負離均差相加必為零,行不通。","解法是先把每個離均差平方,消去負號,再加總得到離均差平方和(SS)。","SS 除以取值個數(樣本為 n − 1)就是變異數,也就是「平均的離均差平方」。","平方使單位變成原單位的平方,對變異數開根號才回到原單位,得到標準差;兩者都不會是負數。","變異數仍值得學:算標準差必經它,而它的核心 SS 是變異數分析、迴歸等進階方法的共同零件。"]},{"heading":"例子:兩道五點量表題","points":["自信題(時間夠就能解出最難的題目):n = 491,平均數 4.21,標準差 0.98,變異數 0.96;多數人選 4 或 5,呈負偏。","表現能力題(全班只有我答得出時感覺很棒):平均數 2.92,標準差 1.43,變異數 2.04,全距同樣是 4。","全距分不出兩題差異;平均數 2.92 落在量表中央,可能是大家都選 2、3,也可能各選項平均分散,或一半選 1 一半選 5。","標準差能區分:都選 2、3 時很小,半數 1 半數 5 時約 2,平均分散時約 1.5。實得 1.43,判斷為相當均勻散布,與次數圖相符。","盒鬚圖一張圖同時呈現中位數、第 25 與 75 百分位數(箱體,此例為 2 到 4)以及最大、最小值(5 與 1)。"]}],"concepts":[{"tw":"標準差","en":"standard deviation","note":"各取值與平均數之間的典型距離,單位與原始資料相同。"},{"tw":"變異數","en":"variance","note":"離均差平方的平均;單位是平方,多作為其他統計的零件。"},{"tw":"離均差平方和","en":"sum of squared deviations (SS)","note":"每個取值減平均數後平方再全部相加,ANOVA 與迴歸都用它。"},{"tw":"n − 1 校正","en":"n − 1 in the sample formula","note":"用樣本平均數會低估母體變異,縮小分母加以補償。"},{"tw":"全距","en":"range","note":"最大值減最小值;只反映兩個極端,容易誤導。"},{"tw":"四分位距","en":"interquartile range (IQR)","note":"第 75 與第 25 百分位數之差,中間一半資料的寬度。"},{"tw":"離均差","en":"deviation","note":"單一取值與平均數的差;全部相加必等於零。"},{"tw":"盒鬚圖","en":"boxplot","note":"用箱體與鬚線同時呈現中位數、四分位距與全距。"},{"tw":"以樣本統計量估計母數","en":"sample statistics as estimates of parameters","note":"樣本公式的設計目的,是讓算出的值更貼近母體真值。"}],"symbols":[{"sym":"μ","meaning":"母體平均數"},{"sym":"X","meaning":"分布中的單一取值"},{"sym":"s²","meaning":"樣本變異數"},{"sym":"s","meaning":"樣本標準差"},{"sym":"σ","meaning":"母體標準差"},{"sym":"σ²","meaning":"母體變異數"},{"sym":"SS","meaning":"平方和,即離均差平方和"},{"sym":"n","meaning":"樣本中的個體數"},{"sym":"N","meaning":"母體中的個體數"}],"formulas":[{"name":"母體變異數","expr":"σ² = Σ(X − μ)² / N","note":"離均差平方和除以母體個數"},{"name":"樣本變異數(母體估計)","expr":"s² = Σ(X − X̄)² / (n − 1)","note":"分母用 n − 1 以修正低估"},{"name":"母體標準差","expr":"σ = √( Σ(X − μ)² / N )","note":"母體變異數開根號"},{"name":"樣本標準差","expr":"s = √( Σ(X − X̄)² / (n − 1) )","note":"樣本變異數開根號,回到原單位"},{"name":"離均差平方和","expr":"SS = Σ(X − X̄)²","note":"變異數公式的分子,ANOVA 與迴歸的基礎"},{"name":"全距與四分位距","expr":"全距 = 最大值 − 最小值;IQR = P₇₅ − P₂₅","note":"前者看兩端,後者看中間一半"}],"example":{"title":"491 名中學生的自信題與表現能力題","takeaway":"兩題都是 1–5 分、全距都是 4。自信題平均 4.21、標準差 0.98,表示多數人擠在高分端、彼此差約 1 分;表現能力題平均 2.92、標準差 1.43,表示答案相當平均地散在五個選項。全距分不出兩者,平均數加標準差才能;變異數(0.96、2.04)難以直接解讀。"},"pitfalls":["全距只由兩個極端值決定,98 人同分也可能出現很大的全距。","變異數的單位是原單位的平方,不宜直接拿來描述資料有多分散。","自信題的變異數 0.96 與標準差 0.98 幾乎相等純屬巧合,只有標準差接近 1 時才會如此。","把標準差說成「平均離差」只是幫助理解的近似說法;真正的平均離差是 Σ|X − 平均數| / N。"],"apa":null,"clinical":"兩個病房平均疼痛分數都是 4 分:A 病房標準差 0.5,人人在 4 分上下;B 病房標準差 3,有人 0 分、有人 9 分。平均相同,B 病房卻需個別化止痛評估。","quiz":[{"q":"兩道五點量表題的全距都是 4,為什麼不能說兩題的分散程度一樣?","a":"全距只看最大與最小值,只要各有至少一人選 1 和 5 就是 4。自信題標準差 0.98、表現能力題 1.43,後者的答案散得多;要看標準差才知道平均離散程度。"},{"q":"為什麼不能直接把所有離均差加起來再平均,當作變異的指標?","a":"平均數是分布的數學中心,正負離均差剛好抵銷,總和永遠是零,除以任何 n 都是零。所以要先平方消去負號,求平均後再開根號回到原單位。"},{"q":"樣本只有 10 人與 500 人時,分母用 n − 1 或 n 的差別有何不同?為什麼要用 n − 1?","a":"500 人時兩者相差不到 1%,10 人時標準差會大近五分之一。因為用樣本平均數算離均差會低估母體變異,縮小分母可把估計值調大,小樣本尤其需要。"}],"slide":{"headline":"平均數要配標準差","bullets":["全距只看兩端,容易誤導","變異數=離均差平方的平均","標準差=變異數開根號,回到原單位","樣本公式除以 n − 1,修正低估"],"stat":{"num":"n − 1","label":"樣本變異數的分母"}},"title_tw":"變異性之測量","brief":{"analogy_title":"兩班平均都是 70 分","analogy":"一班人人都考 68 到 72 分,另一班從 30 分到 100 分都有。平均一樣,老師要用的教法卻完全不同。","takeaways":["只報平均數不夠,還要知道資料有多分散","變異數是「離平均數距離的平方」的平均","標準差開根號回到原單位;樣本要除以 n − 1"],"table":{"caption":"四種變異指標","head":["指標","算法","提醒"],"rows":[["全距","最大值 − 最小值","最快,但只看頭尾兩個值"],["四分位距","第 75 百分位 − 第 25 百分位","不受極端值影響"],["變異數","Σ(X − X̄)² ÷ (n − 1)","單位是原單位的平方"],["標準差","√變異數","和原始資料同單位,最常用"]]}}},{"n":4,"title_en":"The Normal Distribution","pages":"35–42","one_liner":"常態分布是計算機率的理論基準;資料或抽樣一旦偏離它,機率就會失準。","summary":"本章說明常態分布(鐘形曲線)為何是統計學的核心。它是理論分布:對稱、單峰、平均數與中位數及眾數重合,兩尾漸近橫軸。只描述手上的樣本時,分布是否常態並不要緊;但要計算某數值出現的機率,或從樣本推論母體、檢驗虛無假設時,所用的機率都建立在常態假設上。因此分布形狀(偏態、峰度)與抽樣方式(隨機、代表性、便利)都會影響機率是否可信。作者以六年級學生自尊分數的負偏分布示範:常態機率硬套在偏態資料上會失準,但非常態樣本並非毫無價值。","sections":[{"heading":"常態分布的三個性質","points":["常態分布畫成次數分布圖時呈鐘形:橫軸是變項數值,縱軸是次數,以智商為例,100 分處最高,往兩側次數遞減。","第一是對稱(symmetrical):左右兩半互為鏡像。第二是平均數、中位數、眾數落在同一點且位於正中央,所以是單峰(unimodal)。","第三是漸近(asymptotic):左右兩尾無限延伸、越來越貼近橫軸,卻永遠不會碰到它。"]},{"heading":"為什麼常態分布重要","points":["只做描述統計(例如 100 位大一生每日平均攝取熱量)時,樣本是否常態無關緊要,因為結論只針對這群人。","想知道某個情形隨機出現的機率(例如平均 2000 大卡的樣本中出現攝取 5000 大卡者),就得靠常態分布的性質來算。","推論統計要判斷樣本現象是否反映母體:在「男女無差異」的虛無假設下,出現 200 大卡差距的機率有多大,也是用常態分布計算。"]},{"heading":"理論分布與抽樣方法","points":["常態分布是理論分布,實際資料很少完全吻合;許多統計方法卻假設資料為常態,假設不成立時相關機率便不再有效。","若高分異常多、低分異常少,用常態機率估計會低估高分人數、高估低分人數。","常態機率同時假設樣本與母體沒有系統性差異。隨機抽樣的樣本間差異只是隨機的;便利抽樣則可能一再抽到同一端的人。","偏誤若與研究變項無關還不打緊;若有關(如在名校林立的劍橋取樣來推估全美學生成就),平均數、四分位、百分位的推估都會失真。"]},{"heading":"偏態與峰度","points":["偏態(skew)指數值擠在一端、少數值把尾巴拖向另一端:長尾在高分端為正偏,在低分端為負偏。","平均數會被拉向長尾,中位數不受影響;所以正偏時平均數大於中位數,負偏時平均數小於中位數,常態時兩者相等。","峰度(kurtosis)描述高聳或扁平:高狹峰(leptokurtic)中央較集中、兩尾較少;低闊峰(platykurtic)中央較少、兩尾較多。","常態分布約 68% 的數值落在平均數 ±1 個標準差內;偏態或峰度異常的分布不符合這個比例,套用常態機率就會出錯。"]},{"heading":"例子與結語","points":["677 名六年級生的自尊分數(1–5 分)呈明顯負偏,平均數 4.28、標準差 0.72,平均數加 1 個標準差剛好是量表上限。","非常態樣本可能如實反映一個本來就非常態的母體,也可能是樣本沒有代表好母體的警訊,兩種情形都要考慮。","即使樣本數值不是常態,用於推論的抽樣分布仍可能是常態(第 6 章);推論時務必清楚定義母體並了解抽樣可能帶來的偏誤。"]}],"concepts":[{"tw":"常態分布","en":"normal distribution","note":"對稱、單峰、三個集中量數重合、兩尾漸近的鐘形理論分布。"},{"tw":"理論分布","en":"theoretical distribution","note":"由機率推導出的理想分布,不是實際蒐集到的資料。"},{"tw":"偏態","en":"skew","note":"分布一側拖出長尾而不對稱;長尾在高分端為正偏,低分端為負偏。"},{"tw":"峰度","en":"kurtosis","note":"分布比常態更尖(高狹峰)或更平(低闊峰)的程度。"},{"tw":"隨機抽樣","en":"random sampling","note":"每個成員被選中的機會相同,樣本與母體的差異只是隨機的。"},{"tw":"便利抽樣","en":"convenience sampling","note":"為了方便而取樣,容易系統性偏向母體的某一端。"},{"tw":"推論統計","en":"inferential statistics","note":"用樣本資料推估母體特徵,前提是樣本能代表母體。"},{"tw":"虛無假設","en":"null hypothesis","note":"主張效果為零(例如兩組平均數沒有差異)的假設。"},{"tw":"偏誤樣本","en":"biased","note":"母體某部分被過度代表、另一部分代表不足的樣本。"}],"symbols":[],"formulas":[{"name":"平均數 ±1 個標準差的比例","expr":"P(μ − σ \u003c X \u003c μ + σ) ≈ 0.68(每側約 0.34)","note":"常態分布才成立;本章只談比例,沒有列正式公式"},{"name":"偏態與集中量數的關係","expr":"正偏:平均數 > 中位數;負偏:平均數 \u003c 中位數;常態:平均數 = 中位數","note":"平均數被長尾拉走,中位數不動"}],"example":{"title":"六年級學生自尊分數的負偏分布","takeaway":"677 名學生以 5 點量表答四題自尊題,平均後得分 1–5。分布負偏,平均數 4.28、標準差 0.72。常態分布預期約 16% 的人高於平均數加 1 個標準差,但 4.28 + 0.72 已是滿分 5,實際上沒有人超過。可見常態機率不能直接套在偏態資料上。"},"pitfalls":["常態分布是理論模型,真實資料只會近似它;不要未經檢查就假設資料為常態。","把常態機率套在偏態資料上,會在一端高估、另一端低估實際人數。","樣本非常態不等於資料無用:可能母體本來就非常態,也可能是抽樣有偏誤,要分辨是哪一種。","便利樣本的偏誤若與研究變項有關,任何以常態機率做的母體推估都不可信。"],"apa":null,"clinical":"住院天數多半呈正偏:多數病人三五天出院,少數重症住上數十天,平均數被拉高。若用「平均數 ±1 個標準差涵蓋 68%」來估床位需求就會失準,此時報告中位數與四分位距較妥當。","quiz":[{"q":"某量表分數呈負偏,平均數與中位數誰比較大?為什麼?","a":"中位數較大。負偏表示長尾拖向低分端,少數極低分把平均數往下拉,中位數只看排序位置、不受極端值影響,所以平均數會小於中位數。"},{"q":"只想描述自己病房 100 位病人的資料時,需要擔心資料不是常態嗎?","a":"不需要。描述統計只針對這個樣本本身;只有在要計算機率或從樣本推論母體時,常態假設與抽樣是否有偏誤才變得關鍵。"},{"q":"為什麼抽樣方法會影響常態機率能不能用?","a":"常態機率除了假設分布形狀,也假設樣本與母體沒有系統性差異。便利抽樣若一再抽到母體的某一端,樣本落在分布高端或低端的機會就不是常態機率所預期的,推估便會失準。"}],"slide":{"headline":"常態分布:機率的基準線","bullets":["對稱、單峰、漸近;平均數 = 中位數 = 眾數","推論統計的機率都建立在常態假設上","偏態拉走平均數,峰度改變中央與兩尾的比例","抽樣有偏誤時,常態機率不再適用"],"stat":{"num":"68%","label":"落在 ±1 個標準差內"}},"title_tw":"常態分布","brief":{"analogy_title":"排隊量身高","analogy":"把一群成年人依身高排成長條圖:大多數人擠在平均附近,越高或越矮的人越少,左右對稱,像一口鐘。","takeaways":["對稱、單峰:平均數 = 中位數 = 眾數","曲線下的面積就是機率","許多推論統計都假設常態;偏離時機率會失準"],"table":{"caption":"常態分布的經驗法則","head":["範圍","涵蓋比例","落在外面的機會"],"rows":[["平均數 ± 1 個標準差","約 68%","約 3 人有 1 人"],["平均數 ± 2 個標準差","約 95%","約 20 人有 1 人"],["平均數 ± 3 個標準差","約 99.7%","約 370 人有 1 人"]]}}},{"n":5,"title_en":"Standardization and z Scores","pages":"43–55","one_liner":"z 分數把原始分數換成「離平均數幾個標準差」,才能跨量尺比較並查出百分位。","summary":"本章說明如何用平均數與標準差把原始分數轉成標準分數(z 分數)。z 表示該分數高於或低於平均數幾個標準差;整個分布標準化後平均數為 0、標準差為 1,不同量尺的分數因此可以比較。資料為常態時,配合附錄 A 的 z 表還能在原始分數與百分位數之間互換,並算出兩分數之間的比例;作者以 SAT 數學成績(平均數 517、標準差 100)逐步示範。本章也提醒:z 只呈現相對位置,不說明絕對表現;資料非常態時不能用 z 表求百分位,要改用排序法。","sections":[{"heading":"為什麼需要標準化","points":["生物考 65 分(滿分 100)、統計考 42 分(滿分 200),哪科較好?答對比例看是生物,但那忽略了考試難度與全班表現。","生物平均數 60、標準差 10,你高出 0.5 個標準差;統計平均數 37、標準差 5,同樣多 5 分卻高出整整 1 個標準差。","標準化就是把不同量尺的分數都換成標準差單位,放到同一把尺上比較。"]},{"heading":"z 分數的計算與解讀","points":["作法是原始分數減平均數再除以標準差;母體用 μ 與 σ,樣本用 X̄ 與 s。","原始分數高於平均數時 z 為正,低於時為負;全部分數標準化後,新分布的平均數必為 0、標準差必為 1。","z = −1.5 表示低於平均數 1.5 個標準差;z = 0.29 表示高出 0.29 個標準差,相對位置一目了然。","z 只說相對位置:拼字測驗 z = 1.0 聽來不錯,但若平均只答對 12 題(滿分 50)且其他受試者都是 7 歲小孩,意義就完全不同。"]},{"heading":"用 z 表在原始分數與百分位數之間互換","points":["附錄 A 以左欄(到小數一位)加頂列(小數第二位)定位 z,表中數字是常態分布中小於該 z 值的比例;1 減去它就是右尾機率(p 值)。","由百分位求原始分數:查出該比例對應的 z(第 90 百分位為 1.28),再代入 X = μ + zσ。","由原始分數求百分位:先算 z,再查表;z 表只列正值,負的 z 利用對稱性,看另一側尾端的面積即可。","求兩個分數之間的比例:兩個 z 分居平均數兩側時把兩塊面積相加,在同一側時以大減小。"]},{"heading":"例子:原始分數與 z 分數對照","points":["題目「測驗會顯示我有多聰明」(8 點量尺)平均數 5.38、標準差 2.35;最高分 z 僅 1.12,最低分 z 達 −1.86。","題目「考好很重要」平均數 7.28、標準差 1.33,嚴重偏態;答 1 的 7 人 z = −4.72,答滿分 8 的人 z 只有約 0.54。","高中生「成就趨近目標」(1–5 分)平均數 3.00、標準差 0.92,接近常態,z 分數對稱分布在 0 兩側(±1.08、±2.15)。","常態分布中 z 離 0 越遠就越少見;在偏態分布裡這條規則不一定成立。"]},{"heading":"限制與結語","points":["只有資料呈常態分布時,才能用 z 分數查表得到準確的百分位數。","非常態資料要求百分位,就把資料排序,直接找出上下各占指定比例的那個值,和第 2 章找中位數的方式相同。","z 表也讓我們知道某個數值有多罕見,這個想法在下一章會延伸到樣本平均數與標準誤。"]}],"concepts":[{"tw":"z 分數","en":"z score","note":"原始分數與平均數的距離,以標準差為單位表示。"},{"tw":"標準化","en":"standardization","note":"把分布中每個原始分數都轉成 z 分數的過程。"},{"tw":"標準分數","en":"standard score","note":"z 分數的另一個名稱;書中亦作「标准化值」。"},{"tw":"原始分數","en":"raw score","note":"變項實際測得、尚未轉換的觀察值。"},{"tw":"百分位數","en":"percentile score","note":"有特定比例的分數落在其下的那個分數,如第 90 百分位。"},{"tw":"標準常態分布","en":"standard normal distribution","note":"平均數 0、標準差 1 的常態分布,z 表即以此為據。"},{"tw":"p 值","en":"p value","note":"隨機得到某個統計值(或更極端)的機率;z 越大,p 越小。"},{"tw":"z 表(附錄 A)","en":"z table","note":"列出常態分布中小於各 z 值的面積比例。"}],"symbols":[{"sym":"z","meaning":"標準分數(z 分數)"},{"sym":"X","meaning":"原始分數"},{"sym":"μ","meaning":"母體平均數"},{"sym":"σ","meaning":"母體標準差"},{"sym":"X̄","meaning":"樣本平均數(見表 5-1 的說明)"},{"sym":"s","meaning":"樣本標準差(見表 5-1 的說明)"}],"formulas":[{"name":"z 分數(文字式)","expr":"z = (原始分數 − 平均數) / 標準差","note":"表 5-1 的文字版本"},{"name":"z 分數(母體)","expr":"z = (X − μ) / σ","note":"已知母體平均數與標準差時使用"},{"name":"z 分數(樣本)","expr":"z = (X − X̄) / s","note":"以樣本平均數與樣本標準差計算"},{"name":"由 z 換回原始分數","expr":"X = μ + (z)(σ)","note":"例:517 + 1.28 × 100 = 645"},{"name":"右尾機率","expr":"p = 1 − (z 表中小於 z 的比例)","note":"例:z = 0.15 時為 1 − 0.5596 = 0.4404"}],"example":{"title":"SAT 數學成績(μ = 517、σ = 100)的四種 z 分數計算","takeaway":"第 90 百分位:z = 1.28,X = 517 + 128 = 645。425 分:z = −0.92,約第 18 百分位。417 與 567 分之間(z = −1.00 與 0.50):0.3413 + 0.1915 = 53.28%。567 與 617 分同在平均數右側:0.3413 − 0.1915 = 14.98%。"},"pitfalls":["z 分數只說相對位置,不代表絕對表現好壞,還要看比較對象是誰、測驗有多難。","資料非常態時,不能用 z 表把 z 分數換成百分位,要改用排序法。","z 表只列正值;負的 z 靠對稱性處理,別把「小於 z 的比例」與「尾端比例」弄反。","兩分數在平均數兩側時面積相加,在同一側時相減,先畫圖再計算。"],"apa":null,"clinical":"兒童生長曲線就是 z 分數的應用:體重 z = −2 代表低於同齡同性別平均 2 個標準差,約第 2 百分位。骨密度的 Z 值、T 值也是同樣邏輯,把檢查結果換成可比較的相對位置。","quiz":[{"q":"兩科各比平均數高 5 分,為什麼其中一科的 z 分數可能是另一科的兩倍?","a":"因為 z 還要除以標準差。同樣高 5 分,標準差 10 的科目只有 z = 0.5,標準差 5 的科目則是 z = 1.0;分數越集中,相同差距代表的相對位置越突出。"},{"q":"某分布平均數 7.28、標準差 1.33,滿分是 8。為什麼最高分的 z 只有約 0.5?這告訴你什麼?","a":"因為平均數已經貼近量尺上限,滿分只比平均數多 0.72 分。這顯示分布嚴重負偏,z 分數在平均數兩側範圍不對稱,因此不能拿常態 z 表去換算百分位。"},{"q":"已知常態分布 μ = 517、σ = 100,如何求 417 到 567 分之間的比例?","a":"先算 z:417 為 −1.00、567 為 0.50。查表得平均數到兩個 z 的面積為 0.3413 與 0.1915;兩者分居平均數兩側,相加得 53.28%。"}],"slide":{"headline":"z 分數:共同的量尺","bullets":["z = (X − μ) / σ:離平均數幾個標準差","標準化後分布的平均數為 0、標準差為 1","常態時可用 z 表在分數與百分位間互換","非常態資料改用排序法求百分位"],"stat":{"num":"z = 1.28","label":"第 90 百分位"}},"title_tw":"標準化與 z 分數","brief":{"analogy_title":"換算匯率","analogy":"國文 80 分和數學 70 分不能直接比,就像台幣和日圓。z 分數把它們都換成同一種貨幣:離平均幾個標準差。","takeaways":["z = (分數 − 平均數) ÷ 標準差","換成 z 之後,平均數是 0、標準差是 1","資料接近常態時,z 可以直接查出百分位"],"table":{"caption":"常態分布下,z 分數對應的位置","head":["z","意思","大約贏過多少人"],"rows":[["−1","比平均低 1 個標準差","16%"],["0","剛好在平均","50%"],["+1","比平均高 1 個標準差","84%"],["+2","比平均高 2 個標準差","98%"]]}}},{"n":6,"title_en":"Standard Errors","pages":"56–68","one_liner":"標準誤是抽樣分布的標準差,量出樣本統計量因隨機抽樣而偏離母體的預期幅度。","summary":"本章處理推論統計最關鍵也最抽象的概念:標準誤。從同一母體反覆抽取相同大小的隨機樣本並各算平均數,這些平均數形成「平均數的抽樣分布」;其平均數稱為期望值(等於母體平均數),其標準差就是標準誤。實務上只有一個樣本,所以用標準差除以樣本數的平方根來估計:樣本越大、資料越集中,標準誤越小。中央極限定理保證樣本夠大時抽樣分布近似常態;母體標準差未知或樣本小時改用 t 分布。標準誤是多數推論統計量的分母,用來判斷樣本結果相對於隨機抽樣誤差是大是小。","sections":[{"heading":"標準誤的兩種定義","points":["技術定義:標準誤是某個統計量(平均數、兩平均數之差、相關係數等)抽樣分布的標準差。","實用定義:它是許多推論統計量公式的分母,代表從同一母體抽相同大小樣本時預期出現的隨機差異。","作者坦言許多學生甚至研究者都沒真正弄懂,但懂了它,t 檢定、變異數分析、迴歸係數、相關都會變得好理解。"]},{"heading":"平均數的抽樣分布與期望值","points":["想知道美國成年女性平均鞋碼,隨機抽 100 人;再抽另一組 100 人,平均鞋碼多半不同。抽 1000 組,就得到 1000 個平均數組成的分布。","小例子:5 名學生的母體,每次抽出放回地抽 2 人算平均(如 7.5、8、4.5),反覆進行就畫得出平均數的抽樣分布。","抽樣分布的平均數稱為平均數的期望值,等於母體平均數;抽樣分布的標準差就叫標準誤。","標準差是個別分數與平均數的平均距離;標準誤是個別樣本平均數與母體平均數的平均距離,也就是預期的抽樣誤差。"]},{"heading":"標準誤的計算與中央極限定理","points":["研究者通常只有一個樣本,只能把樣本當作母體的最佳猜測,再問:這個猜測預期會差多少?","兩個因素決定答案:樣本越大越接近母體,標準誤越小;樣本標準差越大,推測母體變異越大,標準誤越大。","公式是標準差除以樣本數的平方根:已知母體標準差用 σ,否則用樣本標準差 s 來估計。","中央極限定理:即使母體不是常態,只要樣本夠大(約 30 以上),平均數的抽樣分布也會近似常態;連 n = 2 的例子都已略具鐘形。"]},{"heading":"常態分布與 t 分布:z 與 t","points":["把 z 公式中的原始分數換成樣本平均數、標準差換成標準誤,就能求「抽到某個樣本平均數」的機率。","母體標準差未知時只能用樣本估計,算出的是 t 值而非 z;t 分布的形狀隨樣本數(自由度)改變,樣本越小,中央越扁、兩尾越厚。","樣本數超過約 120 時,t 分布與常態分布幾乎相同;t 的機率查附錄 B,依自由度找對應的列。","例:母體每週運動 60 分鐘,樣本平均 65、標準差 10。n = 144 時 t = 6.02、p \u003c .001;n = 25 時 t = 2.50、p 約 .02。"]},{"heading":"標準誤在推論統計中的角色","points":["多數推論統計量可概括成一個比值:樣本統計量的大小除以標準誤,問的是觀察到的現象比隨機抽樣誤差大多少。","男女樣本平均體重差 60 磅,若平均數差的抽樣分布標準誤為 10,比值為 6,這樣的差異很不可能只是隨機造成。","實例:標準差相近時,137 人的標準誤 0.12,546 人只有 0.06;同樣 137 人、標準差 23.81 時升到 2.04。","其他條件相同時,樣本越大,標準誤越小,z 或 t 越大,越容易達到統計顯著,下一章將深入討論。"]}],"concepts":[{"tw":"標準誤","en":"standard error","note":"統計量抽樣分布的標準差,即預期的抽樣誤差大小。"},{"tw":"抽樣分布","en":"sampling distribution","note":"反覆抽取同大小樣本,每次算出的統計量所形成的理論分布。"},{"tw":"平均數的抽樣分布","en":"sampling distribution of the mean","note":"由許多同大小隨機樣本的平均數組成的分布。"},{"tw":"平均數的期望值","en":"expected value of the mean","note":"抽樣分布的平均數,等於母體平均數。"},{"tw":"中央極限定理","en":"central limit theorem","note":"樣本夠大時,不論原分布形狀,平均數的抽樣分布趨近常態。"},{"tw":"t 分布","en":"t distribution","note":"形狀隨自由度改變的分布族;母體標準差未知或樣本小時使用。"},{"tw":"自由度","en":"degrees of freedom","note":"與樣本數直接相關的數字,用來在 t 表中找對應的列。"},{"tw":"統計顯著","en":"statistically significant","note":"樣本現象相對於標準誤夠大,不太可能只是隨機抽樣造成。"},{"tw":"平均數差的抽樣分布","en":"sampling distribution of the differences between the means","note":"反覆抽兩組樣本並算平均數之差所形成的分布。"}],"symbols":[{"sym":"s_x̄","meaning":"母體標準差未知時,由樣本標準差估計的平均數標準誤"},{"sym":"σ_x̄","meaning":"母體標準差已知時的平均數標準誤"}],"formulas":[{"name":"平均數標準誤(母體標準差已知)","expr":"σ_x̄ = σ / √n","note":"表 6-2;σ 為母體標準差"},{"name":"平均數標準誤(以樣本估計)","expr":"s_x̄ = s / √n","note":"表 6-2;s 為樣本標準差,n 為樣本數"},{"name":"樣本平均數的 z 分數(σ 已知)","expr":"z = (X̄ − μ) / σ_x̄","note":"表 6-3;機率查附錄 A"},{"name":"樣本平均數的 t 值(σ 未知)","expr":"t = (X̄ − μ) / s_x̄","note":"表 6-3;機率依自由度查附錄 B"},{"name":"推論統計量的共同形式","expr":"統計量 = 樣本統計量的大小 / 標準誤","note":"例:60 / 10 = 6"}],"example":{"title":"樣本數與標準差如何左右標準誤","takeaway":"題目「希望在測驗中考好」:小學生 s = 1.38、n = 137,標準誤 0.12;國中生 s = 1.46、n = 546,標準誤 0.06,差別幾乎全來自樣本數。改看小學生語文測驗分數,s = 23.81、n 仍為 137,標準誤升至 2.04:標準差越大,標準誤越大。"},"pitfalls":["標準誤不是標準差:前者描述樣本統計量的變動,後者描述個別分數的變動。","抽樣分布是理論上的分布,研究者實際上只有一個樣本,標準誤是估計出來的。","母體標準差未知或樣本小時應使用 t 分布,不該直接套用常態 z 表。","樣本越大標準誤越小,越容易顯著;顯著與否因此受樣本數左右。"],"apa":null,"clinical":"在兩間病房各量 30 位病人的收縮壓,兩個平均值不會一樣,這種樣本間的晃動就是標準誤。每間若改量 300 位,平均值會穩定得多;所以論文報告平均數時附上 SE,是在說明這個估計有多可靠。","quiz":[{"q":"標準差與標準誤描述的對象有何不同?","a":"標準差描述一個分布中個別分數離平均數的典型距離;標準誤描述抽樣分布中各個樣本平均數離母體平均數的典型距離,也就是用樣本估計母體時預期的誤差。"},{"q":"樣本平均 65、母體平均 60、s = 10。為什麼 n = 144 時 t = 6.02,n = 25 時只有 2.50?","a":"差距同為 5,但標準誤是 s / √n:n = 144 時約 0.83,n = 25 時為 2。分母越小 t 越大,所以大樣本下同樣的差距更不像隨機造成。"},{"q":"中央極限定理為什麼對推論統計很重要?","a":"計算機率需要抽樣分布為常態。該定理說明只要樣本夠大(約 30 以上),即使原始資料不是常態,平均數的抽樣分布也近似常態,因此仍可用常態或 t 分布求機率。"}],"slide":{"headline":"標準誤:推論統計的分母","bullets":["標準誤就是抽樣分布的標準差","s_x̄ = s / √n:樣本大、變異小則標準誤小","中央極限定理:n ≥ 30 時抽樣分布近似常態","σ 未知或小樣本改用 t 分布與自由度"],"stat":{"num":"s / √n","label":"平均數的標準誤"}},"title_tw":"標準誤","brief":{"analogy_title":"多舀幾匙湯","analogy":"每舀一匙,味道都會和上一匙差一點。標準誤量的就是「每一匙之間差多少」;匙子越大(樣本越大),每一匙越像整鍋。","takeaways":["標準誤是「樣本平均數」這個統計量的標準差","標準誤 = s ÷ √n:樣本越大,標準誤越小","中央極限定理:樣本夠大時,樣本平均數的分布會接近常態"],"table":{"caption":"標準差 vs 標準誤","head":["","標準差","標準誤"],"rows":[["描述的對象","個別分數彼此差多少","樣本平均數彼此差多少"],["公式","s","s ÷ √n"],["樣本變大時","大致不變","變小"],["用途","描述資料","做推論(檢定、信賴區間)"]]}}},{"n":7,"title_en":"Statistical Significance, Effect Size, and Confidence Intervals","pages":"69–87","one_liner":"判讀結果要三件一起看：p 值是否顯著、效應量多大、信賴區間落在哪。","summary":"本章說明如何從樣本推論母體。任何統計量都有抽樣分布與標準誤，因此能算出「虛無假設為真時，單靠抽樣碰巧得到此結果」的機率，即 p 值；p 小於事先選定的 α（慣例 0.05）就拒絕虛無假設，稱為統計顯著，但仍可能犯型一錯誤。顯著性檢定對樣本數極敏感：樣本大時微小差異也顯著，樣本小時大差異也不顯著。所以還要用效應量（以標準差為單位、不受樣本數影響）判斷實務重要性，並用信賴區間估計母體參數的可能範圍。三者並用再加上研究者的判斷，才是完整解讀。","sections":[{"heading":"敘述統計與推論統計、樣本與母體","points":["敘述統計只描述手上這批資料；推論統計則用樣本資料去推斷樣本所代表的更大母體。","統計顯著性衡量的是：樣本中觀察到的現象，有多大可能反映母體中真實存在的現象，而非抽樣的巧合。","社會科學研究常沒有把母體界定清楚，這會讓「結果可推論到誰」變得模糊，解讀時要留意。"]},{"heading":"機率、假設檢定與型一錯誤","points":["每個統計量（平均數、r、t、F、迴歸係數）都有抽樣分布與標準誤，據此可算出碰巧得到某統計值的機率。","鞋碼例子：母體平均 9、隨機樣本 n=1000 平均 10、標準差 2，標準誤約 0.06，t=16.67，p\u003c0.001。","虛無假設主張母體中沒有效應；對立假設可為雙尾（只說不同）或單尾（指定方向），都要在分析前先設定。","α 是研究者事前願意承擔的型一錯誤機率，慣例取 0.05，想更保守可取 0.01；p\u003cα 才拒絕虛無假設。","即使拒絕了虛無假設，仍可能是抽樣運氣造成的，這種把真的虛無假設拒絕掉的情形就是型一錯誤。"]},{"heading":"效應量：把樣本數的影響拿掉","points":["檢定統計量多半是「差異 ÷ 標準誤」，樣本越大標準誤越小、統計值越大，所以顯著性高度受樣本數左右。","IQ 例子：母體平均 100，樣本平均 105、標準差 15；n=25 時 t=1.67 不顯著，n=1600 時 t=13.33 高度顯著。","效應量 d 把分母由標準誤換成標準差，兩個樣本都得到 d=5/15=0.33，不隨樣本數改變。","書中引用的粗略標準：d 小於 0.20 為小、0.25–0.75 為中、超過 0.80 為大，但沒有硬性規則。","實務顯著性是主觀判斷：藥物死亡率的小效應很重要，冰淇淋口味的大效應對多數人無關緊要。"]},{"heading":"信賴區間：母體參數可能落在哪","points":["信賴區間以樣本統計值為中心，向兩側各加減「臨界 t 值 × 標準誤」，通常算 95% 或 99%。","因為區間向兩側展開，即使假設是單尾，也採用雙尾 α 對應的 t 值（df 無限大時為 1.96 與 2.576）。","鞋碼例子的 95% 區間為 9.88–10.12、99% 區間為 9.85–10.15，都不含 9，與顯著的檢定結果一致。","想要更高的把握就得把區間拉寬；樣本數越大，標準誤越小，區間也就越窄。"]},{"heading":"實例：成就表現目標的單一樣本 t 檢定","points":["以加州高中生樣本的表現目標量表平均（3.04）對照假定的全美母體平均 3.00，採雙尾對立假設。","SPSS 得 t=1.012、df=489、p=0.312，大於 0.05，因此保留虛無假設，結果不顯著。","樣本平均的 95% 區間 2.958–3.132 含 3.00；差異的區間 −0.042 到 0.132 含 0，結論相同。","效應量 d=0.0449/0.98≈0.05，極小；顯著性、信賴區間、效應量三者指向同一結論。"]}],"concepts":[{"tw":"統計顯著性","en":"statistical significance","note":"碰巧得到此結果的機率小於 α，於是拒絕虛無假設。"},{"tw":"p 值","en":"p value","note":"虛無假設為真時，單靠抽樣誤差得到這麼大統計值的機率。"},{"tw":"虛無假設","en":"null hypothesis","note":"主張母體中沒有差異或沒有關聯的基準假設。"},{"tw":"型一錯誤","en":"Type I error","note":"虛無假設其實為真，卻被我們拒絕了。"},{"tw":"α 水準（顯著水準）","en":"alpha level","note":"事前決定可容忍的型一錯誤機率，慣例 0.05。"},{"tw":"效應量（效果量）","en":"effect size","note":"以標準差為單位表示效應大小，不受樣本數影響。"},{"tw":"實務顯著性","en":"practical significance","note":"結果在真實世界是否重要，屬主觀判斷。"},{"tw":"信賴區間","en":"confidence interval","note":"以一定信心水準（如 95%）涵蓋母體參數的數值範圍。"},{"tw":"隨機抽樣誤差","en":"random sampling error","note":"單純因為抽到哪些人而造成樣本與母體的落差。"}],"symbols":[{"sym":"p","meaning":"p 值，機率"},{"sym":"α","meaning":"α 水準（顯著水準）"},{"sym":"d","meaning":"效應量的一種測度"},{"sym":"S","meaning":"計算效應量時所用的標準差"},{"sym":"∞","meaning":"無限大（自由度大於 120 時查表用的列）"},{"sym":"s_x̄","meaning":"用樣本標準差算出的標準誤"},{"sym":"σ_x̄","meaning":"用母體標準差算出的標準誤"},{"sym":"H₀","meaning":"虛無假設"},{"sym":"H_A 或 H₁","meaning":"對立假設"}],"formulas":[{"name":"平均數的標準誤","expr":"s_x̄ = s / √n","note":"樣本越大，標準誤越小"},{"name":"單一樣本 t 值","expr":"t = (X̄ − μ) / s_x̄","note":"差異以標準誤為單位"},{"name":"效應量 d","expr":"d = (X̄ − μ) / S，其中 S = s_x̄ × √n","note":"差異以標準差為單位，與 n 無關"},{"name":"95% 信賴區間","expr":"CI₉₅ = X̄ ± (t₉₅)(s_x̄)","note":"t₉₅ 為雙尾 α=0.05 的臨界 t 值"},{"name":"99% 信賴區間","expr":"CI₉₉ = X̄ ± (t₉₉)(s_x̄)","note":"t₉₉ 為雙尾 α=0.01 的臨界 t 值"},{"name":"雙尾假設","expr":"H₀: μ = X̄ ；H_A: μ ≠ X̄","note":"單尾時對立假設寫成 μ \u003c X̄ 之類的方向式"}],"example":{"title":"加州高中生「表現目標」動機量表的單一樣本 t 檢定","takeaway":"以 5 題、1–5 分的表現目標量表調查加州高中生，樣本平均 3.04、標準差 0.98，與假定的全美平均 3.00 比較。t(489)=1.012、p=0.312，不顯著；95% 信賴區間 2.958–3.132 涵蓋 3.00；效應量 d≈0.05。三項指標一致：加州學生與全美學生沒有實質差別。"},"pitfalls":["統計顯著不等於實務上重要：樣本很大時，IQ 差 1 分也會顯著。","不顯著不等於沒有效應：n=4 時 IQ 差 15 分也達不到顯著。","拒絕虛無假設仍可能是型一錯誤；p 值只是機率，不是證明。","效應量大小的門檻只是參考，重要與否要看研究情境與利害關係人。"],"apa":"加州高中生在表現目標量表的平均分數（M = 3.04, SD = 0.98）與全美假定平均 3.00 無顯著差異，t(489) = 1.01, p = .31, d = 0.05, 95% CI [2.96, 3.13]。","clinical":"比較新舊敷料的傷口癒合天數時，若收案數千人，差 0.2 天也可能 p\u003c0.05；此時要看效應量與信賴區間，判斷這點差距是否值得改變病房常規與成本。","quiz":[{"q":"兩個研究的平均差與標準差完全相同，為什麼一個顯著、一個不顯著？","a":"因為樣本數不同。標準誤等於標準差除以樣本數的平方根，樣本大則標準誤小、t 值大、p 值小；效應量 d 不含樣本數，所以兩者 d 相同。"},{"q":"95% 信賴區間不包含虛無假設所設定的母體值，代表什麼？","a":"代表在 α=0.05 的雙尾檢定下結果達統計顯著，樣本很可能不是來自該假定母體；鞋碼例子的區間 9.88–10.12 不含 9 就是如此。"},{"q":"把 α 從 0.05 改成 0.01 有什麼意義與代價？","a":"代表願意承擔的型一錯誤機率由 5% 降到 1%，判定更保守；代價是需要更小的 p 值才能拒絕虛無假設，對應的信賴區間也會變寬。"}],"slide":{"headline":"顯著性、效應量、信賴區間","bullets":["p 值：虛無假設為真時碰巧得到此結果的機率","p \u003c α（慣例 0.05）才拒絕虛無假設，仍可能犯型一錯誤","效應量 d 以標準差為單位，不被樣本數放大","信賴區間給出母體參數的範圍，三者要一起解讀"],"stat":{"num":"p \u003c .05","label":"慣用顯著門檻"}},"title_tw":"統計顯著性、效應量與信賴區間","brief":{"analogy_title":"法庭審判","analogy":"虛無假設就像「被告無罪」。p 值很小,代表證據強到不像巧合,才判有罪。但有罪不等於罪很重,罪多重要看效應量。","takeaways":["p 值回答:這個結果可能只是抽樣的巧合嗎?","效應量回答:差異到底有多大?","信賴區間回答:母體的真實數值大概落在哪?"],"table":{"caption":"三個工具各回答一個問題","head":["工具","回答的問題","怎麼看","提醒"],"rows":[["統計顯著性","是不是巧合?","p \u003c α 就拒絕虛無假設","樣本很大時,很小的差異也會顯著"],["效應量","差多少?","例:Cohen's d = 平均數的差 ÷ 標準差","不會因樣本數變大而膨脹"],["信賴區間","真值在哪?","估計值 ± 臨界值 × 標準誤","越窄代表估計越精確"]]}}},{"n":8,"title_en":"Correlation","pages":"88–103","one_liner":"相關係數說明兩變項關係的方向與強度，r² 是共享變異比例，但相關不是因果。","summary":"本章主角是皮爾森積差相關係數 r：介於 −1 與 +1，正負號表示方向，絕對值表示強度；它是兩變項 z 分數交乘積的平均，也就是標準化的共變數。作者強調其限制：r 只描述「平均而言」的線性關係，遇到曲線關係或分數範圍被截斷會低估關聯，而且相關不能證明因果，可能有第三變項作用。接著說明用 t 分布檢定 r 是否顯著異於 0（df = N − 2），以及把 r 平方得到決定係數，即兩變項共享的變異比例。最後簡介點二系列、phi 與斯皮爾曼三種特殊相關。","sections":[{"heading":"相關的用途：方向與強度","points":["皮爾森 r 要求兩個變項都是等距或比率尺度的連續變項，且每位受試者的兩個分數必須成對。","正相關表示兩變項平均而言同向變動，負相關表示反向變動；「平均而言」代表不必對每個人都成立。","r 的範圍是 −1.00 到 +1.00，0 代表沒有關係；社會科學實際研究中多落在 −0.70 到 +0.70 之間。","粗略標準：絕對值小於 0.20 為弱、0.20–0.50 為中、大於 0.50 為強，但仍須看議題的重要性來判斷。","散布圖把每個人在兩變項上的分數畫成一點，可直接看出關係的方向、強弱與有無規律。"]},{"heading":"皮爾森 r 怎麼算、代表什麼","points":["書中採定義式：先把兩變項都轉成 z 分數，逐人相乘得交乘積，加總後除以配對數 N。","兩個分數同在平均之上或同在平均之下時交乘積為正，一高一低時為負，加總後的正負決定 r 的方向。","原始分數交乘積的平均就是共變數；先標準化再求平均，得到的標準化共變數就是相關係數。","作者建議實際計算交給計算機或統計軟體，重點是理解公式背後的邏輯。"]},{"heading":"相關說了什麼、沒說什麼","points":["相關不等於因果：鸛鳥數量與嬰兒出生數同時上升，其實都源自寒冬這個第三變項。","相關是主張因果的必要條件但不充分；吸菸與癌症要先有相關，還得排除其他因素才能談因果。","r 只捕捉直線關係；焦慮與表現先升後降的曲線關係，算出的 r 會很小而低估真實關聯。","截斷的分數範圍會壓低相關：考試太簡單造成天花板效應，讀書時間與分數看起來就沒關係。"]},{"heading":"顯著性檢定與決定係數","points":["檢定的虛無假設是母體相關 ρ 等於 0，對立假設是 ρ 不等於 0，使用 t 分布，自由度為 N − 2。","日照時數與情緒的例子：N=100、r=0.25，算得 t=2.56、df=98，雙尾 p 介於 0.01 與 0.02 之間，達顯著。","即使顯著仍不能說日照造成好心情，氣溫較暖可能才是真正原因，再次提醒相關非因果。","決定係數是 r 的平方，表示一個變項的變異有多少比例可由另一變項解釋，即兩者的共享變異。","r=0.30 時 r²=0.09，r=0.55 時 r²=0.30；相關越強，重疊的變異越多，但這仍不代表因果。"]},{"heading":"其他相關係數","points":["點二系列相關：一個連續變項配一個二分變項，例如有無汽車與交通規則筆試分數。","phi 係數：兩個變項都是二分變項，例如性別與是否吸菸；這類資料也可以用卡方分析。","斯皮爾曼 rho：兩個變項都是次序（排名）資料，例如在校成績排名與標準化測驗排名。","這三種都是皮爾森 r 在特定測量尺度下的特殊版本，數值與解讀方式都和 r 很相近。"]}],"concepts":[{"tw":"皮爾森積差相關係數","en":"Pearson product-moment correlation coefficient","note":"描述兩個連續變項線性關係方向與強度的統計量 r。"},{"tw":"相關不等於因果","en":"causation","note":"兩變項一起變動，不代表其中一個造成另一個。"},{"tw":"決定係數","en":"coefficient of determination","note":"r 的平方，一變項變異可被另一變項解釋的比例。"},{"tw":"共變數","en":"covariance","note":"交乘積的平均；標準化之後就是相關係數。"},{"tw":"共享變異量","en":"shared variance","note":"兩個相關變項彼此重疊的那部分變異。"},{"tw":"曲線關係","en":"curvilinear","note":"關係在某段為正、另一段為負，r 會低估其強度。"},{"tw":"全距限縮（截斷範圍）","en":"truncated range","note":"分數擠在頂端或底端，變異不足而壓低相關。"},{"tw":"散布圖","en":"scattergram","note":"把每人兩個變項的分數畫成一個點的圖。"},{"tw":"斯皮爾曼等級相關","en":"Spearman rho coefficient","note":"兩個次序變項之間的相關係數。"}],"symbols":[{"sym":"r","meaning":"樣本的皮爾森相關係數"},{"sym":"ρ","meaning":"母體相關係數"},{"sym":"s_r","meaning":"相關係數的標準誤"},{"sym":"r²","meaning":"決定係數"},{"sym":"df","meaning":"自由度"},{"sym":"Φ","meaning":"phi 係數，兩個二分變項之間的相關"}],"formulas":[{"name":"皮爾森相關係數（定義式）","expr":"r = Σ(z_x · z_y) / N","note":"z 分數交乘積的平均；N 為配對數"},{"name":"相關係數的假設","expr":"H₀: ρ = 0 ；H₁: ρ ≠ 0","note":"檢定 r 是否顯著異於 0"},{"name":"相關係數的標準誤","expr":"s_r = √( (1 − r²) / (N − 2) )","note":"書中僅供了解，實算用下式"},{"name":"相關係數的 t 檢定","expr":"t = (r − ρ) / s_r = r · √( (N − 2) / (1 − r²) )，df = N − 2","note":"虛無假設下 ρ = 0"},{"name":"決定係數","expr":"r² = r × r","note":"共享（可解釋）變異的比例"}],"example":{"title":"高中生學業成績平均（GPA）與 Naglieri 非語文能力測驗的相關","takeaway":"加州一所高中 314 名十一年級學生的累積 GPA 與 Naglieri 非語文能力測驗分數，r=0.4291、p\u003c0.0001，為中等且顯著的正相關。r²≈0.18，GPA 只解釋測驗分數約 18% 的變異，逾 80% 未被解釋，故作者認為教師評分與標準化測驗測到的是不同構念。"},"pitfalls":["顯著的相關不代表因果，可能有第三變項同時影響兩者（鸛鳥與嬰兒、日照與氣溫）。","r 只反映直線關係，曲線關係會讓 r 接近 0 而被誤判為無關。","天花板或地板效應使分數範圍被截斷，會低估真實的相關強度。","強弱門檻只是經驗法則：酒精與肝病的 r=0.15 也可能非常重要。"],"apa":"GPA 與 Naglieri 測驗分數呈中等強度且顯著的正相關，r = .43, p \u003c .001；決定係數 r² = .18，表示測驗分數約 18% 的變異可由 GPA 解釋。（書中指出報告相關時很少附 t 值。）","clinical":"護理人員每月夜班數與疲勞量表分數若 r=0.40，只能說夜班多的人平均較疲勞（共享 16% 變異），不能直接說夜班造成疲勞，年資、家庭照顧負荷都可能是第三變項。","quiz":[{"q":"兩變項的 r 接近 0，可以斷定它們沒有關係嗎？","a":"不行。r 只衡量線性關係，若關係是先升後降的曲線，或其中一個變項的分數範圍被截斷，r 都會很小，卻不代表兩者真的無關，應先看散布圖。"},{"q":"r = 0.25、N = 100 的相關達顯著，這個關係算強嗎？","a":"不算強。r² 只有 0.0625，即約 6% 的共享變異；它顯著主要是因為樣本夠大（t=2.56、df=98）。顯著性與關係強度是兩回事。"},{"q":"為什麼說相關係數是「標準化的共變數」？","a":"共變數是兩變項離均差交乘積的平均，單位受原始量尺影響；先把兩變項轉成 z 分數再求交乘積平均，就消除了單位，結果被限制在 −1 到 +1，這就是 r。"}],"slide":{"headline":"相關：方向、強度與限制","bullets":["r 介於 −1 與 +1，正負號看方向、絕對值看強度","r 是 z 分數交乘積的平均，即標準化共變數","r² 為決定係數，表示兩變項共享的變異比例","相關非因果；曲線關係與截斷範圍會低估 r"],"stat":{"num":"r²","label":"共享變異比例"}},"title_tw":"相關","brief":{"analogy_title":"冰淇淋與溺水","analogy":"夏天冰淇淋銷量和溺水人數一起上升,但不是冰淇淋害人溺水,是天氣熱同時推高了兩者。相關不等於因果。","takeaways":["r 介於 −1 到 +1:符號看方向,絕對值看強度","r² 是兩個變項共享的變異比例","r 只抓直線關係,也會受極端值與全距受限影響"],"table":{"caption":"四種常見型態","head":["型態","長相","例子"],"rows":[["正相關","一起高、一起低","讀書時數與成績"],["負相關","一個高、另一個低","缺課次數與成績"],["零相關","看不出直線關係","鞋子尺寸與成績"],["曲線關係","先升後降;r 會低估","焦慮程度與表現"]]}}},{"n":9,"title_en":"t Tests","pages":"104–117","one_liner":"t 檢定就是把兩個平均數的差，除以這個差的標準誤，看它是否大到不像巧合。","summary":"本章介紹兩種 t 檢定，兩者都比較兩個平均數，也都靠 t 分布求機率；母體標準差未知且樣本不大時，須用隨樣本數改變形狀的 t 分布。獨立樣本 t 檢定比較兩個互不重疊的組別，關鍵是「平均數差異的標準誤」，即反覆抽樣時兩平均數預期的差距，自由度 n₁ + n₂ − 2，並假設兩組變異數相近。相依（成對）樣本 t 檢定比較同一群人的兩次測量或配對樣本，以每對分數的差值計算標準誤，自由度為配對數減 1。樣本大時小差異也顯著，仍要看原始差距與效應量。","sections":[{"heading":"什麼是 t 檢定與 t 分布","points":["日常說法是比較兩個平均數是否顯著不同；較技術的定義是任何利用 t 分布（Student's t）進行的統計檢定。","要用常態分布求精確機率，須知道母體標準差或樣本夠大（n>120）；否則改用依樣本數調整的 t 分布族。","獨立樣本 t 檢定需要一個只有兩類的類別自變項，以及一個連續（等距尺度）的依變項。","相依樣本 t 檢定用於同一樣本的前後兩次測量，或兩個彼此配對的樣本，例如兒子與其父親的分數。"]},{"heading":"獨立樣本 t 檢定詳解","points":["核心問題：兩樣本平均數的觀察差異，相對於單純抽樣就會出現的預期差異（標準誤）而言夠不夠大。","兩組人數相近時，差異的標準誤約由兩組各自的平均數標準誤合併而成；人數不等時須按各組貢獻加權調整。","檢定假設兩組變異數大致相等；若變異數差很多、人數懸殊或資料非常態，可改用曼-惠特尼 U 檢定。","電視節目例子：男 7.5、女 6.5，各 50 人，標準誤 0.40，t=2.50、df=98，雙尾 p 介於 0.01 與 0.02。","查表時自由度介於兩列之間就取較小的那列（df=60），這樣比較保守；同例效應量 d=1.0/2.83=0.35。"]},{"heading":"相依（成對）樣本 t 檢定詳解","points":["與獨立樣本的差別在於：這裡比較的是同一批人在兩個變項（如休假前、休假後）上的平均數。","工廠例子：30 名工人休假前一週平均生產 250 件，休假後一週 300 件，要問這 50 件的差是否顯著。","先算每一對分數的差值 D，求這些差值的標準差，再除以配對數的平方根，得到差異的標準誤。","自由度是配對數減 1（30 對即 df=29）；父子這類配對樣本的算法相同，只要確保分數正確配對。"]},{"heading":"實例：性別與年級的 GPA 比較","points":["獨立樣本：六年級男生 361 人平均 6.58、女生 349 人平均 8.14，差 −1.56，標準誤 0.210，t(708)=−7.45。","Levene 檢定 F=0.639、p=0.424，兩組變異數無顯著差異，所以讀「變異數相等」那一列的結果。","SPSS 顯示 p=0.000 不代表機率為零，只是小於 0.001；t 分布對稱，雙尾檢定時負號不影響判斷。","相依樣本：689 名學生五年級 GPA 8.08、六年級 7.35，差 0.73，標準誤 0.089，t(688)=8.19，p\u003c0.001。","兩個結果都顯著，但作者提醒樣本很大，量表上 0.73 或 1.56 分的差距是否重要，仍要靠效應量與判斷。"]}],"concepts":[{"tw":"獨立樣本 t 檢定","en":"independent samples t test","note":"比較兩個互不相干組別在同一變項上的平均數。"},{"tw":"相依（成對）樣本 t 檢定","en":"dependent (paired) samples t test","note":"比較同一群人兩次測量或配對樣本的平均數。"},{"tw":"平均數差異的標準誤","en":"standard error of the difference between the means","note":"反覆抽樣時兩個樣本平均數之間預期的差距。"},{"tw":"t 分布","en":"t distribution","note":"形狀隨自由度改變的一族分布，樣本小時取代常態分布。"},{"tw":"自由度","en":"degrees of freedom","note":"獨立樣本為 n₁+n₂−2，相依樣本為配對數−1。"},{"tw":"自變項與依變項","en":"independent / dependent variable","note":"t 檢定的自變項是兩類的類別變項，依變項為連續變項。"},{"tw":"變異數同質性（Levene 檢定）","en":"Levene's test for equality of variances","note":"檢查兩組變異數是否相近，決定讀 SPSS 哪一列。"},{"tw":"效應量","en":"effect size","note":"把平均數差異換算成標準差單位，判斷實務重要性。"}],"symbols":[{"sym":"s_(x̄₁−x̄₂)","meaning":"兩個獨立樣本平均數差異的標準誤"},{"sym":"s_D̄","meaning":"兩個相依或成對樣本平均數差異的標準誤"},{"sym":"s_D","meaning":"兩個相依或成對樣本差值的標準差"},{"sym":"df","meaning":"自由度"},{"sym":"t","meaning":"t 值"}],"formulas":[{"name":"獨立樣本 t 值","expr":"t = (X̄₁ − X̄₂) / s_(x̄₁−x̄₂)，df = n₁ + n₂ − 2","note":"觀察差異除以差異的標準誤"},{"name":"差異的標準誤（兩組人數相近）","expr":"s_(x̄₁−x̄₂) = √( s_x̄₁² + s_x̄₂² )","note":"合併兩組各自的平均數標準誤"},{"name":"獨立樣本 t 檢定的效應量","expr":"d = (X̄₁ − X̄₂) / Ŝ，其中 Ŝ = √n₁ × s_(x̄₁−x̄₂)","note":"書中例：√50×0.40=2.83，d=0.35"},{"name":"相依樣本 t 值","expr":"t = (X̄ − Ȳ) / s_D̄，df = N − 1","note":"N 為配對數"},{"name":"相依樣本差異的標準誤","expr":"s_D̄ = s_D / √N","note":"差值的標準差除以配對數平方根"},{"name":"差值的標準差","expr":"s_D = √( ( ΣD² − (ΣD)² / N ) / (N − 1) )，D = X − Y","note":"D 為每一對分數的差"}],"example":{"title":"Midgley 等人縱貫研究的學生 GPA：男女比較與五、六年級比較","takeaway":"獨立樣本：六年級男生（n=361, M=6.58）與女生（n=349, M=8.14），Levene 檢定不顯著，t(708)=−7.45、p\u003c0.001，女生較高。相依樣本：689 名學生五年級 GPA 8.08、六年級 7.35，t(688)=8.19、p\u003c0.001，顯著下降。樣本大，仍須評估實務重要性。"},"pitfalls":["同一群人的前後測要用相依樣本 t 檢定，誤用獨立樣本會算錯標準誤與自由度。","獨立樣本 t 檢定假設兩組變異數相近；違反且人數懸殊時要看調整列或改用無母數方法。","SPSS 的 p=0.000 不是機率為零，應寫成 p\u003c0.001。","樣本大時小差異也會顯著，要回頭看原始分數差距與效應量。"],"apa":"以相依樣本 t 檢定比較學生五年級與六年級的 GPA，差異達顯著，t(688) = 8.19, p \u003c .001；五年級（M = 8.08）高於六年級（M = 7.35）。獨立樣本寫法相同：t(708) = −7.45, p \u003c .001，並附兩組平均數。","clinical":"比較實驗病房與對照病房病人的疼痛分數，用獨立樣本 t 檢定；同一批病人衛教前後的自我照顧分數，則用成對樣本 t 檢定，因為每個人自己就是自己的對照。","quiz":[{"q":"獨立樣本與相依樣本 t 檢定的自由度為何不同？","a":"獨立樣本有兩組各自估計平均數，自由度為 n₁+n₂−2；相依樣本實際分析的是一組差值，只估計一個平均差，所以是配對數減 1。例如 689 對分數的 df 為 688。"},{"q":"「平均數差異的標準誤」為 0.40 是什麼意思？","a":"表示若母體之間其實沒有差異，反覆隨機各抽 50 人，兩樣本平均數之間平均會相差約 0.40 分。觀察到的差 1.0 是它的 2.5 倍，所以 t=2.50。"},{"q":"SPSS 的獨立樣本輸出有「變異數相等」與「不相等」兩列，怎麼選？","a":"先看 Levene 檢定。p 大於 0.05（如書中 p=0.424）表示兩組變異數無顯著差異，讀相等那一列；若顯著，則讀不相等那一列，其自由度已被調小。"}],"slide":{"headline":"t 檢定：比較兩個平均數","bullets":["t = 兩平均數的差 ÷ 差異的標準誤","獨立樣本：兩組不同的人，df = n₁ + n₂ − 2","相依樣本：同一群人或配對，df = 配對數 − 1","顯著之後還要看原始差距與效應量"],"stat":{"num":"n₁ + n₂ − 2","label":"獨立樣本自由度"}},"title_tw":"t 檢定","brief":{"analogy_title":"兩家早餐店的排隊時間","analogy":"兩家店平均差 2 分鐘,算不算真的不同?要看每天的波動有多大。把「差距」除以「波動」,得到的就是 t。","takeaways":["獨立樣本:比較兩組不同的人","相依樣本:同一批人前後比,或配對的人互比","t 越大(差距相對於誤差越大),越可能顯著"],"table":{"caption":"獨立樣本 vs 相依樣本","head":["","獨立樣本 t 檢定","相依(成對)樣本 t 檢定"],"rows":[["資料","兩組不同的人","同一批人量兩次,或配對樣本"],["例子","男生 vs 女生","前測 vs 後測"],["分母","兩組平均數差異的標準誤","差異分數的標準誤"],["自由度","n₁ + n₂ − 2","配對數 − 1"]]}}},{"n":10,"title_en":"One-Way Analysis of Variance","pages":"118–133","one_liner":"比三組以上平均數時,用組間對組內變異的 F 比率一次檢定,再靠事後比較找出誰不同。","summary":"單因子變異數分析(one-way ANOVA)用來比較兩組以上在同一連續依變項上的平均數。兩組時它與獨立樣本 t 檢定結論相同(F 是 t 的平方),但三組以上若做多次 t 檢定,型一錯誤的機會會累積,所以改用 ANOVA。核心是把總變異拆成組間與組內(誤差)兩塊:先算平方和,除以自由度得均方,兩個均方相除即 F 值,再查表判斷顯著性。F 顯著只代表至少有兩組不同,還要用 Tukey HSD 等事後比較或事前比較找出差異所在,並以 η² 說明分組解釋了多少變異。","sections":[{"heading":"何時用單因子 ANOVA、為何不做多次 t 檢定","points":["需要一個類別(名義)自變項把人分成至少兩個獨立組別,以及一個連續依變項,例如三種洋芋片口味的 1–7 分喜好評分。","只比兩組時 t 檢定與 ANOVA 結論一致,F 值就是 t 值的平方,所以研究者通常在三組以上才改用 ANOVA。","三組兩兩做 t 檢定要下三次顯著性判斷,每次都帶一點犯錯機率,次數越多型一錯誤越容易發生;ANOVA 會把比較的組數納入調整。"]},{"heading":"拆解變異:平方和、均方與 F 值","points":["個別分數與所屬組平均數的差距視為隨機誤差(組內);各組平均數與總平均數的差距則是組間離差,兩者相加等於個別分數到總平均數的總離差。","誤差平方和 SSe 是各組內離差平方的加總;組間平方和 SSb 是各組平均數與總平均數差的平方乘上該組人數後加總;SST = SSb + SSe。","平方和要除以自由度才能公平比較:組間自由度 K − 1、誤差自由度 N − K,得到 MSb 與 MSe,再相除得 F。","F 與 t 的邏輯相同:分子是組平均數之間的平均差異,分母是組內平均變異,只是都改用平方的形式。","查 F 分布表(附錄 C)需要組間與誤差兩個自由度;觀察到的 F 大於臨界值,才判定各組平均數有顯著差異。"]},{"heading":"事後比較與事前比較","points":["顯著的 F 只說明至少有兩組平均數不同,沒有指出是哪幾組,必須再做事後比較逐對檢查。","各種事後比較都是兩組平均數相減再除以標準誤,差別在標準誤怎麼算、嚴格或寬鬆;本書只示範 Tukey HSD。","Tukey HSD 的標準誤為 √(MSe / ng),結果對照學生化全距統計量的臨界值(附錄 D,依組數與誤差自由度查表)。","Tukey HSD 假設各組人數相同,組別人數不等時就不是最理想的事後比較方法。","事前比較是依研究假設事先規劃的對比,可把幾組合併後再比,例如把兩個美國城市合併與兩個歐洲城市比披薩喜好。"]},{"heading":"效應量 η² 與 SPSS 報表","points":["除了 d 之外,另一種效應量是依變項變異中被自變項解釋的比例,即 η²,概念上與決定係數 r² 相同。","虛構的藥物實驗:75 名三年級生分成大劑量、小劑量、安慰劑三組,學習興趣平均為 2.76、3.60、2.60。","報表中組間 MS = 7.213(df = 2)、誤差 MS = 1.341(df = 72),F = 5.379、p = .007、η² = .130,分組解釋 13% 的變異。","Tukey 結果:小劑量組顯著高於大劑量組(p = .033)與安慰劑組(p = .009),後兩組之間沒有差異。"]},{"heading":"手算範例與總結","points":["以 5、8、12 歲三組各 5 人對泡泡糖口味冰淇淋的喜好為例,依九個步驟從組平均數一路算到 F 值並查表。","作者提醒本章只是最基本的模型,真實研究各組人數常不相等,計算會更複雜,需要另外閱讀進階教材。","ANOVA 串起前面章節:離差平方和來自變異數、組平均數比較類似 t 檢定、η² 則呼應共享變異與效應量的概念。"]}],"concepts":[{"tw":"F 值","en":"F value / F ratio","note":"組間均方除以誤差均方;組間差異相對於組內雜訊有多大。"},{"tw":"組間與組內變異","en":"between-group / within-group","note":"總變異拆成兩塊:組平均數之間的差異,與同組內個體之間的差異。"},{"tw":"平方和","en":"sum of squares","note":"離差平方的加總;SST = SSb + SSe 是 ANOVA 的關鍵等式。"},{"tw":"均方","en":"mean square","note":"平方和除以自由度,把總量換成平均量後才能相除成 F。"},{"tw":"型一錯誤膨脹","en":"Type I error inflation","note":"t 檢定做越多次,誤判為顯著的機會越高,這是改用 ANOVA 的理由。"},{"tw":"事後比較","en":"post hoc tests","note":"F 顯著後逐對比較各組平均數,找出究竟哪幾組不同。"},{"tw":"Tukey HSD","en":"Tukey honestly significant difference","note":"常用事後比較;兩組平均數差除以 √(MSe/ng),對照學生化全距臨界值。"},{"tw":"事前比較","en":"a priori contrasts","note":"依假設事先計畫的特定對比,可將數組合併後再比較。"},{"tw":"η² 效應量","en":"eta squared","note":"依變項變異中可由分組解釋的比例,性質等同決定係數。"}],"symbols":[{"sym":"MSw","meaning":"組內均方"},{"sym":"MSe","meaning":"誤差均方"},{"sym":"MSb","meaning":"組間均方"},{"sym":"SSe","meaning":"誤差平方和(即組內平方和)"},{"sym":"SSb","meaning":"組間平方和"},{"sym":"SST","meaning":"總平方和"},{"sym":"X̄_T","meaning":"總平均數"},{"sym":"F","meaning":"F 值"},{"sym":"df","meaning":"自由度"},{"sym":"K","meaning":"組數"},{"sym":"N","meaning":"所有組合併後的總人數"},{"sym":"n","meaning":"某一組的人數(計算組間平方和時用)"},{"sym":"ng","meaning":"每組人數(Tukey HSD 用)"}],"formulas":[{"name":"F 值","expr":"F = MSb / MSe","note":"組間均方除以誤差均方(組內均方)"},{"name":"誤差平方和","expr":"SSe = Σ(X − X̄₁)² + Σ(X − X̄₂)² + … + Σ(X − X̄_k)²","note":"各組內個別值與該組平均數的離差平方,全部加總"},{"name":"組間平方和","expr":"SSb = Σ[ n (X̄ − X̄_T)² ]","note":"組平均數減總平均數,平方後乘該組人數再加總"},{"name":"總平方和","expr":"SST = Σ(X − X̄_T)² = SSb + SSe","note":"ANOVA 拆解變異的核心等式"},{"name":"均方","expr":"MSb = SSb / (K − 1);MSe = SSe / (N − K)","note":"平方和除以各自的自由度"},{"name":"Tukey HSD","expr":"Tukey HSD = (X̄₁ − X̄₂) / s_x̄,s_x̄ = √( MSe / ng )","note":"各組人數相同時,每對比較共用同一個標準誤"}],"example":{"title":"5 歲、8 歲、12 歲孩子對泡泡糖口味冰淇淋的喜好","takeaway":"三組各 5 人以 1–5 分評分,平均 4.2、3.8、2.4,總平均 3.47。SSe = 10.8、SSb = 8.90,MSe = 0.90、MSb = 4.45,F = 4.94,大於臨界值 3.88。Tukey 值 0.95、4.29、3.33 中只有 5 歲對 12 歲超過 3.77,僅這一對顯著不同。"},"pitfalls":["F 顯著只代表至少有兩組平均數不同,不能直接說每一組都不同,必須做事後比較。","三組以上不要用多次 t 檢定取代 ANOVA,型一錯誤機率會隨檢定次數累積。","Tukey HSD 的標準誤假設各組人數相等;組別人數不等時應改用其他事後比較。","統計顯著不等於效果大,還要看 η² 解釋了多少比例的變異。"],"apa":"以單因子變異數分析比較三個年齡組的喜好程度,組間差異達顯著,F(2, 12) = 4.94, p \u003c .05;Tukey 事後比較顯示僅 5 歲組(M = 4.20)顯著高於 12 歲組(M = 2.40)。","clinical":"比較三種翻身頻率(每 2、3、4 小時)病人的壓傷風險評分時,先用單因子變異數分析看整體是否有差異,顯著後再以 Tukey 找出哪兩種頻率之間不同,而不是直接跑三次 t 檢定。","quiz":[{"q":"為什麼比較三組平均數時,不建議直接做三次獨立樣本 t 檢定?","a":"每做一次檢定都有機會把其實不存在的差異誤判為顯著,做三次等於讓型一錯誤的機會累積變大;ANOVA 以單一 F 檢定並把組數納入自由度來控制這個問題。"},{"q":"計算組間平方和時,為什麼要把每組的離差平方乘上該組人數?","a":"因為組平均數與總平均數的差距是該組每一個人共同貢獻的,乘上人數才近似反映整組所有成員對組間差異的總貢獻,也才能讓 SSb 與 SSe 相加等於 SST。"},{"q":"某研究 F 顯著、η² = .13,而三組中有兩組平均數幾乎相同,該如何解讀?","a":"F 顯著只表示至少一對組別不同,可能是其中一組特別高或低所致;需靠事後比較確認是哪一對,並說明分組約解釋依變項 13% 的變異。"}],"slide":{"headline":"ANOVA:一個 F 比多組","bullets":["三組以上不做多次 t 檢定,避免型一錯誤膨脹","總變異 = 組間 + 組內,SST = SSb + SSe","平方和除以自由度得均方,F = MSb / MSe","F 顯著後用 Tukey HSD 找差異,並報告 η²"],"stat":{"num":"F = MSb / MSe","label":"組間對組內的比"}},"title_tw":"單因子變異數分析","brief":{"analogy_title":"三個班的成績","analogy":"班與班之間的差距(組間),如果遠大於同班同學彼此的差距(組內),才能說這三個班真的不一樣。","takeaways":["F = 組間均方 ÷ 組內均方","連做好幾次 t 檢定會讓型一錯誤膨脹,所以改用一次 ANOVA","F 顯著只說「至少有一組不同」,要做事後比較才知道是哪幾組"],"table":{"caption":"ANOVA 把變異切成兩塊","head":["來源","在量什麼","自由度"],"rows":[["組間","各組平均數離總平均多遠","組數 − 1"],["組內(誤差)","每個人離自己那組的平均多遠","總人數 − 組數"],["F","組間均方 ÷ 組內均方","用兩個自由度查 F 表"]]}}},{"n":11,"title_en":"Factorial Analysis of Variance","pages":"134–148","one_liner":"兩個以上類別自變項同時進模型,可看控制彼此後的主要效果,更能看見交互作用。","summary":"多因子變異數分析(factorial ANOVA)處理一個連續依變項與兩個以上類別自變項,同樣是拆解依變項的變異。它提供三類結果:各自變項的主要效果、自變項之間的交互作用,以及比較個別細格的單純主要效果。比起分開做幾次單因子分析,它的每個主要效果都已排除模型中其他效果的影響,還能偵測一個自變項的作用是否隨另一個自變項的水準而變。本章並介紹以共變項做統計控制的共變數分析,用 SPSS 報表示範 F 值與 η²,且一再強調交互作用顯著時主要效果要小心解讀。","sections":[{"heading":"何時使用與先決提醒","points":["適用於一個等距或比率尺度的依變項,加上兩個以上名義自變項;例如性別(2)× 地區(4)對每週看電視時數,稱為 2 × 4 設計。","分析會給出每個自變項的主要效果,以及自變項之間的交互作用;交互作用也稱調節效果。","與單因子分析相同,要檢查各組變異是否大致相等(變異數同質性);各組人數不等時,這個問題會被放大。","樣本依多個自變項切割後,細格人數容易太少;經驗法則是每格不少於 10 人,最好超過 20 人。"]},{"heading":"主要效果與統計控制","points":["多因子分析中的主要效果,是在控制(排除)其他自變項影響之後,某自變項各組在依變項上的平均差異。","例子:北部樣本男生比例較高、男生又看較多電視,地區差異可能只是性別差異的副產品;控制性別後才能看出獨立的地區效果。","原理是先把可由性別解釋的變異從總變異中移開,再檢驗剩下的變異中是否還有一部分能由地區解釋。","SPSS 預設的第三類平方和,就是在計算每個效果時都已把模型中其他效果納入考量。"]},{"heading":"交互作用及其與主要效果的解讀","points":["交互作用指一個自變項與依變項的關係隨另一自變項的水準而不同;兩個自變項有一個雙向交互作用,三個自變項則多出三個雙向與一個三向。","表 11-1 中北、東、西部男生都比女生多看 5 小時,南部卻多 15 小時,顯示性別差距因地區而異;畫折線圖或長條圖最容易看懂。","交互作用顯著時主要效果怎麼解讀,學界沒有共識:有人主張只談交互作用,作者主張全部報告並說明彼此的關係。","數學課程例子:實驗課程整體平均較高,其實只來自女生大幅進步,男生並無差異,只說「實驗課程較好」會誤導。","即使沒有任何主要效果,也可能存在交互作用(各邊際平均數相等,但兩條線交叉)。"]},{"heading":"單純主要效果與共變數分析","points":["單純主要效果分析類似事後比較,用來檢驗特定細格平均數之間是否有顯著差異,幫助拆解顯著的交互作用。","例如檢驗傳統課程男生(50 分)與實驗課程男生(35 分)是否不同,或實驗課程女生是否高於其他三組。","共變數分析(ANCOVA)加入共變項,檢驗排除共變項可解釋的變異後,各組平均數是否仍有差異。","共變項不必是類別自變項,可以是連續變項,例如控制社經地位後再比較各地區孩子的看電視時數。"]},{"heading":"效應量、SPSS 範例與結果報告","points":["468 名高中生的 2(性別)× 2(學業成績高低)分析,依變項是英文課自我效能(1–5 分);成績以中位數切成高低兩組。","整體模型 F = 5.854、p = .001,但 η² 只有 .036;樣本大容易顯著,效應量才是判斷實務重要性的較佳指標。","性別(F = 5.166,η² = .011)與成績(F = 10.646,η² = .022)主要效果顯著但效果很小;交互作用不顯著(p = .209)。","報告時要列出所有主要效果與交互作用的 F 值與自由度,並附上各細格平均數的表或圖。"]}],"concepts":[{"tw":"交互作用","en":"interaction effect","note":"一個自變項對依變項的影響,隨另一個自變項的水準而改變。"},{"tw":"主要效果","en":"main effect","note":"某一自變項各組之間的依變項平均差異,已控制模型中其他效果。"},{"tw":"多因子變異數分析","en":"factorial ANOVA","note":"含兩個以上類別自變項的變異數分析,如 2 × 4 設計。"},{"tw":"控制(淨)效果","en":"partial and controlled effects","note":"把另一變項可解釋的變異先排除,再看剩下的組間差異。"},{"tw":"單純主要效果","en":"simple effects","note":"比較個別細格的平均數,用來說明交互作用究竟發生在哪裡。"},{"tw":"共變數分析","en":"analysis of covariance (ANCOVA)","note":"加入共變項,排除其解釋的變異後再比較各組平均數。"},{"tw":"細格人數","en":"cell size","note":"自變項交叉出的每個小組人數;至少 10 人,最好 20 人以上。"},{"tw":"變異數同質性","en":"homogeneity of variance","note":"假設各組組內變異大致相等;各格人數不等時更要檢查。"},{"tw":"調節變項","en":"moderator","note":"改變另一自變項與依變項之間關係的變項。"}],"symbols":[],"formulas":[{"name":"各效果的 F 值","expr":"F_效果 = MS_效果 / MSe","note":"每個主要效果與交互作用的均方,都除以同一個誤差均方"},{"name":"均方","expr":"MS = SS / df","note":"例:校正模型 11.402 / 3 = 3.801"},{"name":"效果數量","expr":"2 個自變項 → 2 個主要效果 + 1 個雙向交互作用;3 個自變項 → 3 + 3 + 1(三向)","note":"自變項越多,交互作用的層次越複雜"}],"example":{"title":"Burger(1987):有無選擇 × 公開或私密評價對解字謎表現的影響","takeaway":"55 名大學生隨機分到 2 × 2 四組,依變項為兩分鐘內解出的字謎數。四組平均:公開有選擇 19.50、公開無選擇 14.86、私密有選擇 14.92、私密無選擇 15.36。兩個主要效果與交互作用都顯著,但主要效果全由公開且有選擇組的高分造成,須依交互作用解讀。"},"pitfalls":["交互作用顯著時,只報「某組平均較高」的主要效果可能誤導,要說明該效果在哪些條件下才成立。","自變項越多細格越多,每格人數不足(少於 10 人)時分析沒有意義。","樣本大時微小差異也會顯著;η² 只有 .01–.04 時,實務上的重要性有限。","各細格人數不等又變異不齊時,顯著性檢定的機率值會失準,要先檢查各組標準差。"],"apa":"以 2(有無選擇)× 2(公開或私密)多因子變異數分析檢驗解出的字謎數:選擇主要效果顯著,F(1, 51) = 12.72, p \u003c .001;評價情境主要效果顯著,F(1, 51) = 14.10, p \u003c .001;交互作用亦顯著,F(1, 51) = 17.62, p \u003c .001,僅公開且有選擇組(M = 19.50)明顯高於其他三組。","clinical":"衛教方式(影片或口頭)與病人年齡層(青壯或高齡)對服藥遵從度的影響:若影片只對青壯族群有效、對高齡者無效,就是交互作用,此時不能籠統地說影片衛教比較好。","quiz":[{"q":"多因子變異數分析算出的地區主要效果,與單獨對地區做單因子分析的結果有何關鍵差別?","a":"多因子分析的主要效果已排除模型中其他自變項(如性別)可解釋的變異,因此能分辨地區差異是否只是各地區性別比例不同造成的副產品。"},{"q":"表 11-1 中哪個現象暗示性別與地區有交互作用?","a":"北、東、西部男生都比女生多看 5 小時電視,南部卻多 15 小時;性別差距的大小隨地區而變,代表性別與看電視時數的關係受地區調節。"},{"q":"自我效能的例子中整體模型 p = .001,為何作者仍說不具實務顯著性?","a":"因為 468 人的大樣本讓小差異也容易顯著,而 η² = .036 表示性別、成績及其交互作用合起來只解釋 3.6% 的變異,效果很小。"}],"slide":{"headline":"多因子 ANOVA:看交互作用","bullets":["一個連續依變項 + 兩個以上類別自變項","主要效果已控制其他自變項的影響","交互作用:A 的效果隨 B 的水準改變","交互作用顯著時,主要效果要小心解讀"],"stat":{"num":"2 × 2","label":"兩因子各兩水準"}},"title_tw":"多因子變異數分析","brief":{"analogy_title":"吃藥要不要配合飲食控制","analogy":"新藥有沒有效,如果答案是「要看有沒有同時控制飲食」,那就是交互作用:一個因子的效果取決於另一個因子。","takeaways":["主要效果:一個因子自己造成的平均差異","交互作用:一個因子的效果隨另一個因子而變","交互作用顯著時,主要效果要小心解讀"],"table":{"caption":"2 × 2 設計一次回答三個問題","head":["效果","在問什麼","圖上怎麼看"],"rows":[["因子 A 的主要效果","不管 B,A 的各水準平均有差嗎?","線的左右兩端平均高度不同"],["因子 B 的主要效果","不管 A,B 的各水準平均有差嗎?","兩條線的平均高度不同"],["A × B 交互作用","A 的效果在 B 的不同水準下一樣嗎?","兩條線不平行"]]}}},{"n":12,"title_en":"Repeated-Measures Analysis of Variance","pages":"149–165","one_liner":"同一群人重複測量時,把變異拆成受試者內、受試者間及其交互作用,檢驗平均數是否隨時間變。","summary":"重複測量變異數分析是相依(成對)樣本 t 檢定的延伸:同一組人在同一依變項上被測量兩次以上,檢驗平均數是否隨時間點或嘗試而改變。它多了三項能力:可比較兩個以上時間點、可加入共變項成為重複測量共變數分析、也可加入分組自變項。原理仍是拆解變異:最基本的設計中,變異來自受試者之間、受試者內(時間)及受試者與時間的交互作用,F 是時間的均方除以受試者 × 嘗試交互作用的均方。加入分組變項後,可同時檢驗受試者內效果、受試者間效果,以及各組隨時間變化的型態是否不同。","sections":[{"heading":"何時使用:從成對 t 檢定延伸","points":["最基本的形式是單一組別在單一依變項上有兩次測量,例如同一批三年級生學年初與學年末的數學成績。","酒後駕駛反應時間例子:50 名成人在喝 0、2、4 杯酒後各測一次煞車反應時間,檢驗三次平均是否不同。","加入體重當共變項後,0 杯與 2 杯的差異消失,但 4 杯後仍然變慢;再加入性別當分組變項,未發現性別與杯數的交互作用。","喝酒杯數雖是自變項,卻不是把人分成三個獨立組別,而是同一依變項的三次相依(重複)測量。","即使平均數隨嘗試改變,也可能有其他解釋,例如受試者疲倦、厭煩或對測驗情境越來越熟悉。"]},{"heading":"變異如何拆解與 F 值","points":["以 10 名學生三、四年級的詞彙測驗為例,共 20 個分數:時間 1 平均 51.5、時間 2 平均 61.5,總平均 56.75。","第一個變異來源是受試者之間:每個人兩次分數的平均,與總平均數之間的差距。","第二個來源是受試者內:各時間點的平均數與總平均數的差距,也就是平均而言分數是否隨時間改變。","第三個來源是受試者與時間的交互作用:每個人的變化幅度不同,有人大幅進步、有人持平或甚至退步。","F = MS_T / MS_S×T,自由度為 (T − 1) 與 (T − 1)(S − 1);檢驗的是系統性變化相對於隨機變動有多大。"]},{"heading":"加入共變項:重複測量共變數分析","points":["共變項的作用是先吸收依變項的一部分變異,再檢驗剩下的變異中是否仍有受試者內的差異。","例子以智商分數為共變項,檢驗控制智商後,詞彙成績從三年級到四年級平均而言是否仍有改變。","此時總變異分成三塊:共變項解釋的部分、受試者內(時間)效果,以及剩下無法解釋的誤差變異。"]},{"heading":"加入分組自變項:受試者間效果與交互作用","points":["把 10 名學生按性別分組後,男生兩次平均為 35 與 52,女生為 65 與 71;女生兩次都較高,這是受試者間(組間)主要效果。","男生進步 17 分、女生只進步 6 分,變化量不同就是受試者內效果與受試者間效果的交互作用。","與多因子分析相同,交互作用顯著時要小心解讀主要效果:整體的進步可能主要來自男生。","最終模型的變異來源包括共變項、時間、性別、時間 × 性別與誤差;各效果必須達統計顯著才談得上解釋變異。"]},{"heading":"研究範例、讀圖警示與報告","points":["作者調查約 570 名學生在標準化測驗前後一週的效度信念(1–8 分),以語文、數學百分位數為共變項、性別為分組變項。","受試者間:性別 F = 11.548、p = .001、η² = .020,男生較相信測驗效度;語文成績亦與效度信念有關。","受試者內:時間 F = 10.617、p = .001、η² = .018;時間 × 性別 F = 4.386、p = .037,下降幾乎只出現在男生。","同一筆資料換成範圍較窄的 Y 軸,差異看起來會大很多;讀圖時一定要先看縱軸刻度。","報告時先描述受試者間與受試者內兩種主要效果,再說明交互作用,並附上相關的平均數。"]}],"concepts":[{"tw":"重複測量變異數分析","en":"repeated-measures ANOVA","note":"檢驗同一群人的依變項平均數是否隨時間點或嘗試而改變。"},{"tw":"受試者內效果","en":"within-subjects effect","note":"同一個人不同時間點之間的差異,平均而言是否有系統性改變。"},{"tw":"受試者間效果","en":"between-subjects effect","note":"不同人或不同組別之間的差異,如性別的主要效果。"},{"tw":"時間 × 組別交互作用","en":"within-by-between interaction","note":"不同組別隨時間變化的幅度或方向是否不同。"},{"tw":"受試者 × 嘗試交互作用均方","en":"mean square for subject by trial interaction","note":"每個人變化量的不一致程度,作為 F 值的分母(誤差項)。"},{"tw":"重複測量共變數分析","en":"repeated-measures ANCOVA","note":"加入共變項,排除其解釋的變異後再檢驗隨時間的變化。"},{"tw":"分組變項","en":"group variable","note":"模型中的類別自變項,用來比較不同組別。"},{"tw":"時間點/嘗試","en":"time, trial","note":"依變項每一次的資料蒐集。"},{"tw":"誠實的座標軸","en":"honest y-axis","note":"縱軸呈現量表完整範圍,才不會把小差異放大成大差異。"}],"symbols":[{"sym":"MS_S×T","meaning":"受試者與嘗試交互作用的均方"},{"sym":"MS_T","meaning":"嘗試(時間點)之間差異的均方"}],"formulas":[{"name":"重複測量 F 值","expr":"F = MS_T / MS_S×T","note":"時間點差異的均方除以受試者 × 嘗試交互作用的均方"},{"name":"F 的自由度","expr":"df = (T − 1),(T − 1)(S − 1)","note":"T 為嘗試(時間點)數,S 為受試者人數"}],"example":{"title":"學生參加標準化測驗(ITBS)前後對測驗效度信念的改變","takeaway":"約 570 名學生在測驗前後各填一次效度信念量表,以語文、數學成績為共變項、性別為分組變項。男生平均由 6.29 降到 6.01,女生 5.77 到 5.71 幾乎不變。性別、時間與兩者交互作用都顯著,但 η² 都在 .02 以下:下降只發生在男生,而且效果很小。"},"pitfalls":["平均數隨時間改變不一定是處理造成的,疲勞、厭煩或熟悉測驗情境都是可能的替代解釋。","受試者內效果談的是平均變化;有人升有人降時可能互相抵銷,也可能只由少數人的大幅變化帶動。","時間 × 組別交互作用顯著時,不能只說整體隨時間改變,要指出是哪一組在變。","讀圖要看 Y 軸範圍;截短的座標軸會讓實務上很小的差異看起來很大。"],"apa":"以性別為受試者間因子、語文與數學成績為共變項進行重複測量共變數分析:性別主要效果顯著,F(1, 567) = 11.55, p = .001;時間主要效果顯著,F(1, 567) = 10.62, p = .001;性別 × 時間交互作用顯著,F(1, 567) = 4.39, p \u003c .05,女生信念幾乎不變(M = 5.77 → 5.71),男生下降(M = 6.29 → 6.01)。","clinical":"追蹤同一批術後病人在第 1、3、7 天的疼痛分數,並比較兩種止痛方案:時間是受試者內因子,方案是受試者間因子;若兩組疼痛下降的速度不同,就是時間 × 組別的交互作用。","quiz":[{"q":"重複測量變異數分析比相依樣本 t 檢定多了哪些能力?","a":"它可以比較兩個以上的時間點,可以加入共變項做統計控制,還能加入分組自變項,同時檢驗組間差異以及各組隨時間變化的型態是否不同。"},{"q":"最基本的重複測量設計中,F 值的分母是什麼?代表什麼意義?","a":"分母是受試者 × 嘗試交互作用的均方,反映每個人從一個時間點到另一個時間點的變化量彼此有多不一致,相當於隨機變動的部分。"},{"q":"測驗效度的例子中,時間主要效果顯著,為何不能直接說學生考完後變得較不相信測驗?","a":"因為時間 × 性別交互作用也顯著:女生平均幾乎沒有變化,下降主要來自男生;而且 η² 只有約 .018,這個變化在實務上相當小。"}],"slide":{"headline":"重複測量:同一群人測多次","bullets":["成對 t 檢定的延伸,可比三個以上時間點","變異 = 受試者間 + 受試者內 + 兩者交互","可加共變項與分組變項形成混合模型","看圖先看 Y 軸刻度,別被截短的軸誤導"],"stat":{"num":"F = MS_T / MS_S×T","label":"時間對交互作用"}},"title_tw":"重複測量變異數分析","brief":{"analogy_title":"同一批病人量三次血壓","analogy":"每個人都拿自己跟自己比。有人天生血壓高、有人天生低,這種個別差異被扣掉之後,更容易看出時間帶來的改變。","takeaways":["同一批人被重複測量,叫受試者內設計","個別差異不算進誤差,所以檢定力比較高","可以再加入組別,看「時間 × 組別」的交互作用"],"table":{"caption":"不同的人 vs 同一批人","head":["","獨立組(單因子 ANOVA)","重複測量 ANOVA"],"rows":[["比較的是","不同的人","同一批人的多次測量"],["誤差裡有","個別差異 + 隨機誤差","扣掉個別差異之後的誤差"],["優點","沒有練習或疲勞效應","需要的人少、檢定力高"],["風險","需要較多受試者","順序、練習、疲勞效應"]]}}},{"n":13,"title_en":"Regression","pages":"166–184","one_liner":"迴歸把相關變成預測:用預測變項估計依變項,並看每個變項的獨特貢獻。","summary":"本章從第 8 章的相關與決定係數出發,說明迴歸如何把「兩變項有關」改寫成「已知 X 可預測 Y」。簡單線性迴歸只有一個預測變項,用最小平方法找出讓殘差平方和最小的那條直線,由斜率 b 與截距 a 組成方程式;它提供的資訊其實不比相關係數多。真正的威力在多元迴歸:同時放入多個預測變項,可看整體模型解釋多少變異(R、R²、F 檢定),也能在控制其他變項後檢定每個預測變項的迴歸係數,並用標準化係數 β 比較相對強度。作者以教育年數、工作年資預測月收入,以及預測高中生自我設限策略兩個例子示範,最後提醒迴歸和相關一樣不能證明因果。","sections":[{"heading":"簡單迴歸與多元迴歸、可用的變項","points":["簡單迴歸對應單因子變異數分析:一個預測變項配一個依變項;多元迴歸對應多因子設計,有兩個以上預測變項。","相關不區分誰是自變項誰是依變項,迴歸一定要區分,因為目的是用預測變項的已知值去推估依變項。","多元迴歸能回答四件事:整體關聯有多強、控制他項後各變項的關係、各變項相對強度、是否有交互作用。","依變項須為等距或比率尺度;預測變項可為連續或二分變項。依變項為二分時要用 Logit(邏輯斯)迴歸,本書不談。"]},{"heading":"簡單線性迴歸詳解:方程式、斜率與截距","points":["迴歸方程式 Ŷ = bX + a:b 是未標準化迴歸係數(斜率),a 是截距,即 X 為 0 時的預測值。","普通最小平方法(OLS)找的是唯一一條讓各資料點到直線距離平方和最小的線,這條線就是迴歸線。","斜率等於相關係數乘上兩變項標準差之比,等於把 r 換回原始測量單位;皮爾森 r 則是標準化後的簡單迴歸係數。","預測必有誤差:觀察值減預測值就是殘差。正殘差代表低估,負殘差代表高估;相關愈強,預測誤差愈小。","含誤差項的方程式寫成 Y = bX + a + e,描述的是實際觀察值而非預測值。"]},{"heading":"多元迴歸:共享變異、R² 與迴歸係數","points":["加入第二個預測變項後方程式變成 Ŷ = a + b₁X₁ + b₂X₂,每個係數都是控制其他預測變項後的關係。","預測變項彼此相關太高時,各自能解釋的獨特變異所剩無幾,難以分辨個別貢獻,這就是多元共線性問題。","輸出分三塊:解釋變異量(R、R²、調整後 R²)、變異數分析(整體模型 F 檢定)、迴歸係數(B、β、t、p)。","R² 是多元迴歸的效應量;調整後 R² 依預測變項數與樣本數把數值略微下修。","未標準化係數 B 單位不同不能互比,要看標準化係數 β;各係數的 t 檢定則檢驗斜率是否顯著不為 0。"]},{"heading":"例子與行文表述:預測自我設限策略","points":["464 名高中生,以逃避目標、自我效能、性別(男 = 1、女 = 0 的虛擬編碼)與學業平均成績預測自我設限。","整體模型顯著(F = 15.686,p \u003c .001),但只解釋約 12% 的變異(調整後 11.3%),屬中等關聯。","成績與自我效能為負向預測,逃避目標為正向預測,性別不顯著;每個結果都是控制其他變項後的淨效果。","報告時交代:同時投入哪些預測變項、解釋多少變異、哪些顯著,以及各顯著變項的 β 與方向。"]},{"heading":"總結:迴歸、相關與變異數分析是一家人","points":["簡單迴歸的係數只是皮爾森相關係數的未標準化版本,兩者傳達的是同一種關係。","迴歸同樣在分割依變項的變異並用自變項解釋,迴歸均方除以殘差均方得到 F,與變異數分析如出一轍。","一般說變異數分析用類別自變項、迴歸用連續自變項,但迴歸其實也能處理類別自變項,界線並不絕對。"]}],"concepts":[{"tw":"迴歸方程式","en":"regression equation","note":"Ŷ = bX + a,把 X 的值代入就得到 Y 的預測值,也能畫出迴歸線。"},{"tw":"迴歸係數(斜率)","en":"regression coefficient / slope","note":"X 每增加 1 單位,Y 的預測值平均改變多少。"},{"tw":"截距","en":"intercept","note":"迴歸線與 Y 軸的交點,也就是 X = 0 時的預測值。"},{"tw":"殘差","en":"residual","note":"觀察值減預測值的差,就是預測誤差;正值為低估、負值為高估。"},{"tw":"普通最小平方法迴歸","en":"ordinary least squares regression (OLS)","note":"挑出使殘差平方和最小的那條直線當作迴歸線。"},{"tw":"多元迴歸(複迴歸)","en":"multiple regression","note":"同時用兩個以上預測變項,可看整體解釋力與各自的獨特貢獻。"},{"tw":"多元相關係數與 R²","en":"multiple correlation coefficient (R), R²","note":"R 是預測值與觀察值的相關;R² 是模型解釋的變異比例,也是效應量。"},{"tw":"標準化迴歸係數","en":"standardized regression coefficient (β)","note":"把係數換成共同的標準分數尺度,才能比較哪個預測變項較強。"},{"tw":"多元共線性","en":"multicollinearity","note":"預測變項彼此高度相關,使各自與依變項的獨特關係難以辨識。"}],"symbols":[{"sym":"Ŷ","meaning":"依變項 Y 的預測值"},{"sym":"Y","meaning":"依變項 Y 的觀察值"},{"sym":"b","meaning":"未標準化迴歸係數"},{"sym":"a","meaning":"截距"},{"sym":"e","meaning":"誤差項"},{"sym":"R","meaning":"多元相關係數"},{"sym":"R²","meaning":"迴歸模型解釋的變異比例"}],"formulas":[{"name":"簡單迴歸方程式(預測值)","expr":"Ŷ = bX + a","note":"b 為斜率,a 為截距"},{"name":"迴歸係數(斜率)","expr":"b = r × ( s_y / s_x )","note":"相關係數乘以 Y 與 X 標準差之比"},{"name":"截距","expr":"a = Ȳ − bX̄","note":"先算出 b 才能算 a"},{"name":"預測誤差(殘差)","expr":"e = Y − Ŷ = Y − (a + bX)","note":"觀察值減預測值"},{"name":"含誤差的迴歸方程式(觀察值)","expr":"Y = bX + a + e","note":"描述實際值,把預測誤差算進來"},{"name":"兩個預測變項的多元迴歸","expr":"Ŷ = a + b₁X₁ + b₂X₂","note":"每個 b 都是控制另一變項後的係數"}],"example":{"title":"用教育年數與工作年資預測月收入;再以四個變項預測高中生自我設限","takeaway":"10 名成人中教育年數與月收入 r = 0.83,得 Ŷ = −3.77 + 0.61X:多讀一年書,預測月收入多 610 美元。加入工作年資後 R = .946、R² = .896,F = 30.095,兩個變項的 β(.676、.485)都顯著。真實資料(n = 464)中,四個變項解釋自我設限約 12% 變異,成績與自我效能負向、逃避目標正向、性別不顯著。"},"pitfalls":["迴歸建立在相關之上,只能說變項如何相關與預測,不能證明誰造成誰。","截距可能落在不合理的值(如月收入 −3.77 千美元),它只是 X = 0 的預測值,不必當真。","未標準化係數 B 受測量單位影響,不能直接比大小;比較相對強度要看 β。","預測變項彼此高度相關(多元共線性)時,各自的獨特貢獻會被吃掉;樣本太小(如書中示範的 10 人)也不適合跑多元迴歸。"],"apa":"以多元迴歸檢驗自我設限的預測因子,同時投入逃避目標、學業平均成績、性別與自我效能四個變項,合計解釋 11% 的變異。除性別外皆為顯著預測變項:學業成績(β = −.21)與自我效能(β = −.20)為最強的負向預測因子,逃避目標則為正向預測(β = .13)。","clinical":"想預測病人住院天數,可同時放入年齡、共病數與入院時功能分數。多元迴歸會告訴你三者合起來解釋多少變異,以及控制年齡與共病後,功能分數是否仍有獨立預測力。","quiz":[{"q":"書中說簡單線性迴歸「其實不比相關更有用」,那為什麼還要學它?","a":"因為它把關係寫成可代入的預測方程式,解讀較直觀(X 每增加一單位 Y 變多少),更重要的是它是理解多元迴歸的基礎,後者才能看控制他項後的獨特貢獻。"},{"q":"多元迴歸中,某預測變項的迴歸係數顯著,這句話完整的意思是什麼?","a":"指在控制(排除)模型中其他預測變項已解釋的變異之後,這個變項與依變項之間仍有顯著關係,也就是它的斜率顯著不為 0,具有獨特解釋力。"},{"q":"如果兩個預測變項彼此相關高達 0.90,把兩個都放進模型會發生什麼事?","a":"它們與依變項重疊的部分大多是共享變異,各自的獨特變異很小,所以第二個變項幾乎不增加解釋力,也難以分辨個別效果,這就是多元共線性。"}],"slide":{"headline":"迴歸:從相關走向預測","bullets":["Ŷ = bX + a:斜率看變化量,截距看起點","最小平方法找出殘差平方和最小的直線","多元迴歸看整體 R² 與各變項的獨特貢獻","比強弱看 β;能預測不等於有因果"],"stat":{"num":"R² = .896","label":"兩變項解釋收入變異"}},"title_tw":"迴歸","brief":{"analogy_title":"用身高猜體重","analogy":"在散布圖上畫一條最貼近所有點的直線。知道一個人的身高,沿著線就能讀出預測的體重;點離線的距離就是猜錯的量。","takeaways":["簡單迴歸:Ŷ = bX + a,b 是斜率、a 是截距","多元迴歸看的是「控制其他變項後」每個預測變項的獨特貢獻","R² 是模型解釋的變異比例;能預測不代表有因果"],"table":{"caption":"迴歸報表怎麼讀","head":["數字","告訴你什麼"],"rows":[["R²","模型解釋了依變項多少比例的變異"],["F 檢定","整體模型是否顯著"],["B(未標準化係數)","X 每增加 1 單位,Y 的預測值改變多少"],["β(標準化係數)","比較各預測變項的相對強度"],["t 與 p","這個係數是否顯著不為 0"]]}}},{"n":14,"title_en":"The Chi-Square Test of Independence","pages":"185–192","one_liner":"兩個類別變項有沒有關聯?比較觀察次數與期望次數,用卡方來判斷。","summary":"前面各章的 t 檢定、變異數分析、相關與迴歸都假設資料來自常態分布的母體,現實研究常做不到。違反假設不一定讓結果失效,但嚴重時可改用不需常態與隨機抽樣假設的無母數統計。本章只介紹最常用的一種:卡方獨立性檢定,適用於兩個類別(名義)變項。做法是把資料排成列聯表,由行列合計算出各細格「純憑機率」應有的期望次數,再把觀察次數與期望次數的差距平方後除以期望次數並加總成 χ²,依自由度 (R − 1)(C − 1) 查臨界值,整個流程就是一次假設檢定。作者以性別與主修科系、性別與移民世代兩個例子示範,後者說明卡方可用來排除混淆的分組因素。","sections":[{"heading":"為什麼需要無母數統計","points":["母數統計假設資料取自常態母體,但社會科學的母體常偏態、測量困難、研究過程也不完美。","違反常態假設即使改變結果,多半不致讓結果無效;真的嚴重違反時,可改用無母數統計。","曼-惠特尼 U 檢定約等於獨立樣本 t 檢定的無母數版本,克-瓦二氏檢定則約對應單因子變異數分析。","卡方獨立性檢定處理兩個類別變項:問的是依某變項的分類是否獨立於另一變項的分類。"]},{"heading":"卡方獨立性檢定詳解:從列聯表到 χ²","points":["先在列聯表加上列合計、行合計與總數;細格期望次數 = 該列合計 × 該行合計 ÷ 總人數。","各細格計算 (O − E)² / E,六格相加得到觀察到的 χ²;差距大的細格對 χ² 貢獻最多。","自由度為 (R − 1)(C − 1);2 × 3 表 df = 2,α = .05 時由附錄 E 查得臨界值 5.99。","觀察 χ² 大於臨界值即拒絕「兩變項獨立」的虛無假設,結論為科系選擇與性別有關。"]},{"heading":"例子:性別與移民世代是否獨立","points":["若男生數學標準化測驗平均顯著高於女生,先別急著下結論,要檢查分組是否與其他因素糾纏。","第三代移民學生考得比第一、二代差;如果女生較多是第三代,性別差異可能其實是世代差異。","913 名學生的 2 × 3 列聯表得 χ² = 5.19,df = 2,小於 5.99,不顯著:性別與世代互相獨立。","因此可排除世代是性別差異的原因,但族裔、社經地位等其他變項仍須另外排除。"]},{"heading":"行文表述與總結","points":["卡方結果的寫法很短:說明檢定目的,報告 χ² 值、自由度與是否顯著,再用一句話解釋。","卡方只是眾多無母數方法之一;母數統計並非永遠合適,研究者應熟悉幾種無母數技術。","下一章(全書最後一章)轉向整理資料的兩種技術:因素分析與 Cronbach's α 信度分析。"]}],"concepts":[{"tw":"卡方獨立性檢定","en":"chi-square test of independence","note":"檢驗兩個類別變項的分類彼此獨立還是有關聯。"},{"tw":"觀察次數","en":"observed frequencies","note":"列聯表各細格實際數到的人數。"},{"tw":"期望次數","en":"expected frequencies","note":"若兩變項無關、純憑機率,各細格應該出現的人數。"},{"tw":"列聯表","en":"contingency table","note":"把兩個類別變項交叉排列、每格放次數的表格。"},{"tw":"無母數統計","en":"nonparametric statistics","note":"不依賴常態分布、變異數同質等假設的一組統計方法。"},{"tw":"卡方自由度","en":"degrees of freedom","note":"(列數 − 1) × (行數 − 1),用來查卡方臨界值。"},{"tw":"曼-惠特尼 U 檢定","en":"Mann-Whitney U","note":"用於次序資料,約等於獨立樣本 t 檢定的無母數版本。"},{"tw":"克-瓦二氏檢定","en":"Kruskal-Wallis","note":"用於次序資料,約等於單因子變異數分析的無母數版本。"}],"symbols":[{"sym":"χ²","meaning":"卡方統計量"},{"sym":"O","meaning":"觀察次數"},{"sym":"E","meaning":"期望次數"},{"sym":"df","meaning":"自由度"},{"sym":"R","meaning":"列聯表的列數(橫列)"},{"sym":"C","meaning":"列聯表的行數(直行)"}],"formulas":[{"name":"卡方統計量","expr":"χ² = Σ [ (O − E)² / E ]","note":"每個細格算一次再全部加總"},{"name":"細格期望次數","expr":"E = (列合計 / N) × (行合計 / N) × N = (列合計 × 行合計) / N","note":"例:100 × 65 / 200 = 32.5"},{"name":"卡方獨立性檢定自由度","expr":"df = (R − 1)(C − 1)","note":"R 為列數、C 為行數;2 × 3 表 df = 2"}],"example":{"title":"性別 × 主修科系(虛構)與性別 × 移民世代(SPSS 實例)","takeaway":"男女各 100 人選心理、英語、生物:觀察次數男 35/50/15、女 30/25/45,心理與英語期望次數為 32.5、37.5。書中算得 χ² = 22.89,df = 2,遠大於臨界值 5.99,p \u003c .001,科系選擇與性別有關。另一例 913 名學生的性別 × 世代,χ² = 5.19,不顯著,兩者獨立。"},"pitfalls":["卡方處理的是類別(名義)變項的次數,不是平均數;連續分數不能直接丟進來。","期望次數來自行列合計,不是「每格平均分」;男女人數相同時兩列期望值才會一樣。","卡方不顯著只排除了這一個分組變項的混淆,其他類別或連續變項仍可能是真正原因。","母數統計並非總是合適,但違反常態假設也不一定讓結果失效,要看嚴重程度。"],"apa":"以卡方獨立性檢定檢驗男女生在三個移民世代組中的分布是否與其在樣本中的比例相符,結果未達顯著,χ²(2, N = 913) = 5.19,ns,顯示男女生在各世代組中皆未被過度代表。","clinical":"想知道病房別(內科/外科/加護)與是否發生壓力性損傷有無關聯,可排成 3 × 2 列聯表:若各病房發生人數與「純憑機率」的期望人數差距夠大,χ² 就會顯著。","quiz":[{"q":"期望次數代表什麼?為什麼書中男生、女生兩列的期望次數完全相同?","a":"期望次數是假設兩變項互相獨立、只憑行列合計與機率時各格該有的人數。因為樣本中男女各 100 人,列合計相同,所以每個科系的期望人數男女一樣。"},{"q":"一個 3 × 4 的列聯表做卡方獨立性檢定,自由度是多少?若 χ² 小於臨界值代表什麼?","a":"df = (3 − 1)(4 − 1) = 6。若觀察到的 χ² 小於該自由度與 α 下的臨界值,就不能拒絕虛無假設,結論是兩個類別變項彼此獨立。"},{"q":"在數學成績的性別差異例子裡,作者為什麼要先做性別與世代的卡方檢定?","a":"因為第三代學生成績較低,若女生較集中在第三代,成績的性別差異可能其實是世代造成的。卡方不顯著表示性別與世代獨立,可排除這個混淆來源。"}],"slide":{"headline":"卡方:類別變項獨立嗎?","bullets":["資料不符常態假設時可改用無母數統計","期望次數 = 列合計 × 行合計 ÷ 總人數","χ² = Σ (O − E)² / E,差距愈大值愈大","df = (R − 1)(C − 1),查附錄 E 臨界值"],"stat":{"num":"χ² = Σ(O−E)²/E","label":"觀察對期望"}},"title_tw":"卡方獨立性檢定","brief":{"analogy_title":"懷疑骰子有鬼","analogy":"公平的骰子擲 60 次,每一面應該出現約 10 次。實際次數離這個期望太遠,就懷疑骰子不公平。卡方就是把這些落差加起來。","takeaways":["用在兩個類別變項的次數資料","期望次數 = 列合計 × 行合計 ÷ 總數","自由度 = (列數 − 1) × (行數 − 1)"],"table":{"caption":"卡方獨立性檢定四步驟","head":["步驟","做什麼"],"rows":[["1","把觀察次數排成列聯表"],["2","算出每一格的期望次數"],["3","每一格算 (O − E)² ÷ E,全部加總得到 χ²"],["4","用自由度查表,和臨界值比較"]]}}},{"n":15,"title_en":"Factor Analysis and Reliability Analysis: Data Reduction Techniques","pages":"193–209","one_liner":"因素分析把相關高的題項歸成因素,信度分析再檢查同組題項是否一致。","summary":"問卷研究常用好幾個題項去測一個無法直接觀察的構念。本章介紹兩種整理題項的技術,目的在幫讀者看懂文獻而非教操作。探索性因素分析(EFA)依題項間相關的強弱萃取因素:最相關的一群先成為第一個因素,解釋最多變異,其後遞減;再透過轉軸讓因素盡量彼此區隔,並以特徵值、解釋變異比例、因素負荷量與概念是否說得通來決定保留幾個因素。驗證性因素分析(CFA)則先依理論指定結構,再用適配度統計量檢驗模型與資料合不合。因素分好之後,用 Cronbach's α 檢查每組題項的內部一致性。作者以 857 名高中生的九個動機題項貫穿全章:表現與精熟兩個因素清楚可靠,家庭題項則否。","sections":[{"heading":"構念、觀察變項與為何要用多個題項","points":["題項是可直接測量的觀察變項;它們共同反映的「價值」「工作滿意度」等是不能直接測量的潛在變項。","只問一題,不同受訪者可能各自解讀;用多題才能涵蓋構念的不同面向,並確認大家理解一致。","若多個題項真的在測同一構念,作答應高度相關,且彼此的相關要強於與其他構念題項的相關。","因素分析要求變項為等距尺度且近似常態,樣本要夠大:第一個變項 30 人,每多一個再加 10 人。"]},{"heading":"探索性因素分析:萃取、負荷量與轉軸","points":["EFA 先找出相關最強的一群題項組成第一個因素,再找次強的,直到新因素不再明顯增加解釋變異為止。","因素負荷量類似相關係數,多介於 −1 到 1;負荷愈強,該題愈能定義這個因素,反向題會出現負的負荷。","轉軸讓因素彼此盡量區隔:直交轉軸(最大變異法)最常用;因素間可能相關時改用斜交(直接斜交法)。","保留因素的依據:特徵值大於 1.0、解釋總變異不低於約 10%,而且負荷最高的題項放在一起要有意義。","負荷量低於 0.30 的題項不算該因素的有力指標;同一題在兩個因素都有明顯負荷稱為交叉負荷。"]},{"heading":"具體例子與驗證性因素分析簡介","points":["九個題項(精熟、表現、家庭各三題)以主成分萃取加直交轉軸,初步得到四個特徵值大於 1 的因素。","表現因素解釋約 22%、精熟因素約 21%,都很乾淨;三個家庭題項卻拆成兩個互相重疊的因素。","限定為三因素後,家庭題項合成一個因素,但「父母幫忙輔導作業」負荷僅 0.353,概念上屬具體行為而非信念。","CFA 由研究者依理論先指定哪些題項屬於哪個因素,再看適配度統計量;它是結構方程模式的一部分。"]},{"heading":"信度分析:Cronbach's α","points":["Cronbach's α 衡量一組題項的內部一致性,概念上像題項間的平均關聯,最大為 1.0。","α 同時受題數與題項間相關強度影響:題數愈多 α 通常愈高;經驗法則是大於 0.70 可接受。","輸出會列出校正後題項-總分相關,以及刪除該題後的 α,可看出哪一題與其他題不太合。","表現題項 α = 0.73、精熟題項 α = 0.70 可接受;家庭題項 α 只有 0.265,刪任何一題也不超過 0.36。"]},{"heading":"行文表述與全書總結","points":["報告時依序交代:萃取與轉軸方法、因素個數與特徵值、各因素的題項與解釋變異、再報各量表的 α。","因素的特徵值大於 1 不代表量表可信:家庭因素通過了因素分析,卻沒通過信度分析。","兩種技術變化很多,實際使用前應再讀專書;作者也以此章為全書作結,鼓勵讀者把本書當作起點。"]}],"concepts":[{"tw":"因素分析","en":"factor analysis","note":"依題項間相關的強弱,把一組觀察變項整理、歸類成較少的因素。"},{"tw":"潛在變項(構念)","en":"latent variable (construct)","note":"無法直接測量,只能由一組觀察題項推論出來的概念。"},{"tw":"探索性因素分析","en":"exploratory factor analysis (EFA)","note":"不預設結構,讓資料的相關型態決定題項如何分群。"},{"tw":"因素負荷量","en":"factor loading","note":"某題項與某因素之間關聯的強度,解讀方式近似相關係數。"},{"tw":"因素轉軸","en":"factor rotation","note":"調整因素使其彼此盡量區隔;分直交(varimax)與斜交兩大類。"},{"tw":"特徵值","en":"eigenvalue","note":"衡量一個因素強度、解釋多少題項總變異;通常大於 1 才考慮保留。"},{"tw":"驗證性因素分析","en":"confirmatory factor analysis (CFA)","note":"先依理論指定因素結構,再用適配度統計量檢驗與資料合不合。"},{"tw":"Cronbach's α 係數","en":"Cronbach's alpha","note":"一組題項內部一致性的指標,一般以大於 0.70 為可接受。"},{"tw":"信度分析","en":"reliability analysis","note":"檢查同一量表的題項彼此相關多強、能否可靠地代表同一構念。"}],"symbols":[{"sym":"α","meaning":"Cronbach's α 係數(內部一致性信度)"}],"formulas":[{"name":"因素分析樣本數經驗法則","expr":"所需樣本數 ≈ 30 + 10 × (觀察變項數 − 1)","note":"10 個變項至少 30 + 90 = 120 人"},{"name":"保留因素的經驗法則","expr":"特徵值 > 1.0,且解釋總變異 ≥ 約 10%","note":"還要概念上說得通"},{"name":"可接受信度的經驗法則","expr":"Cronbach's α > 0.70","note":"α 受題數與題間相關共同影響"}],"example":{"title":"857 名高中生的九個動機題項:精熟目標、表現目標、家庭背景","takeaway":"精熟題項彼此相關皆高於 0.40,表現題項亦然,家庭題項彼此相關都低於 0.30。EFA 先得四因素(合計解釋約 69% 變異),限定三因素後表現與精熟因素負荷量都在 0.72 以上,家庭題項的「父母輔導作業」只有 0.353。信度分析:表現 α = 0.73、精熟 α = 0.70、家庭 α = 0.27,家庭三題不能當成一個量表。"},"pitfalls":["特徵值大於 1 的因素不一定有意義,也不一定可靠;還要看概念是否合理以及 α 是否夠高。","α 會隨題數增加而升高,題數少時一題不合就會把 α 拉得很低,解讀時要考慮題數。","直交轉軸假設因素互不相關;社會科學的構念常彼此相關,此時應考慮斜交轉軸。","Cronbach's α 評的是內部一致性,不是再測信度;兩者回答的問題不同。"],"apa":"對九個題項進行探索性因素分析(主成分萃取、直交轉軸),初步得到四個特徵值大於 1.0 的因素;限定三因素後,表現與精熟因素維持不變,家庭題項合為單一因素。信度分析顯示表現量表(Cronbach's α = .73)與精熟量表(α = .70)內部一致性可接受,家庭題項則否(α = .27)。","clinical":"發展一份護理人員職場疲勞量表時,先用因素分析看題項是否如預期分成「情緒耗竭」「工作負荷」等面向,再對每個面向算 Cronbach's α;若某面向 α 低於 0.70,就要檢討題目。","quiz":[{"q":"探索性與驗證性因素分析在出發點上有什麼不同?","a":"探索性因素分析不預設結構,由題項間的相關強弱決定怎麼分群;驗證性因素分析則先依理論指定哪些題項屬於哪個因素,再用適配度統計量檢驗這個模型與資料是否相符。"},{"q":"三個家庭題項在三因素解中確實歸成一個因素,為何作者仍說它們不構成量表?","a":"因為信度分析顯示它們的 Cronbach's α 只有 0.27,刪掉任何一題最高也只到 0.36,代表三題彼此相關都弱,內部一致性不足,無法可靠地代表同一個構念。"},{"q":"同樣是題項間平均相關 0.5,為什麼 8 題量表的 α 會比 3 題量表高、也比較不怕一題不合?","a":"α 取決於題數和題間相關。題數多時共同變異累積得多,α 自然較高;而且單一不合群的題項在 8 題中被稀釋,在 3 題中卻會明顯拉低整體平均相關。"}],"slide":{"headline":"因素分析與信度分析","bullets":["多題測一構念:題項是觀察變項,構念是潛在變項","EFA 依相關萃取因素,轉軸讓因素更分明","留因素看特徵值 > 1、負荷量與概念意義","Cronbach's α > .70 才算內部一致"],"stat":{"num":"α > 0.70","label":"可接受的信度"}},"title_tw":"資料化約的技術──因素分析與信度分析","brief":{"analogy_title":"整理衣櫃","analogy":"把 30 件衣服分成上衣、褲子、外套三堆,就是因素分析:相關高的題目歸在一起。信度分析則是檢查同一堆裡是不是真的都是同類。","takeaways":["因素分析把很多題目濃縮成少數幾個構面","因素負荷量是題目和因素的相關;特徵值大於 1 常作為保留門檻","Cronbach's α 檢查同一構面題目的內部一致性,.70 以上通常可接受"],"table":{"caption":"三種分析各做什麼","head":["分析","做法","什麼時候用"],"rows":[["探索性因素分析","讓資料自己分群","事先沒有明確的構面架構"],["驗證性因素分析","檢驗預設的架構是否成立","已有理論或前人量表"],["信度分析","計算 Cronbach's α","確認一組題目能不能加總成一個分數"]]}}}],"front":{"preface_summary":"作者是常用統計的研究者,看到人們寧可相信個人軼事也不信數據,又普遍懷疑「統計會說謊」,因此想把統計講得讓人看得懂:數字本身不說謊,會出入的是解讀,懂原理才能自己判斷。他說明統計的三種用途:把眾人的資料概括成典型經驗、比較群體之間的整體差異、檢視變項間的關係並做預測;統計談的是普遍趨勢,不適用於單一個人。本書刻意精簡,適合搭配傳統教科書或當複習參考。每章先簡介、再詳解、最後舉例,各章自成一體,可依需要跳讀。","how_to_use":["當作補充讀物:搭配較詳盡的傳統教科書一起讀,不要指望一本學完。","當作複習參考書:學過一兩門統計課的人用來溫習概念。","各取所需:每章先讀 1–2 頁簡介,需要再讀詳解與例子。","各章獨立,可跳讀;例如已懂 t 檢定就直接從第 9 章跳到第 10 章。","想更完整理解某概念時,回頭查更傳統、更詳細的教科書。"],"new_in_3e":["新增第 15 章:因素分析與信度分析等資料整理技術。","第 1 章新增「理解資料分布」一節,並加入數張圖表示範如何使用與解讀。","許多章新增「行文表述」一節,示範論文中如何報告統計量。","設有配套網站:各章課件摘要、多數章的互動習題與延伸學習連結。","訂正前一版的全部已知錯誤(作者自嘲可能又寫進新的)。"],"chapter_structure":"每章三部分:1–2 頁的統計量簡介(用途與提供的資訊)、3–8 頁的詳解(用法、公式、優缺點、前提條件)、章末應用與解釋的實例。","series":"管理者终身学习","copyright_page":{"publisher":"中国人民大学出版社","edition":"2013年12月第1版","print":"2013年12月第1次印刷","format":"175mm×250mm 16开本(印张15.25,插页2)","words":"264 000","price":"45.00元","isbn":"978-7-300-18573-6","cip":"中国版本图书馆CIP数据核字（2013）第307569号"}},"back":{"appendices":[{"id":"A","title_tw":"常態分布曲線下 z 值兩側的面積","use":"把原始分數換成 z 分數後,查 z 以下的累積機率(−∞ 到 z);另附 z = 2.0 以上的右尾機率。用於百分等級與 z 檢定。"},{"id":"B","title_tw":"t 分布的臨界值","use":"做 t 檢定或算信賴區間時,依自由度與單尾/雙尾 α 水準查臨界 t 值;算出的 t 須大於等於表值才顯著。"},{"id":"C","title_tw":"F 分布的臨界值","use":"變異數分析或迴歸的 F 檢定:依分子與分母自由度查臨界 F,細體字為 α = .05、粗體字為 α = .01。"},{"id":"D","title_tw":"學生化全距統計量的臨界值(用於 Tukey HSD 事後比較)","use":"ANOVA 顯著後做 Tukey HSD 事後比較時,依誤差自由度與自變項水準數查臨界值,分 α = .05 與 .01 兩表。"},{"id":"E","title_tw":"卡方分布的臨界值","use":"卡方獨立性檢定:以 df = (R − 1)(C − 1) 與 α 水準查臨界 χ²,例如 df = 2、α = .05 時為 5.99。"}],"symbols":[{"sym":"Σ","meaning":"總和(加總)"},{"sym":"X","meaning":"分布中的單一數值或原始分數"},{"sym":"ΣX","meaning":"X 的總和;分布中所有分數加總"},{"sym":"X̄","meaning":"樣本平均數"},{"sym":"μ","meaning":"母體平均數"},{"sym":"n","meaning":"樣本中的個案數或分數個數"},{"sym":"N","meaning":"母體中的個案數或分數個數"},{"sym":"P₅₀","meaning":"中位數"},{"sym":"s²","meaning":"樣本變異數"},{"sym":"s","meaning":"樣本標準差"},{"sym":"σ²","meaning":"母體變異數"},{"sym":"σ","meaning":"母體標準差"},{"sym":"SS","meaning":"平方和或離均差平方和"},{"sym":"z","meaning":"標準分數"},{"sym":"s_x̄","meaning":"由樣本標準差估計的平均數標準誤(母體標準差未知時)"},{"sym":"σ_x̄","meaning":"母體標準差已知時的平均數標準誤"},{"sym":"p","meaning":"p 值或機率"},{"sym":"α","meaning":"α 水準(顯著水準)"},{"sym":"d","meaning":"效應量(效果量)"},{"sym":"S","meaning":"用於效應量公式的標準差"},{"sym":"∞","meaning":"無限大"},{"sym":"H₀","meaning":"虛無假設"},{"sym":"H_A 或 H₁","meaning":"對立假設"},{"sym":"r","meaning":"樣本皮爾森相關係數"},{"sym":"ρ","meaning":"母體相關係數"},{"sym":"s_r","meaning":"相關係數的標準誤"},{"sym":"r²","meaning":"決定係數"},{"sym":"df","meaning":"自由度"},{ <script>// One explanatory figure per chapter, as inline SVG strings.
// Used in the browser (index / whiteboard) and at build time (slides, node).
const FIGS = (function () {
  const INK = '#111', BLUE = '#bfe6ff', LILAC = '#e8c6ff', YEL = '#ffe08a', GRN = '#b9f0b4', PINK = '#ffc2d6', GREY = '#8d8f94';
  const W = 520, H = 240;
  const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 13}" font-weight="${o.w || 500}" text-anchor="${o.a || 'middle'}" fill="${o.fill || INK}">${s}</text>`;
  const L = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c || INK}" stroke-width="${o.w || 1.6}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}${o.arrow ? ' marker-end="url(#fa)"' : ''}${o.arrow2 ? ' marker-start="url(#fa)" marker-end="url(#fa)"' : ''}/>`;
  const wrap = (body, label) => `<svg class="fig" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}" font-family="Outfit,'Noto Sans TC',system-ui,sans-serif"><defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${INK}"/></marker></defs>${body}</svg>`;
  const pdf = (x, m, s) => Math.exp(-0.5 * ((x - m) / s) ** 2) / s;
  // normal curve as an SVG path; x in data units mapped by sx(), peak scaled to `h`
  function bell(m, s, sx, base, h, from, to, close) {
    const pts = [], peak = pdf(m, m, s);
    for (let i = 0; i <= 60; i++) { const x = from + (to - from) * i / 60; pts.push(`${sx(x).toFixed(1)} ${(base - pdf(x, m, s) / peak * h).toFixed(1)}`); }
    return close ? `M${sx(from)} ${base} L${pts.join(' L')} L${sx(to)} ${base} Z` : `M${pts.join(' L')}`;
  }
  // deterministic pseudo-random
  function rng(seed) { let a = seed; return () => { a = (a * 1664525 + 1013904223) % 4294967296; return a / 4294967296; }; }
  const gauss = r => (r() + r() + r() + r() - 2) * 1.2;

  const F = {};

  F[1] = () => {
    const r = rng(7); let dots = '';
    for (let i = 0; i < 70; i++) { const a = r() * 6.283, d = Math.sqrt(r()); dots += `<circle cx="${(130 + Math.cos(a) * d * 95).toFixed(0)}" cy="${(118 + Math.sin(a) * d * 72).toFixed(0)}" r="3" fill="${INK}" opacity=".35"/>`; }
    let sd = ''; for (let i = 0; i < 12; i++) { const a = r() * 6.283, d = Math.sqrt(r()); sd += `<circle cx="${(400 + Math.cos(a) * d * 40).toFixed(0)}" cy="${(118 + Math.sin(a) * d * 40).toFixed(0)}" r="3" fill="${INK}"/>`; }
    return wrap(`<ellipse cx="130" cy="118" rx="110" ry="86" fill="${BLUE}" stroke="${INK}" stroke-width="1.6"/>${dots}
      <circle cx="400" cy="118" r="54" fill="${YEL}" stroke="${INK}" stroke-width="1.6"/>${sd}
      ${L(246, 96, 340, 96, { arrow: 1 })}${T(293, 86, '隨機抽樣')}${L(340, 142, 246, 142, { arrow: 1, dash: '5 4' })}${T(293, 162, '推論')}
      ${T(130, 22, '母體 N', { w: 700, size: 15 })}${T(130, 226, '母數:μ、σ', { fill: '#444' })}
      ${T(400, 50, '樣本 n', { w: 700, size: 15 })}${T(400, 196, '統計量:X̄、s', { fill: '#444' })}`, '母體與樣本');
  };

  F[2] = () => {
    const sx = x => 40 + x * 44, f = x => x * x * Math.exp(-x), peak = f(2), base = 190;
    let p = `M${sx(0)} ${base}`; for (let i = 0; i <= 80; i++) { const x = 10 * i / 80; p += ` L${sx(x).toFixed(1)} ${(base - f(x) / peak * 140).toFixed(1)}`; }
    const mark = (x, lab, col, dy) => `${L(sx(x), base, sx(x), 34 + dy, { c: INK, dash: '4 3' })}<rect x="${sx(x) - 30}" y="${14 + dy}" width="60" height="22" rx="11" fill="${col}" stroke="${INK}"/>${T(sx(x), 30 + dy, lab, { w: 700 })}`;
    return wrap(`<path d="${p} L${sx(10)} ${base} Z" fill="${BLUE}" stroke="${INK}" stroke-width="1.6"/>${L(30, base, 500, base)}
      ${mark(2, '眾數', GRN, 0)}${mark(2.67, '中位數', YEL, 28)}${mark(3.4, '平均數', PINK, 56)}
      ${L(330, 150, 440, 150, { arrow: 1 })}${T(385, 140, '長尾把平均數拉走')}${T(260, 222, '正偏(右尾長)時:眾數 < 中位數 < 平均數', { fill: '#444' })}`, '偏態分布的三種集中趨勢');
  };

  F[3] = () => {
    const sx = x => 260 + x * 40, base = 190;
    return wrap(`<path d="${bell(0, 2.6, sx, base, 70, -6, 6, 1)}" fill="${PINK}" stroke="${INK}" stroke-width="1.6" opacity=".9"/>
      <path d="${bell(0, 0.8, sx, base, 150, -6, 6, 1)}" fill="${BLUE}" stroke="${INK}" stroke-width="1.6" opacity=".85"/>
      ${L(20, base, 500, base)}${L(260, base, 260, 30, { dash: '4 3' })}${T(260, 22, '同一個平均數', { w: 700 })}
      ${T(360, 70, '標準差小', { w: 700, a: 'start' })}${T(360, 88, '大家都差不多', { a: 'start', fill: '#444' })}
      ${T(60, 150, '標準差大', { w: 700, a: 'start' })}${T(60, 168, '人與人差很多', { a: 'start', fill: '#444' })}
