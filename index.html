<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白話統計學 · 學習計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#dff3f8; --ink:#0c0c0d; --panel:#f4f4f3; --side:#ebebea; --card:#fff;
  --text:#141416; --muted:#6f7177; --line:#e3e3e1;
  --green:#c9f2c7; --green-d:#49b653; --blue:#cfeefb; --lilac:#ecc9fb; --lilac-d:#d9a4f4;
  --yellow:#fde9a8; --mint:#c4f5c2; --pink:#ffc2d6; --grayPill:#ededeb;
  --r:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--sky)}
body{font-family:'Outfit','Noto Sans TC',system-ui,sans-serif;color:var(--text);background:var(--sky);min-height:100vh;padding:20px 16px 60px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #2a7be4;outline-offset:2px}

.shell{max-width:1320px;margin:0 auto;background:var(--ink);border-radius:34px;padding:0 6px 6px;box-shadow:0 30px 60px -30px rgba(20,60,80,.45)}
.top{display:flex;align-items:center;gap:20px;height:60px;padding:0 26px;color:#fff}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo small{font-weight:400;font-size:12px;opacity:.6;margin-left:8px;letter-spacing:.02em}
.topnav{margin:0 auto;display:flex;align-items:center;gap:6px}
.topnav a{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:999px;opacity:.75;position:relative;white-space:nowrap}
.topnav a:hover{opacity:1;background:#1f1f22}
.topnav a.on{opacity:1}
.topnav a.on::after{content:"";position:absolute;left:50%;bottom:-8px;width:26px;height:3px;border-radius:3px;background:#fff;transform:translateX(-50%)}
.topnav svg{width:18px;height:18px}
.me{display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.25}
.me b{display:block;font-size:13px;font-weight:600}
.me span{opacity:.6}
.ava{width:34px;height:34px;border-radius:50%;background:var(--lilac);display:grid;place-items:center;font-size:18px}

.board{background:var(--panel);border-radius:30px;display:grid;grid-template-columns:minmax(0,1fr) 300px;overflow:hidden;position:relative}
.main{padding:26px 26px 110px 26px;min-width:0}
.head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:32px;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#e8e8e6;border-radius:999px;padding:0 16px;height:42px;width:min(260px,100%)}
.search input{border:0;background:none;font:inherit;font-size:14px;outline:0;width:100%;color:var(--text)}
.search svg{width:16px;height:16px;flex:none;color:var(--muted)}

.layout{display:grid;grid-template-columns:52px minmax(0,1fr);gap:18px}
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:20px;align-self:start}
.rail .grp{background:#fff;border-radius:999px;padding:5px;display:flex;flex-direction:column;gap:4px}
.rb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#fff}
.rb:hover{background:#eee}
.rb.on{background:var(--ink);color:#fff}
.rb svg{width:16px;height:16px}
.bell{position:relative;font-size:22px;margin:14px 0 6px}
.bell i{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;background:var(--green);border-radius:999px;padding:1px 6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{border-radius:20px;padding:12px 8px;text-align:center;position:relative}
.stat b{display:block;font-size:30px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.t{background:var(--blue)} .stat.c{background:var(--green)} .stat.u{border:1.5px dashed #cfcfcc}
.stat.c::after{content:"🎉";position:absolute;right:-6px;top:-12px;font-size:22px}

.plan{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;position:relative}
.plan::before{content:"";position:absolute;left:50%;top:60px;bottom:60px;border-left:2px dotted var(--green-d);transform:translateX(-1px)}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.col.r{padding-top:0}
.card{background:var(--card);border-radius:var(--r);padding:20px 20px 16px;position:relative;transition:transform .2s, box-shadow .2s;cursor:pointer;text-align:left;width:100%;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 30px -22px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;top:50%;width:28px;border-top:2px dotted var(--green-d)}
.card::after{content:"";position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:var(--green-d);margin-top:-3px}
.col.l .card::before{right:-28px} .col.l .card::after{right:-32px}
.col.r .card::before{left:-28px} .col.r .card::after{left:-32px}
.card .no{font-size:12px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.card h3{font-size:22px;font-weight:500;line-height:1.2;letter-spacing:-.01em;margin:2px 44px 6px 0;text-wrap:balance}
.card p{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:14px;max-width:34em}
.card .en{font-size:12px;color:#9a9ca1;margin-bottom:8px}
.badge{position:absolute;top:-8px;right:-8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#f0f0ee;border:4px solid var(--panel)}
.card.done .badge{background:var(--green)}
.row{display:flex;align-items:center;gap:6px}
.pill{font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--grayPill);white-space:nowrap}
.card.done .pill{background:var(--green)}
.acts{margin-left:auto;display:flex;gap:4px}
.ab{width:32px;height:32px;border-radius:50%;background:#efefed;display:grid;place-items:center;font-size:14px}
.ab:hover{background:#e2e2df}
.ab.ok{background:#efefed}
.card.done .ab.ok{background:var(--ink);color:#fff}

.feature{background:var(--lilac);border-radius:var(--r);padding:22px;transform:rotate(-4deg);box-shadow:0 26px 34px -22px rgba(120,60,160,.55);position:relative;margin:6px -6px 6px -10px;display:block;transition:transform .25s}
.feature:hover{transform:rotate(-2deg) translateY(-3px)}
.feature .k{font-size:12px;letter-spacing:.08em;opacity:.65}
.feature h3{font-size:24px;font-weight:500;line-height:1.2;margin:4px 90px 6px 0}
.feature p{font-size:13px;line-height:1.5;opacity:.75;max-width:60%}
.play{position:absolute;right:26px;top:26px;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.35)}
.play::after{content:"";border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}
.feature .foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.feature .pill{background:#fff}
.faces{display:flex}
.faces span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;margin-left:-8px;border:2px solid var(--lilac)}
.note{position:absolute;font-size:20px;opacity:.9;color:#fff}

.aside{background:var(--side);padding:26px 18px 110px;min-width:0}
.aside h2{font-size:30px;font-weight:500;letter-spacing:-.02em;margin-bottom:22px}
.ev{display:block;width:100%;text-align:left;border-radius:22px;padding:14px;margin-bottom:14px;transition:transform .2s}
.ev:hover{transform:translateY(-3px)}
.ev .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:10px}
.ev .h em{margin-left:auto;font-style:normal;font-weight:400;font-size:12px}
.ev .b{background:rgba(255,255,255,.55);border-radius:14px;padding:12px;font-size:13px;line-height:1.55}
.ev .f{background:#fff;border-radius:999px;text-align:center;font-size:12px;padding:8px;margin-top:8px}
.ev.blue{background:var(--blue)} .ev.lilac{background:var(--lilac)} .ev.yellow{background:var(--yellow)}
.ev.mint{background:var(--mint);transform:rotate(-5deg) translateX(-26px);box-shadow:0 20px 30px -20px rgba(40,120,40,.5);margin-top:26px}
.ev.mint:hover{transform:rotate(-2deg) translateX(-26px)}
.ghost{border:1.5px dashed #cfcfcc;border-radius:22px;height:46px;margin-bottom:-20px}

.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);border-radius:999px;padding:8px 14px;display:flex;gap:8px;z-index:20;box-shadow:0 16px 30px -14px rgba(0,0,0,.6)}
.dock a,.dock button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;color:#111;position:relative;transition:transform .15s}
.dock a:hover,.dock button:hover{transform:translateY(-4px)}
.dock [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:48px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:400;padding:5px 10px;border-radius:8px;white-space:nowrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:50;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;border-radius:28px 0 0 28px;padding:28px 28px 60px}
.drawer.on{transform:none}
.drawer.wide{width:min(980px,100%)}
.x{position:sticky;top:0;float:right;width:38px;height:38px;border-radius:50%;background:#efefed;font-size:16px;z-index:2}

.k{font-size:12px;color:var(--muted);letter-spacing:.08em}
.dz h2{font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:4px 0 4px;text-wrap:balance}
.dz .sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.dz h4{font-size:13px;font-weight:600;letter-spacing:.06em;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.dz h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green-d);flex:none}
.dz p,.dz li{font-size:14.5px;line-height:1.7}
.dz ul{padding-left:1.2em}
.lead{background:var(--blue);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.6}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.dz table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5}
.dz th,.dz td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.dz th{font-size:12px;font-weight:600;color:var(--muted);background:#fafaf9;white-space:nowrap}
.dz tr:last-child td{border-bottom:0}
.dz td.diff{background:#fff7d6}
.fx{background:#f6f6f4;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.fx b{font-size:13px;font-weight:600}
.fx code{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;margin:4px 0;overflow-x:auto;white-space:pre-wrap}
.fx span{font-size:13px;color:var(--muted)}
.dz details{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.dz summary{cursor:pointer;font-size:14.5px;font-weight:500;line-height:1.5}
.dz details p{margin-top:8px;color:#333}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips a{font-size:13px;padding:9px 14px;border-radius:999px;background:var(--ink);color:#fff}
.chips a.alt{background:var(--green);color:#111}
.tag{display:inline-block;font-size:11px;font-weight:400;letter-spacing:0;padding:2px 8px;border-radius:999px;background:var(--yellow);margin-left:6px;white-space:nowrap}
.srcnote{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-size:14px}

@media (max-width:1060px){
  .board{grid-template-columns:1fr}
  .ev.mint{transform:rotate(-2deg)} .ev.mint:hover{transform:none}
}
@media (max-width:760px){
  body{padding:10px 8px 90px}
  .top{padding:0 16px;gap:10px}
  .topnav a span,.me div,.logo small{display:none}
  .main{padding:20px 16px 40px}.aside{padding:22px 16px 110px}
  .layout{grid-template-columns:1fr}.rail{display:none}
  .plan{grid-template-columns:1fr;gap:22px}.plan::before,.card::before,.card::after{display:none}
  h1{font-size:26px}.search{margin-left:0;width:100%}
  .feature{margin:6px 0;transform:rotate(-2deg)}
  .feature p{max-width:100%}.feature h3{margin-right:84px}
  .drawer{border-radius:22px 22px 0 0;padding:22px 18px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="shell">
  <header class="top">
    <div class="logo">Stat<small>白話統計學</small></div>

      <a href="slides.html" title="簡報"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span>簡報</span></a>
      <a href="#" data-open="compare" title="版本比對"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4v16M16 4v16M4 8h8M12 16h8"/></svg><span>版本比對</span></a>
    </nav>
    <div class="me"><div class="ava">🩺</div><div><b>BOB</b><span>研究 · 臨床 · 統計</span></div></div>

  <div class="board">
    <main class="main">
      <div class="head">
        <h1>我的學習計畫 🕰️</h1>
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜尋章節、術語(中／英)" aria-label="搜尋"></label>
      </div>
      <div class="layout">
        <div class="rail" aria-hidden="true">
          <div class="grp">
            <a class="rb on" href="index.html" title="學習路徑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v4a4 4 0 004 4h6"/></svg></a>
            <a class="rb" href="slides.html" title="簡報"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a>
            <a class="rb" href="whiteboard.html" title="白板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></a>
          </div>
          <div class="bell">🔔<i id="left">0</i></div>
        </div>
        <div>
          <div class="plan" id="plan"></div>
        </div>
      </div>
    </main>

    <aside class="aside">
      <h2>我的任務 🧐</h2>
      <button class="ev blue" data-open="compare">
        <div class="h">📚 版本比對<em>簡體 3E ↔ 台灣 5E</em></div>
        <div class="b" id="evCompare"></div>
        <div class="f">🕐 打開完整對照表</div>
      </button>
      <a class="ev lilac" href="whiteboard.html">
        <div class="h">🧠 學習白板<em>Heptabase 風格</em></div>

      </a>
      <a class="ev yellow" href="slides.html">
        <div class="h">📌 簡報<em>BlockFrame</em></div>
        <div class="b">一章一頁的重點簡報,含版本差異與「該用哪個檢定」決策表。</div>
      </a>
      <div class="ghost"></div>
      <button class="ev mint" id="quizBtn">
        <div class="h">📌 隨堂小考<em id="quizCh"></em></div>
        <div class="b" id="quizQ"></div>
      </button>
    </aside>
  </div>
</div>

<nav class="dock" aria-label="快捷列">
  <a style="background:#c8c2ff" href="slides.html" data-tip="簡報">T</a>
  <a style="background:#bfe6ff" href="whiteboard.html" data-tip="學習白板">A</a>
  <button style="background:#ffb3c7" data-open="compare" data-tip="版本比對">⇄</button>
  <button style="background:#ffe08a" data-open="terms" data-tip="術語對照">字</button>

  <button style="background:#444;color:#fff" id="resetBtn" data-tip="重設進度">↺</button>
</nav>

03cth>簡體版\u003c/th>\u003cth>台灣三版\u003c/th>\u003c/tr>\u003ctr>\u003ctd>原文\u003c/td>\u003ctd>3E\u003c/td>\u003ctd>5E 架構\u003c/td>\u003c/tr>\u003ctr>\u003ctd>章數\u003c/td>\u003ctd>15\u003c/td>\u003ctd>16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>附錄\u003c/td>\u003ctd>5\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>相關\u003c/td>\u003ctd>第 8 章\u003c/td>\u003ctd>第 12 章\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第 14 章\u003c/td>\u003ctd>卡方\u003c/td>\u003ctd>無母數統計\u003c/td>\u003c/tr>\u003c/table>","long":"\u003cdiv class=\"lead\">結論:兩者差了兩個原文版次。簡體版(2013)= 英文 3E,15 章、5 個附錄;台灣雙葉三版(2025)= 英文 5E 的架構,16 章、8 個附錄。內容上真正與簡體版同源的台灣版,是 2013 年已絕版的雙葉一版。\u003c/div>\u003ch4>主要差異\u003c/h4>\u003cul>\u003cli>\u003cb>原文版次差兩版\u003c/b>:簡體版譯自 3E;台灣三版的架構與 5E 一致。3E 到 5E 之間多了一整章、三張附錄表,並擴寫了常態分布與迴歸假設。\u003c/li>\u003cli>\u003cb>「相關」的位置不同\u003c/b>:簡體版把相關放在第 8 章(t 檢定之前);台灣三版移到第 12 章(ANOVA 之後、迴歸之前)。所以簡體版第 9–12 章,在台灣三版是第 8–11 章。\u003c/li>\u003cli>\u003cb>第 14 章範圍不同\u003c/b>:簡體版只講卡方獨立性檢定;台灣三版改名「無母數統計」,另外納入 Mann-Whitney U、Wilcoxon signed-rank、Kruskal-Wallis。\u003c/li>\u003cli>\u003cb>台灣三版多了第 16 章\u003c/b>:「個人中心取向的分析」(person-centered analysis),介紹集群分析與潛在類別分析。簡體版完全沒有。\u003c/li>\u003cli>\u003cb>附錄 5 張 vs 8 張\u003c/b>:台灣三版多了 Fisher Z 轉換表、Mann-Whitney U 臨界值、Wilcoxon signed-rank 臨界值;卡方表從附錄 E 變成附錄 H。\u003c/li>\u003cli>\u003cb>術語譯名\u003c/b>:兩岸用語差很多:均值/平均數、方差/變異數、总体/母體、置信区间/信賴區間、回归/迴歸、正态/常態、因子分析/因素分析、复测/重複測量。完整清單見術語對照。\u003c/li>\u003cli>\u003cb>書內交叉引用的章號\u003c/b>:簡體版內文說「見第 9 章 t 檢驗」時,對台灣三版讀者是第 8 章;對照閱讀時請用下方章節對照表換算。\u003c/li>\u003c/ul>\u003cdiv class=\"chips\">\u003ca href=\"index.html#compare\">打開完整對照表\u003c/a>\u003c/div>"},{"title":"該用哪個檢定?","tone":"g","html":"\u003ctable>\u003ctr>\u003ctd>一組樣本 vs 已知母體平均數\u003c/td>\u003ctd>\u003cb>單一樣本 t 檢定\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩組不同的人,比平均數\u003c/td>\u003ctd>\u003cb>獨立樣本 t 檢定\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人前後測,或配對樣本\u003c/td>\u003ctd>\u003cb>相依(成對)樣本 t 檢定\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>三組以上不同的人,比平均數\u003c/td>\u003ctd>\u003cb>單因子變異數分析 + 事後比較\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個以上類別自變項,想看交互作用\u003c/td>\u003ctd>\u003cb>多因子變異數分析\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人量三次以上\u003c/td>\u003ctd>\u003cb>重複測量變異數分析\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin-top:6px;opacity:.7\">點開看完整 10 列\u003c/p>","long":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>你的問題\u003c/th>\u003cth>方法\u003c/th>\u003cth>章\u003c/th>\u003c/tr>\u003ctr>\u003ctd>一組樣本 vs 已知母體平均數\u003c/td>\u003ctd>\u003cb>單一樣本 t 檢定\u003c/b>\u003c/td>\u003ctd>CH 07\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩組不同的人,比平均數\u003c/td>\u003ctd>\u003cb>獨立樣本 t 檢定\u003c/b>\u003c/td>\u003ctd>CH 09\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人前後測,或配對樣本\u003c/td>\u003ctd>\u003cb>相依(成對)樣本 t 檢定\u003c/b>\u003c/td>\u003ctd>CH 09\u003c/td>\u003c/tr>\u003ctr>\u003ctd>三組以上不同的人,比平均數\u003c/td>\u003ctd>\u003cb>單因子變異數分析 + 事後比較\u003c/b>\u003c/td>\u003ctd>CH 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個以上類別自變項,想看交互作用\u003c/td>\u003ctd>\u003cb>多因子變異數分析\u003c/b>\u003c/td>\u003ctd>CH 11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一批人量三次以上\u003c/td>\u003ctd>\u003cb>重複測量變異數分析\u003c/b>\u003c/td>\u003ctd>CH 12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個連續變項有沒有關係\u003c/td>\u003ctd>\u003cb>Pearson 相關係數 r\u003c/b>\u003c/td>\u003ctd>CH 08\u003c/td>\u003c/tr>\u003ctr>\u003ctd>用一個或多個變項預測連續結果\u003c/td>\u003ctd>\u003cb>簡單/多元迴歸\u003c/b>\u003c/td>\u003ctd>CH 13\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兩個類別變項有沒有關聯\u003c/td>\u003ctd>\u003cb>卡方獨立性檢定\u003c/b>\u003c/td>\u003ctd>CH 14\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一堆題目想縮成幾個構面、檢查一致性\u003c/td>\u003ctd>\u003cb>因素分析 + Cronbach's α\u003c/b>\u003c/td>\u003ctd>CH 15\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"title":"每章固定三段","tone":"l","html":"\u003cp>每章三部分:1–2 頁的統計量簡介(用途與提供的資訊)、3–8 頁的詳解(用法、公式、優缺點、前提條件)、章末應用與解釋的實例。\u003c/p>","long":"\u003cdiv class=\"lead\">每章三部分:1–2 頁的統計量簡介(用途與提供的資訊)、3–8 頁的詳解(用法、公式、優缺點、前提條件)、章末應用與解釋的實例。\u003c/div>\u003ch4>前言在說什麼\u003c/h4>\u003cp>作者是常用統計的研究者,看到人們寧可相信個人軼事也不信數據,又普遍懷疑「統計會說謊」,因此想把統計講得讓人看得懂:數字本身不說謊,會出入的是解讀,懂原理才能自己判斷。他說明統計的三種用途:把眾人的資料概括成典型經驗、比較群體之間的整體差異、檢視變項間的關係並做預測;統計談的是普遍趨勢,不適用於單一個人。本書刻意精簡,適合搭配傳統教科書或當複習參考。每章先簡介、再詳解、最後舉例,各章自成一體,可依需要跳讀。\u003c/p>\u003ch4>作者建議的讀法\u003c/h4>\u003cul>\u003cli>當作補充讀物:搭配較詳盡的傳統教科書一起讀,不要指望一本學完。\u003c/li>\u003cli>當作複習參考書:學過一兩門統計課的人用來溫習概念。\u003c/li>\u003cli>各取所需:每章先讀 1–2 頁簡介,需要再讀詳解與例子。\u003c/li>\u003cli>各章獨立,可跳讀;例如已懂 t 檢定就直接從第 9 章跳到第 10 章。\u003c/li>\u003cli>想更完整理解某概念時,回頭查更傳統、更詳細的教科書。\u003c/li>\u003c/ul>\u003ch4>第三版新增\u003c/h4>\u003cul>\u003cli>新增第 15 章:因素分析與信度分析等資料整理技術。\u003c/li>\u003cli>第 1 章新增「理解資料分布」一節,並加入數張圖表示範如何使用與解讀。\u003c/li>\u003cli>許多章新增「行文表述」一節,示範論文中如何報告統計量。\u003c/li>\u003cli>設有配套網站:各章課件摘要、多數章的互動習題與延伸學習連結。\u003c/li>\u003cli>訂正前一版的全部已知錯誤(作者自嘲可能又寫進新的)。\u003c/li>\u003c/ul>"}]},"chapters":[{"n":1,"title_cn":"导论：社会科学研究的原理和术语","title_en":"Introduction to Social Science Research Principles and Terminology","pages":"1–14","one_liner":"先弄清母體與樣本、抽樣、變項尺度與研究設計,才談得上任何統計。","summary":"本章是全書的詞彙課。作者先分清母體與樣本、母數與統計量,提醒樣本未必能代表研究者心中的母體,而能否把結果類推出去正是描述統計與推論統計的分野。接著比較隨機、代表性與便利三種抽樣,說明變項的質性/量性之分與名義、次序、等距、比率四種測量尺度,再對照實驗設計與相關性設計在因果推論上的強弱。第三版新增的最後一節談「分布」與圖表:任何一組變項取值都是分布,選圖與讀圖的重點是讓資料一目了然,並留意座標軸刻度。","sections":[{"heading":"母體與樣本、統計量與母數","points":["母體是研究者關心的那一類對象的全體,樣本是從中取出的子集;由母體算出的值叫母數,由樣本算出的叫統計量。","作者以哈佛終身職教師的平均收入為例:查完整名單得到母數,隨機抽一部分人計算則得到統計量。","母體不一定很大,也不一定是人(班上 5 名學生、獸醫院看診的狗、某年在美國組裝的福特汽車都可以是母體)。","母體要由研究者定義;只收康乃狄克州一家心理衛生機構的 15 歲個案,卻談「青少年憂鬱症」,樣本與想談的母體就對不上。","描述統計只說明手上這批資料;推論統計假定樣本能代表母體,藉樣本對母體下結論,所以第一步是把母體定義清楚。"]},{"heading":"抽樣問題","points":["隨機抽樣指母體中每個成員被選中的機率相等,不是「隨便抽」;好處是樣本與母體的差異來自機會而非系統性偏差。","代表性抽樣是刻意讓樣本在重要特徵上的比例與母體一致,例如舊金山成人有 15% 退休、55% 男性,樣本也照此配置;費工但較能類推。","便利抽樣依距離、可接觸性與參與意願取樣,如就近國中 300 位家長中 220 位同意、當天到校 200 人。","便利樣本未必不好:只要它與目標母體的差異不致影響研究結果,就是可以接受的做法。"]},{"heading":"變項類型與測量尺度","points":["變項是有一個以上取值、可被編碼的東西;若樣本中人人取值相同(例如全是男性),它就成了常數。","量性(連續)變項的數字代表多寡;質性(類別)變項的數字只是標籤,如三個州編成 1、2、3;只有兩類者稱二分變項。","名義尺度的數字純為名稱;次序尺度有先後(富豪排名)但不知相鄰名次差多少。","等距與比率尺度的單位間距相等,既知順序也知差距(以英寸量身高);書中說比率尺度另含零值,圖 1-2 以賽跑名次與秒差對照。"]},{"heading":"研究設計","points":["實驗設計把樣本分組後比較,例如 40 名學生隨機分派各 20 人使用新舊數學課程,期望其他差異在兩組間平均抵銷。","相關性設計不分組、不操弄,只蒐集多個變項看彼此關聯強度,例如 100 名員工的睡眠時數與生產力。","相關不等於因果:睡得多可能使工作更有效率,也可能是工作順利才睡得好。","實驗能分離自變項對依變項的影響,但難以排除其他干擾、也難類推到真實情境;相關研究易執行、可同時看多個變項,卻缺乏控制。"]},{"heading":"分布與圖表的重要性","points":["分布就是某變項一組取值的集合;書中後面的常態、t、F、卡方分布都建立在這個概念上。","名義變項無法由低排到高,只能報各類百分比:500 位選民中民主黨 45%、共和黨 40%、無黨派 15%,長條圖或圓餅圖皆可。","長條圖可同時比較多個變項(虛構的五國高中生看電視與做功課時數),折線圖適合看趨勢(100 名大一生的 GPA 分組次數)。","1990–2007 美國犯罪率三張圖顯示:y 軸刻度太大時,暴力犯罪由每十萬人約 800 降到約 500 件的趨勢幾乎看不出來。"]}],"concepts":[{"tw":"母體與樣本","cn":"总体和样本","en":"population and sample","diff":true,"note":"母體是關心對象的全體,樣本是其中被實際觀察的子集。"},{"tw":"母數與統計量","cn":"参数和统计量","en":"parameter and statistic","diff":true,"note":"母數描述母體,統計量由樣本算出並用來估計母數。"},{"tw":"概化(類推)","cn":"一般化（或普遍性）","en":"generalize / generalizability","diff":true,"note":"把樣本結果推到母體的能力,取決於樣本像不像母體。"},{"tw":"描述統計與推論統計","cn":"描述统计和推断统计","en":"descriptive and inferential statistics","diff":true,"note":"前者只描述手上資料,後者藉樣本對母體下結論。"},{"tw":"隨機抽樣","cn":"随机抽样","en":"random sampling","diff":false,"note":"每個母體成員入選機率相等,差異只來自機會。"},{"tw":"測量尺度","cn":"测量尺度","en":"scales of measurement","diff":false,"note":"名義、次序、等距、比率四級,決定數字帶有多少資訊。"},{"tw":"自變項與依變項","cn":"自变量和因变量","en":"independent and dependent variables","diff":true,"note":"自變項被假定影響依變項;實驗中自變項由研究者操弄。"},{"tw":"實驗設計與相關性設計","cn":"实验设计和相关性研究设计","en":"experimental vs. correlational design","diff":false,"note":"前者隨機分派可談因果,後者只能說有無關聯。"},{"tw":"分布","cn":"分布","en":"distribution","diff":false,"note":"任一變項取值的集合,可用圖表呈現其樣貌。"}],"terms":[{"cn":"卡方分布","tw":"卡方分布","en":"chi-square distributions","diff":false},{"cn":"常数","tw":"常數","en":"constant","diff":false},{"cn":"方便抽样","tw":"便利抽樣","en":"convenience sampling","diff":true},{"cn":"相关性研究设计","tw":"相關性研究設計","en":"correlational research design","diff":false},{"cn":"因变量","tw":"依變項","en":"dependent variable","diff":true},{"cn":"描述统计量","tw":"描述統計(敘述統計)","en":"descriptive statistics","diff":true},{"cn":"二值变量","tw":"二分變項","en":"dichotomous variable","diff":true},{"cn":"分布","tw":"分布(分配)","en":"distribution","diff":false},{"cn":"实验研究设计","tw":"實驗研究設計","en":"experimental research design","diff":false},{"cn":"F分布","tw":"F 分布","en":"F distributions","diff":false},{"cn":"频率","tw":"次數(頻率)","en":"frequency","diff":true},{"cn":"一般化（或普遍性）","tw":"概化(類推性)","en":"generalize / generalizability","diff":true},{"cn":"自变量","tw":"自變項","en":"independent variable","diff":true},{"cn":"推断统计量","tw":"推論統計","en":"inferential statistics","diff":true},{"cn":"定距或定比变量","tw":"等距或比率變項","en":"interval or ratio variable","diff":true},{"cn":"均值","tw":"平均數","en":"mean","diff":true},{"cn":"名义尺度变量（定类变量）","tw":"名義尺度變項(類別變項)","en":"nominally scaled variable","diff":true},{"cn":"正态分布","tw":"常態分布","en":"normal distribution","diff":true},{"cn":"定序变量","tw":"次序變項","en":"ordinal variable","diff":true},{"cn":"参数","tw":"母數(參數)","en":"parameter","diff":true},{"cn":"总体","tw":"母體","en":"population","diff":true},{"cn":"定性（或分类）变量","tw":"質性(類別)變項","en":"qualitative or categorical variable","diff":true},{"cn":"定量（或连续）变量","tw":"量性(連續)變項","en":"quantitative or continuous variable","diff":true},{"cn":"随机分配","tw":"隨機分派","en":"random assignment","diff":true},{"cn":"随机样本（或随机抽样）","tw":"隨機樣本(隨機抽樣)","en":"random sample / random sampling","diff":false},{"cn":"典型抽样","tw":"代表性抽樣","en":"representative sampling","diff":true},{"cn":"样本","tw":"樣本","en":"sample","diff":false},{"cn":"统计量","tw":"統計量","en":"statistic","diff":false},{"cn":"t分布","tw":"t 分布","en":"t distributions","diff":false},{"cn":"变量","tw":"變項(變數)","en":"variable","diff":true},{"cn":"测量尺度","tw":"測量尺度","en":"scales of measurement","diff":false},{"cn":"柱状图","tw":"長條圖","en":"bar graph / column graph","diff":true},{"cn":"饼图","tw":"圓餅圖","en":"pie chart","diff":true},{"cn":"折线图","tw":"折線圖","en":"line graph","diff":false},{"cn":"叠加柱状图","tw":"堆疊長條圖","en":"stacked column graph","diff":true},{"cn":"频数","tw":"次數","en":"frequency (f)","diff":true}],"symbols":[{"sym":"N","meaning":"母體中的個體數(圖 1-1:N = 10)"},{"sym":"n","meaning":"樣本中的個體數(圖 1-1:n = 3)"},{"sym":"f","meaning":"次數(frequency),折線圖 y 軸所代表的人數"}],"formulas":[],"example":{"title":"1990–2007 年美國犯罪率的三張圖","takeaway":"同一份資料先畫成堆疊長條圖,只看得出總犯罪率由每十萬人近 6,000 件降到不足 4,000 件;改成折線圖分開兩類犯罪,暴力犯罪的變化仍被大刻度壓扁;最後單獨畫暴力犯罪、y 軸改為 0–800,才看清約由 800 降到 500。結論:好圖要讓重點不費力就看見。"},"pitfalls":["「隨機」不是隨便,而是人人入選機率相等;小樣本即使隨機也可能與母體差很多。","樣本實際代表的母體可能比研究問題宣稱的窄得多,類推前先問母體怎麼定義。","相關性研究只能說兩變項有關,不能判定誰造成誰。","讀圖要看座標軸刻度,刻度不合適會讓重要趨勢消失或被誤讀。"],"apa":null,"clinical":"只在單一醫學中心某病房收案的壓力性損傷研究,樣本實際代表的是「該院該病房住院病人」,不是「所有住院病人」;疼痛分數 0–10 屬等距/比率、壓傷分級屬次序、病房別屬名義尺度。","quiz":[{"q":"研究者只在一家心理衛生機構收了 15 歲個案,卻宣稱在研究「青少年憂鬱盛行率」,問題出在哪裡?","a":"樣本實際對應的母體(某年該機構接案的 15 歲者)遠窄於研究者宣稱的母體(青少年),且求診者本來就較可能憂鬱,存在系統性差異,結果難以類推。"},{"q":"富豪排行榜的名次與以英寸測得的身高,在測量尺度上差在哪裡?","a":"名次是次序尺度,只知道誰先誰後,不知道相鄰名次差多少;身高單位間距相等,屬等距/比率尺度,既能排序也能說出差多少。"},{"q":"發現員工睡眠時數與生產力高度相關,為何不能斷言「多睡使人更有生產力」?","a":"這是相關性設計,沒有隨機分派也沒有操弄變項;也可能是工作順利、壓力小才睡得久,因果方向無法由相關資料判定。"}],"slide":{"headline":"統計之前:先懂研究語言","bullets":["母體→母數;樣本→統計量","隨機抽樣:人人入選機率相等","尺度四級:名義、次序、等距、比率","實驗可談因果,相關只談關聯"],"stat":{"num":"N vs. n","label":"母體數與樣本數"}},"ocr_notes":["書中第 5 頁稱比率尺度「包括一個零值(例如攝氏溫度)」;攝氏溫度通常被歸為等距尺度,此為原書說法,引用時宜加註。","第 7 頁列舉後續章節各分布的那一行 OCR 缺漏(常態、t、F、卡方分布對應章次),F 分布所屬章次需對原書。","圖 1-5、1-6、1-7 至 1-9 的座標數值 OCR 不完整;文中引用的數字(13 人、31 人、55 人、800→500 等)取自正文敘述。","術語表用「常数」「频率」,正文用「常量」「频数」,同一英文詞兩種譯法。"],"title_tw":"引介社會科學研究的原則與術語"},{"n":2,"title_cn":"中心趋势的测度","title_en":"Measures of Central Tendency","pages":"15–22","one_liner":"平均數、中位數、眾數各說一件事;偏態或有離群值時三者會分家。","summary":"本章介紹描述分布中心的三個量數。平均數是所有取值的算術平均,最常用,但不透露資料多分散,也會被極端值拉走;中位數是第 50 百分位數,把資料對半切開,不受離群值影響;眾數只是出現最多的值,資訊最少,但能看出雙峰或多峰。常態分布下三者重合,偏態分布則各在不同位置:負偏時平均數小於中位數,正偏時相反。作者以 30 名五年級生的評分與各國預期壽命示範,並提醒樣本越小,一個離群值對平均數的影響越大;只看平均數容易忽略變異而流於一概而論。","sections":[{"heading":"三個集中趨勢量數是什麼","points":["平均數把整個分布濃縮成一個數,方便但有代價:它不告訴你取值多分散,也不保證有很多取值真的落在平均數附近。","中位數是第 50 百分位數,上下各一半取值;研究者常用它做中位數分割,把樣本分成人數相等的高、低兩組。","眾數是分布中次數最高的取值,提供的資訊最少,也是三者中最少被使用的一個。","樣本平均數記為 X̄,母體平均數記為 μ;樣本統計量是母體母數的估計。"]},{"heading":"怎麼算","points":["平均數:所有取值相加後除以取值個數(樣本除以 n,母體除以 N)。","中位數:先排序再找正中間;個數為奇數時就是中間那一個(11 個值取第 6 個),偶數時取中間兩個的平均(10 個值取第 5、6 個)。","眾數不必計算:10 位學生的智商分數中 100 出現三次,眾數就是 100。","最高次數的取值不只一個時稱多峰,兩個稱雙峰;100 人對死刑態度的量表兩端各有 45 人,就是典型雙峰分布。"]},{"heading":"例子:偏態分布中的三個量數","points":["30 名五年級生以 1–5 分評「學業成績有多重要」,多數選 4 或 5,少數選 1、2,尾巴拖向低分端,是負偏態分布。","眾數為 5;總和 113 除以 30 得平均數 3.77;第 15、16 個值都是 4,中位數為 4。平均數被低分尾巴拉低,略小於中位數。","13 國預期壽命中烏干達是離群值:不含它平均 78.17 歲,含它降為 76.21 歲,差了將近 2 歲。","只取日、英、美三國平均 79.75 歲,加入烏干達(約 52 歲)後降為 72.99 歲,少了近 7 歲,而中位數約 78.5 歲幾乎不動。"]},{"heading":"報告寫法與本章提醒","points":["集中趨勢的報告通常很短:寫出平均數與中位數的數值,再點出兩者關係所反映的分布形狀即可。","一個平均數能概括數百萬人(如美國男性平均身高 5 呎 9 吋),但也抹去了個體之間的巨大差異。","不看變異只看平均數,容易做出一體適用的概化甚至刻板印象;因此下一章接著談變異量數。"]}],"concepts":[{"tw":"平均數","cn":"均值","en":"mean","diff":true,"note":"所有取值的算術平均;最常用,但會被極端值拉動。"},{"tw":"中位數","cn":"中位数","en":"median","diff":false,"note":"排序後正中間的值(第 50 百分位),不受離群值影響。"},{"tw":"眾數","cn":"众数","en":"mode","diff":false,"note":"出現次數最多的取值;資訊最少。"},{"tw":"偏態","cn":"偏态","en":"skew","diff":false,"note":"取值擠在一端、另一端拖出尾巴;尾巴朝哪邊就是哪種偏。"},{"tw":"負偏態/正偏態","cn":"负偏/正偏","en":"negative / positive skew","diff":false,"note":"尾巴在低端為負偏(平均數\u003c中位數),在高端為正偏。"},{"tw":"離群值","cn":"异常值","en":"outlier","diff":true,"note":"異常大或小的值;樣本越小,對平均數的衝擊越大。"},{"tw":"雙峰/多峰分布","cn":"双峰/多峰","en":"bimodal / multimodal","diff":false,"note":"有兩個或更多最高次數的取值,常見於意見兩極的題目。"},{"tw":"中位數分割","cn":"中位数分划","en":"median split","diff":true,"note":"以中位數把樣本切成人數相等的高、低兩組。"},{"tw":"母數與統計量","cn":"参数和统计量","en":"parameter and statistic","diff":true,"note":"μ 是母體平均數,X̄ 是用來估計它的樣本平均數。"}],"terms":[{"cn":"双峰","tw":"雙峰","en":"bimodal","diff":false},{"cn":"分布","tw":"分布(分配)","en":"distribution","diff":false},{"cn":"均值","tw":"平均數","en":"mean","diff":true},{"cn":"中位数分划","tw":"中位數分割","en":"median split","diff":true},{"cn":"中位数","tw":"中位數","en":"median","diff":false},{"cn":"众数","tw":"眾數","en":"mode","diff":false},{"cn":"多峰","tw":"多峰","en":"multimodal","diff":false},{"cn":"负偏","tw":"負偏態","en":"negative skew","diff":false},{"cn":"异常值","tw":"離群值(極端值)","en":"outliers","diff":true},{"cn":"正偏","tw":"正偏態","en":"positive skew","diff":false},{"cn":"参数","tw":"母數(參數)","en":"parameter","diff":true},{"cn":"总体","tw":"母體","en":"population","diff":true},{"cn":"样本","tw":"樣本","en":"sample","diff":false},{"cn":"偏态","tw":"偏態","en":"skew","diff":false},{"cn":"统计量","tw":"統計量","en":"statistic","diff":false},{"cn":"中心趋势","tw":"集中趨勢","en":"central tendency","diff":true},{"cn":"组频数分布","tw":"分組次數分配","en":"grouped frequency distribution","diff":true},{"cn":"样本容量","tw":"樣本數(樣本大小)","en":"sample size","diff":true}],"symbols":[{"sym":"X","meaning":"分布中的單一取值"},{"sym":"ΣX","meaning":"X 的總和;把分布中所有取值加起來"},{"sym":"X̄","meaning":"樣本平均數"},{"sym":"μ","meaning":"母體平均數"},{"sym":"n","meaning":"樣本中的個體或取值個數"},{"sym":"N","meaning":"母體中的個體或取值個數"},{"sym":"P₅₀","meaning":"中位數(第 50 百分位數)的符號"}],"formulas":[{"name":"樣本平均數","expr":"X̄ = ΣX / n","note":"所有取值相加,除以樣本取值個數"},{"name":"母體平均數","expr":"μ = ΣX / N","note":"算法相同,只是對象是整個母體"},{"name":"中位數(偶數個取值)","expr":"P₅₀ = (排序後中間兩個取值之和) / 2","note":"奇數個時直接取正中間那一個"}],"example":{"title":"五年級生對「成績重要性」的評分與各國預期壽命","takeaway":"30 名五年級生的 1–5 分評分呈負偏:眾數 5、中位數 4、平均數 113/30 = 3.77,平均數被低分尾巴拉到中位數之下。預期壽命資料示範離群值效應:13 國時加入烏干達使平均由 78.17 降到 76.21;只有 4 國時由 79.75 降到 72.99。"},"pitfalls":["平均數不代表「多數人的情況」;分布中可能很少有取值真的落在平均數附近。","偏態或有離群值時只報平均數會誤導,應同時看中位數。","小樣本裡一個極端值就能大幅改變平均數。","只看集中趨勢、不看變異,容易做出一體適用的結論或刻板印象。"],"apa":"此分布的平均數(X̄ = 3.77)略低於中位數(P₅₀ = 4.00),顯示分布呈負偏態。","clinical":"住院天數多半是正偏態:大多數病人住幾天,少數住上百天把平均拉高。報告病房住院天數時,中位數比平均數更能代表「典型病人」,這也是臨床常報中位數與四分位距的原因。","quiz":[{"q":"某量表分數平均數 3.77、中位數 4.00,不看圖你能推測分布形狀嗎?","a":"平均數小於中位數,代表有少數偏低的取值把平均數往下拉,尾巴在低分端,屬於負偏態分布;多數人其實集中在高分端。"},{"q":"為什麼同一個離群值在 4 國資料中讓平均數掉近 7 歲,在 13 國資料中只掉約 2 歲?","a":"平均數是所有取值合起來除以個數,個數越少,每一個值占的權重越大;樣本小,單一極端值的影響就被放大,樣本大則被稀釋。"},{"q":"調查 100 人對死刑的態度,平均數落在量表中間,能說「大家意見中立」嗎?","a":"不能。書中例子兩端各有 45 人,是雙峰分布,中間幾乎沒人;平均數落在中間只是兩極相抵的結果,要看眾數與次數分配才知道。"}],"slide":{"headline":"三種「中心」,三種故事","bullets":["平均數:最常用,但怕極端值","中位數:第 50 百分位,不怕離群值","眾數:出現最多,可看出雙峰","負偏:平均數\u003c中位數;正偏相反"],"stat":{"num":"3.77 \u003c 4","label":"負偏的訊號"}},"ocr_notes":["表 2-1 公式 OCR 全毀,已依文字說明重建為 X̄ = ΣX / n 與 μ = ΣX / N。","表 2-2 死刑態度量表 OCR 只留下兩端各 45 人,中間三格的次數(合計 10 人)需對原書。","第 19 頁談前五名國家彼此差距的一句 OCR 缺漏;圖 2-2 的國名與座標未能辨識。","術語表定義離群值為「距平均數超過 2 個標準差的極端值」,正文則只說「異常大或小的值」。"],"title_tw":"集中趨勢之測量"},{"n":3,"title_cn":"变异程度的测度","title_en":"Measures of Variability","pages":"23–34","one_liner":"平均數要配上標準差才看得出分布樣貌;樣本公式用 n − 1 是為了不低估母體變異。","summary":"只知道平均數與中位數,無從得知資料是擠在一起還是四散。本章介紹三個變異量數:全距只看最大與最小值,容易誤導;變異數是離均差平方的平均,單位是平方,難以直接解讀,主要當其他統計的零件;標準差是變異數開根號,回到原單位,可理解為各取值離平均數的典型距離,最有用。作者說明為何先平方(離均差加總必為零)再開根號,以及樣本公式為何除以 n − 1。最後以 491 名中學生兩道五點量表題示範:全距相同,平均數與標準差卻能分辨兩個分布。","sections":[{"heading":"全距、四分位距、變異數、標準差","points":["100 名五年級生憂鬱分數的平均數與中位數都是 10,但仍不知道分數是人人相同還是差異極大,這就是需要變異量數的原因。","全距是最大值減最小值。若 98 人都得 10 分、另兩人得 1 與 20 分,全距 19 看似分散其實不然;常用來檢查量表各分數是否都有人選。","四分位距是第 75 與第 25 百分位數之差,涵蓋排序後中間 50% 的取值。","變異數是離散程度的一種平均,因單位與原始分數不同而少單獨使用;開根號成為標準差後才好解釋。","全距量的是總離散程度,變異數與標準差量的是平均離散程度;平均數加標準差就能大致描繪一個分布。"]},{"heading":"為什麼樣本公式除以 n − 1","points":["母體公式分母用 N;樣本公式分母用 n − 1,因為母體平均數未知,只能用樣本平均數代替。","以樣本平均數算出的離均差平方和,會比用真正母體平均數算的小,所以會低估母體變異;把分母縮小成 n − 1 就是在修正。","差多少看樣本大小:分子同為 100,n = 500 時兩式相差不到 1%;n = 10 時是 3.16 與 3.33,大了近五分之一。","社會科學研究幾乎都把參與者視為代表更大母體的樣本,所以實務上用的多是樣本公式。"]},{"heading":"拆解公式:離均差、平方和、開根號","points":["直覺做法是把每個取值減平均數後加總再平均,但平均數是分布的數學中心,正負離均差相加必為零,行不通。","解法是先把每個離均差平方,消去負號,再加總得到離均差平方和(SS)。","SS 除以取值個數(樣本為 n − 1)就是變異數,也就是「平均的離均差平方」。","平方使單位變成原單位的平方,對變異數開根號才回到原單位,得到標準差;兩者都不會是負數。","變異數仍值得學:算標準差必經它,而它的核心 SS 是變異數分析、迴歸等進階方法的共同零件。"]},{"heading":"例子:兩道五點量表題","points":["自信題(時間夠就能解出最難的題目):n = 491,平均數 4.21,標準差 0.98,變異數 0.96;多數人選 4 或 5,呈負偏。","表現能力題(全班只有我答得出時感覺很棒):平均數 2.92,標準差 1.43,變異數 2.04,全距同樣是 4。","全距分不出兩題差異;平均數 2.92 落在量表中央,可能是大家都選 2、3,也可能各選項平均分散,或一半選 1 一半選 5。","標準差能區分:都選 2、3 時很小,半數 1 半數 5 時約 2,平均分散時約 1.5。實得 1.43,判斷為相當均勻散布,與次數圖相符。","盒鬚圖一張圖同時呈現中位數、第 25 與 75 百分位數(箱體,此例為 2 到 4)以及最大、最小值(5 與 1)。"]}],"concepts":[{"tw":"標準差","cn":"标准差","en":"standard deviation","diff":false,"note":"各取值與平均數之間的典型距離,單位與原始資料相同。"},{"tw":"變異數","cn":"方差","en":"variance","diff":true,"note":"離均差平方的平均;單位是平方,多作為其他統計的零件。"},{"tw":"離均差平方和","cn":"离差平方和(平方和)","en":"sum of squared deviations (SS)","diff":true,"note":"每個取值減平均數後平方再全部相加,ANOVA 與迴歸都用它。"},{"tw":"n − 1 校正","cn":"样本公式的 n−1","en":"n − 1 in the sample formula","diff":false,"note":"用樣本平均數會低估母體變異,縮小分母加以補償。"},{"tw":"全距","cn":"极差","en":"range","diff":true,"note":"最大值減最小值;只反映兩個極端,容易誤導。"},{"tw":"四分位距","cn":"四分位差","en":"interquartile range (IQR)","diff":true,"note":"第 75 與第 25 百分位數之差,中間一半資料的寬度。"},{"tw":"離均差","cn":"离差","en":"deviation","diff":false,"note":"單一取值與平均數的差;全部相加必等於零。"},{"tw":"盒鬚圖","cn":"箱线图","en":"boxplot","diff":true,"note":"用箱體與鬚線同時呈現中位數、四分位距與全距。"},{"tw":"以樣本統計量估計母數","cn":"用样本统计量作为总体参数的估计","en":"sample statistics as estimates of parameters","diff":true,"note":"樣本公式的設計目的,是讓算出的值更貼近母體真值。"}],"terms":[{"cn":"箱线图","tw":"盒鬚圖(箱形圖)","en":"boxplot","diff":true},{"cn":"四分位差","tw":"四分位距","en":"interquartile range (IQR)","diff":true},{"cn":"极差","tw":"全距","en":"range","diff":true},{"cn":"离差平方","tw":"離均差平方","en":"squared deviation","diff":false},{"cn":"标准差","tw":"標準差","en":"standard deviation","diff":false},{"cn":"离差平方和、平方和","tw":"離均差平方和、平方和","en":"sum of squared deviations, sum of squares","diff":false},{"cn":"方差","tw":"變異數","en":"variance","diff":true},{"cn":"变异程度","tw":"變異程度(變異量數)","en":"variability","diff":false},{"cn":"离差","tw":"離均差(離差)","en":"deviation","diff":false},{"cn":"最大值","tw":"最大值","en":"maximum value","diff":false},{"cn":"最小值","tw":"最小值","en":"minimum value","diff":false},{"cn":"百分位数","tw":"百分位數","en":"percentile","diff":false},{"cn":"离差值公式","tw":"離均差公式(定義公式)","en":"deviation score formula","diff":false},{"cn":"原始值公式","tw":"原始分數公式","en":"raw score formula","diff":true},{"cn":"反应量表","tw":"反應量表(作答量尺)","en":"response scale","diff":false},{"cn":"李克特量表","tw":"李克特量表","en":"Likert scale","diff":false},{"cn":"样本容量","tw":"樣本數(樣本大小)","en":"sample size","diff":true}],"symbols":[{"sym":"μ","meaning":"母體平均數"},{"sym":"X","meaning":"分布中的單一取值"},{"sym":"s²","meaning":"樣本變異數"},{"sym":"s","meaning":"樣本標準差"},{"sym":"σ","meaning":"母體標準差"},{"sym":"σ²","meaning":"母體變異數"},{"sym":"SS","meaning":"平方和,即離均差平方和"},{"sym":"n","meaning":"樣本中的個體數"},{"sym":"N","meaning":"母體中的個體數"}],"formulas":[{"name":"母體變異數","expr":"σ² = Σ(X − μ)² / N","note":"離均差平方和除以母體個數"},{"name":"樣本變異數(母體估計)","expr":"s² = Σ(X − X̄)² / (n − 1)","note":"分母用 n − 1 以修正低估"},{"name":"母體標準差","expr":"σ = √( Σ(X − μ)² / N )","note":"母體變異數開根號"},{"name":"樣本標準差","expr":"s = √( Σ(X − X̄)² / (n − 1) )","note":"樣本變異數開根號,回到原單位"},{"name":"離均差平方和","expr":"SS = Σ(X − X̄)²","note":"變異數公式的分子,ANOVA 與迴歸的基礎"},{"name":"全距與四分位距","expr":"全距 = 最大值 − 最小值;IQR = P₇₅ − P₂₅","note":"前者看兩端,後者看中間一半"}],"example":{"title":"491 名中學生的自信題與表現能力題","takeaway":"兩題都是 1–5 分、全距都是 4。自信題平均 4.21、標準差 0.98,表示多數人擠在高分端、彼此差約 1 分;表現能力題平均 2.92、標準差 1.43,表示答案相當平均地散在五個選項。全距分不出兩者,平均數加標準差才能;變異數(0.96、2.04)難以直接解讀。"},"pitfalls":["全距只由兩個極端值決定,98 人同分也可能出現很大的全距。","變異數的單位是原單位的平方,不宜直接拿來描述資料有多分散。","自信題的變異數 0.96 與標準差 0.98 幾乎相等純屬巧合,只有標準差接近 1 時才會如此。","把標準差說成「平均離差」只是幫助理解的近似說法;真正的平均離差是 Σ|X − 平均數| / N。"],"apa":null,"clinical":"兩個病房平均疼痛分數都是 4 分:A 病房標準差 0.5,人人在 4 分上下;B 病房標準差 3,有人 0 分、有人 9 分。平均相同,B 病房卻需個別化止痛評估。","quiz":[{"q":"兩道五點量表題的全距都是 4,為什麼不能說兩題的分散程度一樣?","a":"全距只看最大與最小值,只要各有至少一人選 1 和 5 就是 4。自信題標準差 0.98、表現能力題 1.43,後者的答案散得多;要看標準差才知道平均離散程度。"},{"q":"為什麼不能直接把所有離均差加起來再平均,當作變異的指標?","a":"平均數是分布的數學中心,正負離均差剛好抵銷,總和永遠是零,除以任何 n 都是零。所以要先平方消去負號,求平均後再開根號回到原單位。"},{"q":"樣本只有 10 人與 500 人時,分母用 n − 1 或 n 的差別有何不同?為什麼要用 n − 1?","a":"500 人時兩者相差不到 1%,10 人時標準差會大近五分之一。因為用樣本平均數算離均差會低估母體變異,縮小分母可把估計值調大,小樣本尤其需要。"}],"slide":{"headline":"平均數要配標準差","bullets":["全距只看兩端,容易誤導","變異數=離均差平方的平均","標準差=變異數開根號,回到原單位","樣本公式除以 n − 1,修正低估"],"stat":{"num":"n − 1","label":"樣本變異數的分母"}},"ocr_notes":["原書第 29 頁自信題的統計量列印為「极差=5—4=1」(已對照頁面影像),但下一頁正文說全距為 4,應為原書誤植,正確為 5 − 1 = 4。","表 3-1 公式 OCR 毀損,已依正文重建;母體/樣本的變異數與標準差共四式。","表 3-2 的數值依 OCR 與計算互相印證:√(100/500) = 0.44721、√(100/499) = 0.44766、√(100/10) = 3.16、√(100/9) = 3.33。","圖 3-3、3-4 各長條對應的選項未能從 OCR 確定(圖 3-3 可辨識 247、139、73、23;圖 3-4 為 115、120、98、81、77),引用個別次數前需對原書。","第 3 章符號表未列 X̄(樣本平均數),但表 3-1 有使用。"],"title_tw":"變異性之測量"},{"n":7,"title_cn":"统计显著性、效应量和置信区间","title_en":"Statistical Significance, Effect Size, and Confidence Intervals","pages":"69–87","one_liner":"判讀結果要三件一起看：p 值是否顯著、效應量多大、信賴區間落在哪。","summary":"本章說明如何從樣本推論母體。推論統計的核心是機率：任何統計量都有抽樣分布與標準誤，因此可算出「若虛無假設為真，隨機抽樣碰巧得到這個結果」的機率，即 p 值；p 小於事先選定的 α（慣例 0.05）就拒絕虛無假設，稱為統計顯著，但仍可能犯型一錯誤。作者接著指出顯著性檢定對樣本數極敏感：樣本大時微小差異也顯著，樣本小時大差異也不顯著。所以要另外用效應量（以標準差為單位衡量差異，不受樣本數影響）判斷實務上的重要性，並用信賴區間給出母體參數的可能範圍。三者並用，再加上研究者自己的判斷，才是完整的解讀。","sections":[{"heading":"敘述統計與推論統計、樣本與母體","points":["敘述統計只描述手上這批資料；推論統計則用樣本資料去推斷樣本所代表的更大母體。","統計顯著性衡量的是：樣本中觀察到的現象，有多大可能反映母體中真實存在的現象，而非抽樣的巧合。","社會科學研究常沒有把母體界定清楚，這會讓「結果可推論到誰」變得模糊，解讀時要留意。"]},{"heading":"機率、假設檢定與型一錯誤","points":["每個統計量（平均數、r、t、F、迴歸係數）都有抽樣分布與標準誤，據此可算出碰巧得到某統計值的機率。","鞋碼例子：母體平均 9、隨機樣本 n=1000 平均 10、標準差 2，標準誤約 0.06，t=16.67，p\u003c0.001。","虛無假設主張母體中沒有效應；對立假設可為雙尾（只說不同）或單尾（指定方向），都要在分析前先設定。","α 是研究者事前願意承擔的型一錯誤機率，慣例取 0.05，想更保守可取 0.01；p\u003cα 才拒絕虛無假設。","即使拒絕了虛無假設，仍可能是抽樣運氣造成的，這種把真的虛無假設拒絕掉的情形就是型一錯誤。"]},{"heading":"效應量：把樣本數的影響拿掉","points":["檢定統計量多半是「差異 ÷ 標準誤」，樣本越大標準誤越小、統計值越大，所以顯著性高度受樣本數左右。","IQ 例子：母體平均 100，樣本平均 105、標準差 15；n=25 時 t=1.67 不顯著，n=1600 時 t=13.33 高度顯著。","效應量 d 把分母由標準誤換成標準差，兩個樣本都得到 d=5/15=0.33，不隨樣本數改變。","書中引用的粗略標準：d 小於 0.20 為小、0.25–0.75 為中、超過 0.80 為大，但沒有硬性規則。","實務顯著性是主觀判斷：藥物死亡率的小效應很重要，冰淇淋口味的大效應對多數人無關緊要。"]},{"heading":"信賴區間：母體參數可能落在哪","points":["信賴區間以樣本統計值為中心，向兩側各加減「臨界 t 值 × 標準誤」，通常算 95% 或 99%。","因為區間向兩側展開，即使假設是單尾，也採用雙尾 α 對應的 t 值（df 無限大時為 1.96 與 2.576）。","鞋碼例子的 95% 區間為 9.88–10.12、99% 區間為 9.85–10.15，都不含 9，與顯著的檢定結果一致。","想要更高的把握就得把區間拉寬；樣本數越大，標準誤越小，區間也就越窄。"]},{"heading":"實例：成就表現目標的單一樣本 t 檢定","points":["以加州高中生樣本的表現目標量表平均（3.04）對照假定的全美母體平均 3.00，採雙尾對立假設。","SPSS 得 t=1.012、df=489、p=0.312，大於 0.05，因此保留虛無假設，結果不顯著。","樣本平均的 95% 區間 2.958–3.132 含 3.00；差異的區間 −0.042 到 0.132 含 0，結論相同。","效應量 d=0.0449/0.98≈0.05，極小；顯著性、信賴區間、效應量三者指向同一結論。"]}],"concepts":[{"tw":"統計顯著性","cn":"统计显著性","en":"statistical significance","diff":false,"note":"碰巧得到此結果的機率小於 α，於是拒絕虛無假設。"},{"tw":"p 值","cn":"p值","en":"p value","diff":false,"note":"虛無假設為真時，單靠抽樣誤差得到這麼大統計值的機率。"},{"tw":"虛無假設","cn":"零假设","en":"null hypothesis","diff":true,"note":"主張母體中沒有差異或沒有關聯的基準假設。"},{"tw":"型一錯誤","cn":"第I类错误","en":"Type I error","diff":true,"note":"虛無假設其實為真，卻被我們拒絕了。"},{"tw":"α 水準（顯著水準）","cn":"α水平","en":"alpha level","diff":true,"note":"事前決定可容忍的型一錯誤機率，慣例 0.05。"},{"tw":"效應量（效果量）","cn":"效应量","en":"effect size","diff":false,"note":"以標準差為單位表示效應大小，不受樣本數影響。"},{"tw":"實務顯著性","cn":"实际显著性","en":"practical significance","diff":true,"note":"結果在真實世界是否重要，屬主觀判斷。"},{"tw":"信賴區間","cn":"置信区间","en":"confidence interval","diff":true,"note":"以一定信心水準（如 95%）涵蓋母體參數的數值範圍。"},{"tw":"隨機抽樣誤差","cn":"随机抽样误差","en":"random sampling error","diff":false,"note":"單純因為抽到哪些人而造成樣本與母體的落差。"}],"terms":[{"cn":"α水平","tw":"α 水準（顯著水準）","en":"alpha level","diff":true},{"cn":"替代假设","tw":"對立假設","en":"alternative hypothesis","diff":true},{"cn":"置信区间","tw":"信賴區間","en":"confidence interval","diff":true},{"cn":"描述统计量","tw":"敘述統計（描述統計）","en":"descriptive statistics","diff":true},{"cn":"效应量","tw":"效應量（效果量）","en":"effect size","diff":false},{"cn":"推断统计量","tw":"推論統計","en":"inferential statistics","diff":true},{"cn":"零假设","tw":"虛無假設","en":"null hypothesis","diff":true},{"cn":"单尾","tw":"單尾","en":"one-tailed","diff":false},{"cn":"总体","tw":"母體","en":"population","diff":true},{"cn":"实际显著性","tw":"實務顯著性（實質顯著性）","en":"practical significance","diff":true},{"cn":"p值","tw":"p 值","en":"p value","diff":false},{"cn":"随机机会","tw":"隨機機遇（機率巧合）","en":"random chance","diff":true},{"cn":"随机抽样误差","tw":"隨機抽樣誤差","en":"random sampling error","diff":false},{"cn":"样本","tw":"樣本","en":"sample","diff":false},{"cn":"统计显著性","tw":"統計顯著性","en":"statistical significance","diff":false},{"cn":"双尾","tw":"雙尾","en":"two-tailed","diff":false},{"cn":"第I类错误","tw":"型一錯誤（第一類型錯誤）","en":"Type I error","diff":true},{"cn":"参数","tw":"母數（參數）","en":"parameter","diff":true},{"cn":"均值的标准误","tw":"平均數的標準誤","en":"standard error of the mean","diff":true},{"cn":"样本容量","tw":"樣本數（樣本大小）","en":"sample size","diff":true},{"cn":"单样本t检验","tw":"單一樣本 t 檢定","en":"one-sample t test","diff":true}],"symbols":[{"sym":"p","meaning":"p 值，機率"},{"sym":"α","meaning":"α 水準（顯著水準）"},{"sym":"d","meaning":"效應量的一種測度"},{"sym":"S","meaning":"計算效應量時所用的標準差"},{"sym":"∞","meaning":"無限大（自由度大於 120 時查表用的列）"},{"sym":"s_x̄","meaning":"用樣本標準差算出的標準誤"},{"sym":"σ_x̄","meaning":"用母體標準差算出的標準誤"},{"sym":"H₀","meaning":"虛無假設"},{"sym":"H_A 或 H₁","meaning":"對立假設"}],"formulas":[{"name":"平均數的標準誤","expr":"s_x̄ = s / √n","note":"樣本越大，標準誤越小"},{"name":"單一樣本 t 值","expr":"t = (X̄ − μ) / s_x̄","note":"差異以標準誤為單位"},{"name":"效應量 d","expr":"d = (X̄ − μ) / S，其中 S = s_x̄ × √n","note":"差異以標準差為單位，與 n 無關"},{"name":"95% 信賴區間","expr":"CI₉₅ = X̄ ± (t₉₅)(s_x̄)","note":"t₉₅ 為雙尾 α=0.05 的臨界 t 值"},{"name":"99% 信賴區間","expr":"CI₉₉ = X̄ ± (t₉₉)(s_x̄)","note":"t₉₉ 為雙尾 α=0.01 的臨界 t 值"},{"name":"雙尾假設","expr":"H₀: μ = X̄ ；H_A: μ ≠ X̄","note":"單尾時對立假設寫成 μ \u003c X̄ 之類的方向式"}],"example":{"title":"加州高中生「表現目標」動機量表的單一樣本 t 檢定","takeaway":"作者以 5 題、1–5 分的表現目標量表調查加州高中生，樣本平均 3.04、標準差 0.98、標準誤 0.044，與假定的全美母體平均 3.00 比較。t(489)=1.012、p=0.312，不顯著；95% 信賴區間 2.958–3.132 涵蓋 3.00；效應量 d≈0.05。三項指標一致：加州學生與全美學生在表現目標上沒有實質差別。"},"pitfalls":["統計顯著不等於實務上重要：樣本很大時，IQ 差 1 分也會顯著。","不顯著不等於沒有效應：n=4 時 IQ 差 15 分也達不到顯著。","拒絕虛無假設仍可能是型一錯誤；p 值只是機率，不是證明。","效應量大小的門檻只是參考，重要與否要看研究情境與利害關係人。"],"apa":"加州高中生在表現目標量表的平均分數（M = 3.04, SD = 0.98）與全美假定平均 3.00 無顯著差異，t(489) = 1.01, p = .31, d = 0.05, 95% CI [2.96, 3.13]。","clinical":"比較新舊敷料的傷口癒合天數時，若收案數千人，差 0.2 天也可能 p\u003c0.05；此時要看效應量與信賴區間，判斷這點差距是否值得改變病房常規與成本。","quiz":[{"q":"兩個研究的平均差與標準差完全相同，為什麼一個顯著、一個不顯著？","a":"因為樣本數不同。標準誤等於標準差除以樣本數的平方根，樣本大則標準誤小、t 值大、p 值小；效應量 d 不含樣本數，所以兩者 d 相同。"},{"q":"95% 信賴區間不包含虛無假設所設定的母體值，代表什麼？","a":"代表在 α=0.05 的雙尾檢定下結果達統計顯著，樣本很可能不是來自該假定母體；鞋碼例子的區間 9.88–10.12 不含 9 就是如此。"},{"q":"把 α 從 0.05 改成 0.01 有什麼意義與代價？","a":"代表願意承擔的型一錯誤機率由 5% 降到 1%，判定更保守；代價是需要更小的 p 值才能拒絕虛無假設，對應的信賴區間也會變寬。"}],"slide":{"headline":"顯著性、效應量、信賴區間","bullets":["p 值：虛無假設為真時碰巧得到此結果的機率","p \u003c α（慣例 0.05）才拒絕虛無假設，仍可能犯型一錯誤","效應量 d 以標準差為單位，不被樣本數放大","信賴區間給出母體參數的範圍，三者要一起解讀"],"stat":{"num":"p \u003c .05","label":"慣用顯著門檻"}},"ocr_notes":["實例的樣本數：內文 OCR 作 483 名學生，SPSS 表與後續計算作 n=490（df=489），需對原書確認。","鞋碼例子的標準誤書中寫 0.06（2÷31.62 實際約 0.063），t=16.67 是依 0.06 計算；此為書中四捨五入。","效應量公式 d=(X̄−μ)/S 與符號表中 d、S、∞、s_x̄、σ_x̄ 的符號在 OCR 中遺失，係依上下文重建。","書中效應量大小門檻 OCR 為「小於 0.20 小、0.25～0.75 中、超過 0.80 大」，數字間有空隙，請核對。","內文提到 IQ 差 15 分、n=4 的圖示寫「如圖 7-3 所示」，依內容應為圖 7-4，可能是原書筆誤。"],"title_tw":"統計顯著性、效應量與信賴區間"},{"n":8,"title_cn":"相关性","title_en":"Correlation","pages":"88–103","one_liner":"相關係數說明兩變項關係的方向與強度，r² 是共享變異比例，但相關不是因果。","summary":"本章從單變項統計進到兩個變項的關係，主角是皮爾森積差相關係數 r。r 介於 −1 與 +1 之間，正負號表示方向，絕對值表示強度；它其實是兩變項 z 分數交乘積的平均，也就是標準化後的共變數。作者強調 r 的限制：它只描述「平均而言」的線性關係，遇到曲線關係或變項分數範圍被截斷時會低估真實關聯，而且相關本身不能證明因果，可能有第三變項在作用。接著說明如何用 t 分布檢定 r 是否顯著異於 0（df = N − 2），以及把 r 平方得到決定係數，解讀為兩變項共享或可被解釋的變異比例。最後簡介變項不是等距或比率尺度時使用的點二系列、phi 與斯皮爾曼等級相關。","sections":[{"heading":"相關的用途：方向與強度","points":["皮爾森 r 要求兩個變項都是等距或比率尺度的連續變項，且每位受試者的兩個分數必須成對。","正相關表示兩變項平均而言同向變動，負相關表示反向變動；「平均而言」代表不必對每個人都成立。","r 的範圍是 −1.00 到 +1.00，0 代表沒有關係；社會科學實際研究中多落在 −0.70 到 +0.70 之間。","粗略標準：絕對值小於 0.20 為弱、0.20–0.50 為中、大於 0.50 為強，但仍須看議題的重要性來判斷。","散布圖把每個人在兩變項上的分數畫成一點，可直接看出關係的方向、強弱與有無規律。"]},{"heading":"皮爾森 r 怎麼算、代表什麼","points":["書中採定義式：先把兩變項都轉成 z 分數，逐人相乘得交乘積，加總後除以配對數 N。","兩個分數同在平均之上或同在平均之下時交乘積為正，一高一低時為負，加總後的正負決定 r 的方向。","原始分數交乘積的平均就是共變數；先標準化再求平均，得到的標準化共變數就是相關係數。","作者建議實際計算交給計算機或統計軟體，重點是理解公式背後的邏輯。"]},{"heading":"相關說了什麼、沒說什麼","points":["相關不等於因果：鸛鳥數量與嬰兒出生數同時上升，其實都源自寒冬這個第三變項。","相關是主張因果的必要條件但不充分；吸菸與癌症要先有相關，還得排除其他因素才能談因果。","r 只捕捉直線關係；焦慮與表現先升後降的曲線關係，算出的 r 會很小而低估真實關聯。","截斷的分數範圍會壓低相關：考試太簡單造成天花板效應，讀書時間與分數看起來就沒關係。"]},{"heading":"顯著性檢定與決定係數","points":["檢定的虛無假設是母體相關 ρ 等於 0，對立假設是 ρ 不等於 0，使用 t 分布，自由度為 N − 2。","日照時數與情緒的例子：N=100、r=0.25，算得 t=2.56、df=98，雙尾 p 介於 0.01 與 0.02 之間，達顯著。","即使顯著仍不能說日照造成好心情，氣溫較暖可能才是真正原因，再次提醒相關非因果。","決定係數是 r 的平方，表示一個變項的變異有多少比例可由另一變項解釋，即兩者的共享變異。","r=0.30 時 r²=0.09，r=0.55 時 r²=0.30；相關越強，重疊的變異越多，但這仍不代表因果。"]},{"heading":"其他相關係數","points":["點二系列相關：一個連續變項配一個二分變項，例如有無汽車與交通規則筆試分數。","phi 係數：兩個變項都是二分變項，例如性別與是否吸菸；這類資料也可以用卡方分析。","斯皮爾曼 rho：兩個變項都是次序（排名）資料，例如在校成績排名與標準化測驗排名。","這三種都是皮爾森 r 在特定測量尺度下的特殊版本，數值與解讀方式都和 r 很相近。"]}],"concepts":[{"tw":"皮爾森積差相關係數","cn":"皮尔逊积差相关系数","en":"Pearson product-moment correlation coefficient","diff":true,"note":"描述兩個連續變項線性關係方向與強度的統計量 r。"},{"tw":"相關不等於因果","cn":"因果关系","en":"causation","diff":false,"note":"兩變項一起變動，不代表其中一個造成另一個。"},{"tw":"決定係數","cn":"决定系数","en":"coefficient of determination","diff":false,"note":"r 的平方，一變項變異可被另一變項解釋的比例。"},{"tw":"共變數","cn":"协方差","en":"covariance","diff":true,"note":"交乘積的平均；標準化之後就是相關係數。"},{"tw":"共享變異量","cn":"共享方差","en":"shared variance","diff":true,"note":"兩個相關變項彼此重疊的那部分變異。"},{"tw":"曲線關係","cn":"曲线","en":"curvilinear","diff":false,"note":"關係在某段為正、另一段為負，r 會低估其強度。"},{"tw":"全距限縮（截斷範圍）","cn":"截断范围","en":"truncated range","diff":true,"note":"分數擠在頂端或底端，變異不足而壓低相關。"},{"tw":"散布圖","cn":"散点图","en":"scattergram","diff":true,"note":"把每人兩個變項的分數畫成一個點的圖。"},{"tw":"斯皮爾曼等級相關","cn":"斯皮尔曼ρ系数","en":"Spearman rho coefficient","diff":false,"note":"兩個次序變項之間的相關係數。"}],"terms":[{"cn":"因果关系","tw":"因果關係","en":"causation","diff":false},{"cn":"决定系数","tw":"決定係數","en":"coefficient of determination","diff":false},{"cn":"连续变量","tw":"連續變項","en":"continuous variables","diff":true},{"cn":"相关系数","tw":"相關係數","en":"correlation coefficient","diff":false},{"cn":"协方差","tw":"共變數","en":"covariance","diff":true},{"cn":"交叉乘积","tw":"交乘積","en":"cross products","diff":true},{"cn":"曲线","tw":"曲線（曲線關係）","en":"curvilinear","diff":false},{"cn":"自由度","tw":"自由度","en":"degrees of freedom","diff":false},{"cn":"二分变量","tw":"二分變項","en":"dichotomous variable","diff":true},{"cn":"方向","tw":"方向","en":"direction","diff":false},{"cn":"可释方差","tw":"可解釋變異量","en":"explained variance","diff":true},{"cn":"负相关","tw":"負相關","en":"negative correlation","diff":false},{"cn":"皮尔逊积差相关系数","tw":"皮爾森積差相關係數","en":"Pearson product-moment correlation coefficient","diff":true},{"cn":"完全负相关","tw":"完全負相關","en":"perfect negative correlation","diff":false},{"cn":"完全正相关","tw":"完全正相關","en":"perfect positive correlation","diff":false},{"cn":"Φ系数","tw":"phi 係數（φ 相關）","en":"phi coefficient","diff":false},{"cn":"点二列系数","tw":"點二系列相關係數","en":"point-biserial coefficient","diff":true},{"cn":"正相关关系","tw":"正相關","en":"positive correlation","diff":false},{"cn":"散点图","tw":"散布圖","en":"scattergram","diff":true},{"cn":"共享方差","tw":"共享變異量","en":"shared variance","diff":true},{"cn":"斯皮尔曼ρ系数","tw":"斯皮爾曼等級相關係數（ρ）","en":"Spearman rho coefficient","diff":false},{"cn":"强度、量级","tw":"強度、大小","en":"strength, magnitude","diff":true},{"cn":"截断范围","tw":"全距限縮（截斷範圍）","en":"truncated range","diff":true},{"cn":"z分数","tw":"z 分數","en":"z score","diff":false},{"cn":"定距","tw":"等距（尺度）","en":"interval","diff":true},{"cn":"定比","tw":"比率（尺度）","en":"ratio","diff":true},{"cn":"定序","tw":"次序（尺度）","en":"ordinal","diff":true},{"cn":"上限效应","tw":"天花板效應","en":"ceiling effect","diff":true}],"symbols":[{"sym":"r","meaning":"樣本的皮爾森相關係數"},{"sym":"ρ","meaning":"母體相關係數"},{"sym":"s_r","meaning":"相關係數的標準誤"},{"sym":"r²","meaning":"決定係數"},{"sym":"df","meaning":"自由度"},{"sym":"Φ","meaning":"phi 係數，兩個二分變項之間的相關"}],"formulas":[{"name":"皮爾森相關係數（定義式）","expr":"r = Σ(z_x · z_y) / N","note":"z 分數交乘積的平均；N 為配對數"},{"name":"相關係數的假設","expr":"H₀: ρ = 0 ；H₁: ρ ≠ 0","note":"檢定 r 是否顯著異於 0"},{"name":"相關係數的標準誤","expr":"s_r = √( (1 − r²) / (N − 2) )","note":"書中僅供了解，實算用下式"},{"name":"相關係數的 t 檢定","expr":"t = (r − ρ) / s_r = r · √( (N − 2) / (1 − r²) )，df = N − 2","note":"虛無假設下 ρ = 0"},{"name":"決定係數","expr":"r² = r × r","note":"共享（可解釋）變異的比例"}],"example":{"title":"高中生學業成績平均（GPA）與 Naglieri 非語文能力測驗的相關","takeaway":"作者從加州一所高中取得 314 名十一年級學生的累積 GPA 與 Naglieri 非語文能力測驗分數，SPSS 算得 r=0.4291、p\u003c0.0001，為中等且顯著的正相關。平方後 r²≈0.18，即 GPA 只解釋測驗分數約 18% 的變異，超過 80% 未被解釋，因此作者認為教師評定的成績與標準化能力測驗測到的是相當不同的構念。"},"pitfalls":["顯著的相關不代表因果，可能有第三變項同時影響兩者（鸛鳥與嬰兒、日照與氣溫）。","r 只反映直線關係，曲線關係會讓 r 接近 0 而被誤判為無關。","天花板或地板效應使分數範圍被截斷，會低估真實的相關強度。","強弱門檻只是經驗法則：酒精與肝病的 r=0.15 也可能非常重要。"],"apa":"GPA 與 Naglieri 測驗分數呈中等強度且顯著的正相關，r = .43, p \u003c .001；決定係數 r² = .18，表示測驗分數約 18% 的變異可由 GPA 解釋。（書中指出報告相關時很少附 t 值。）","clinical":"護理人員每月夜班數與疲勞量表分數若 r=0.40，只能說夜班多的人平均較疲勞（共享 16% 變異），不能直接說夜班造成疲勞，年資、家庭照顧負荷都可能是第三變項。","quiz":[{"q":"兩變項的 r 接近 0，可以斷定它們沒有關係嗎？","a":"不行。r 只衡量線性關係，若關係是先升後降的曲線，或其中一個變項的分數範圍被截斷，r 都會很小，卻不代表兩者真的無關，應先看散布圖。"},{"q":"r = 0.25、N = 100 的相關達顯著，這個關係算強嗎？","a":"不算強。r² 只有 0.0625，即約 6% 的共享變異；它顯著主要是因為樣本夠大（t=2.56、df=98）。顯著性與關係強度是兩回事。"},{"q":"為什麼說相關係數是「標準化的共變數」？","a":"共變數是兩變項離均差交乘積的平均，單位受原始量尺影響；先把兩變項轉成 z 分數再求交乘積平均，就消除了單位，結果被限制在 −1 到 +1，這就是 r。"}],"slide":{"headline":"相關：方向、強度與限制","bullets":["r 介於 −1 與 +1，正負號看方向、絕對值看強度","r 是 z 分數交乘積的平均，即標準化共變數","r² 為決定係數，表示兩變項共享的變異比例","相關非因果；曲線關係與截斷範圍會低估 r"],"stat":{"num":"r²","label":"共享變異比例"}},"ocr_notes":["表 8-1 與表 8-3 的「備考時間」欄數字在 OCR 中大多遺失（僅見考試成績 80、85、70、90、85 與 95、95、100、95、100），未納入筆記。","表 8-2 定義式、s_r 與 t 公式的符號被 OCR 破壞，係依文字說明與算例（0.25×√(98/0.9375)=2.56）重建。","圖 8-1 的相關係數 OCR 兩處皆為 0.97，應為 r=0.97 與 r=−0.97，負號遺失。","SAT 與大學第一年 GPA 相關約 0.40 那段開頭有一行遺失，「高考分數」的原文用語請核對原書。","圖 8-6 第二個例子 OCR 為 r=0.55、r²=0.30，請核對原圖。"],"title_tw":"相關"},{"n":13,"title_cn":"回归","title_en":"Regression","pages":"166–184","one_liner":"迴歸把相關變成預測:用預測變項估計依變項,並看每個變項的獨特貢獻。","summary":"本章從第 8 章的相關與決定係數出發,說明迴歸如何把「兩變項有關」改寫成「已知 X 可預測 Y」。簡單線性迴歸只有一個預測變項,用最小平方法找出讓殘差平方和最小的那條直線,由斜率 b 與截距 a 組成方程式;它提供的資訊其實不比相關係數多。真正的威力在多元迴歸:同時放入多個預測變項,可看整體模型解釋多少變異(R、R²、F 檢定),也能在控制其他變項後檢定每個預測變項的迴歸係數,並用標準化係數 β 比較相對強度。作者以教育年數、工作年資預測月收入,以及預測高中生自我設限策略兩個例子示範,最後提醒迴歸和相關一樣不能證明因果。","sections":[{"heading":"簡單迴歸與多元迴歸、可用的變項","points":["簡單迴歸對應單因子變異數分析:一個預測變項配一個依變項;多元迴歸對應多因子設計,有兩個以上預測變項。","相關不區分誰是自變項誰是依變項,迴歸一定要區分,因為目的是用預測變項的已知值去推估依變項。","多元迴歸能回答四件事:整體關聯有多強、控制他項後各變項的關係、各變項相對強度、是否有交互作用。","依變項須為等距或比率尺度;預測變項可為連續或二分變項。依變項為二分時要用 Logit(邏輯斯)迴歸,本書不談。"]},{"heading":"簡單線性迴歸詳解:方程式、斜率與截距","points":["迴歸方程式 Ŷ = bX + a:b 是未標準化迴歸係數(斜率),a 是截距,即 X 為 0 時的預測值。","普通最小平方法(OLS)找的是唯一一條讓各資料點到直線距離平方和最小的線,這條線就是迴歸線。","斜率等於相關係數乘上兩變項標準差之比,等於把 r 換回原始測量單位;皮爾森 r 則是標準化後的簡單迴歸係數。","預測必有誤差:觀察值減預測值就是殘差。正殘差代表低估,負殘差代表高估;相關愈強,預測誤差愈小。","含誤差項的方程式寫成 Y = bX + a + e,描述的是實際觀察值而非預測值。"]},{"heading":"多元迴歸:共享變異、R² 與迴歸係數","points":["加入第二個預測變項後方程式變成 Ŷ = a + b₁X₁ + b₂X₂,每個係數都是控制其他預測變項後的關係。","預測變項彼此相關太高時,各自能解釋的獨特變異所剩無幾,難以分辨個別貢獻,這就是多元共線性問題。","輸出分三塊:解釋變異量(R、R²、調整後 R²)、變異數分析(整體模型 F 檢定)、迴歸係數(B、β、t、p)。","R² 是多元迴歸的效應量;調整後 R² 依預測變項數與樣本數把數值略微下修。","未標準化係數 B 單位不同不能互比,要看標準化係數 β;各係數的 t 檢定則檢驗斜率是否顯著不為 0。"]},{"heading":"例子與行文表述:預測自我設限策略","points":["464 名高中生,以逃避目標、自我效能、性別(男 = 1、女 = 0 的虛擬編碼)與學業平均成績預測自我設限。","整體模型顯著(F = 15.686,p \u003c .001),但只解釋約 12% 的變異(調整後 11.3%),屬中等關聯。","成績與自我效能為負向預測,逃避目標為正向預測,性別不顯著;每個結果都是控制其他變項後的淨效果。","報告時交代:同時投入哪些預測變項、解釋多少變異、哪些顯著,以及各顯著變項的 β 與方向。"]},{"heading":"總結:迴歸、相關與變異數分析是一家人","points":["簡單迴歸的係數只是皮爾森相關係數的未標準化版本,兩者傳達的是同一種關係。","迴歸同樣在分割依變項的變異並用自變項解釋,迴歸均方除以殘差均方得到 F,與變異數分析如出一轍。","一般說變異數分析用類別自變項、迴歸用連續自變項,但迴歸其實也能處理類別自變項,界線並不絕對。"]}],"concepts":[{"tw":"迴歸方程式","cn":"回归方程","en":"regression equation","diff":true,"note":"Ŷ = bX + a,把 X 的值代入就得到 Y 的預測值,也能畫出迴歸線。"},{"tw":"迴歸係數(斜率)","cn":"回归系数","en":"regression coefficient / slope","diff":true,"note":"X 每增加 1 單位,Y 的預測值平均改變多少。"},{"tw":"截距","cn":"截距","en":"intercept","diff":false,"note":"迴歸線與 Y 軸的交點,也就是 X = 0 時的預測值。"},{"tw":"殘差","cn":"残差","en":"residual","diff":false,"note":"觀察值減預測值的差,就是預測誤差;正值為低估、負值為高估。"},{"tw":"普通最小平方法迴歸","cn":"普通最小二乘回归","en":"ordinary least squares regression (OLS)","diff":true,"note":"挑出使殘差平方和最小的那條直線當作迴歸線。"},{"tw":"多元迴歸(複迴歸)","cn":"多元回归","en":"multiple regression","diff":true,"note":"同時用兩個以上預測變項,可看整體解釋力與各自的獨特貢獻。"},{"tw":"多元相關係數與 R²","cn":"多元相关系数","en":"multiple correlation coefficient (R), R²","diff":true,"note":"R 是預測值與觀察值的相關;R² 是模型解釋的變異比例,也是效應量。"},{"tw":"標準化迴歸係數","cn":"标准化回归系数","en":"standardized regression coefficient (β)","diff":true,"note":"把係數換成共同的標準分數尺度,才能比較哪個預測變項較強。"},{"tw":"多元共線性","cn":"多重共线性","en":"multicollinearity","diff":true,"note":"預測變項彼此高度相關,使各自與依變項的獨特關係難以辨識。"}],"terms":[{"cn":"简单线性回归","tw":"簡單線性迴歸","en":"simple linear regression","diff":true},{"cn":"多元回归","tw":"多元迴歸(複迴歸)","en":"multiple regression","diff":true},{"cn":"因变量、结果变量、准则变量","tw":"依變項、結果變項、效標變項","en":"dependent, outcome, criterion variable","diff":true},{"cn":"二分","tw":"二分(二元)","en":"dichotomous","diff":false},{"cn":"误差","tw":"誤差","en":"error","diff":false},{"cn":"自变量、预测变量","tw":"自變項、預測變項","en":"independent, predictor variable","diff":true},{"cn":"截距","tw":"截距","en":"intercept","diff":false},{"cn":"多重共线性","tw":"多元共線性","en":"multicollinearity","diff":true},{"cn":"多元相关系数","tw":"多元相關係數(複相關係數)","en":"multiple correlation coefficient","diff":true},{"cn":"观测值","tw":"觀察值","en":"observed value","diff":true},{"cn":"普通最小二乘回归","tw":"普通最小平方法迴歸","en":"ordinary least squares regression (OLS)","diff":true},{"cn":"高估预测","tw":"高估","en":"overpredicted","diff":false},{"cn":"预测值","tw":"預測值","en":"predicted values","diff":false},{"cn":"回归系数","tw":"迴歸係數","en":"regression coefficient","diff":true},{"cn":"回归方程","tw":"迴歸方程式","en":"regression equation","diff":true},{"cn":"回归线","tw":"迴歸線","en":"regression line","diff":true},{"cn":"残差","tw":"殘差","en":"residuals","diff":false},{"cn":"散点图","tw":"散佈圖","en":"scatterplot","diff":true},{"cn":"斜率","tw":"斜率","en":"slope","diff":false},{"cn":"标准化回归系数","tw":"標準化迴歸係數","en":"standardized regression coefficient","diff":true},{"cn":"低估预测","tw":"低估","en":"underpredicted","diff":false},{"cn":"独特方差","tw":"獨特變異量","en":"unique variance","diff":true},{"cn":"可释方差","tw":"可解釋變異量","en":"variance explained","diff":true},{"cn":"调整 R²","tw":"調整後 R²","en":"adjusted R²","diff":false},{"cn":"Logit回归","tw":"邏輯斯迴歸","en":"logit (logistic) regression","diff":true}],"symbols":[{"sym":"Ŷ","meaning":"依變項 Y 的預測值"},{"sym":"Y","meaning":"依變項 Y 的觀察值"},{"sym":"b","meaning":"未標準化迴歸係數"},{"sym":"a","meaning":"截距"},{"sym":"e","meaning":"誤差項"},{"sym":"R","meaning":"多元相關係數"},{"sym":"R²","meaning":"迴歸模型解釋的變異比例"}],"formulas":[{"name":"簡單迴歸方程式(預測值)","expr":"Ŷ = bX + a","note":"b 為斜率,a 為截距"},{"name":"迴歸係數(斜率)","expr":"b = r × ( s_y / s_x )","note":"相關係數乘以 Y 與 X 標準差之比"},{"name":"截距","expr":"a = Ȳ − bX̄","note":"先算出 b 才能算 a"},{"name":"預測誤差(殘差)","expr":"e = Y − Ŷ = Y − (a + bX)","note":"觀察值減預測值"},{"name":"含誤差的迴歸方程式(觀察值)","expr":"Y = bX + a + e","note":"描述實際值,把預測誤差算進來"},{"name":"兩個預測變項的多元迴歸","expr":"Ŷ = a + b₁X₁ + b₂X₂","note":"每個 b 都是控制另一變項後的係數"}],"example":{"title":"用教育年數與工作年資預測月收入;再以四個變項預測高中生自我設限","takeaway":"10 名成人中教育年數與月收入 r = 0.83,得 Ŷ = −3.77 + 0.61X:多讀一年書,預測月收入多 610 美元。加入工作年資後 R = .946、R² = .896,F = 30.095,兩個變項的 β(.676、.485)都顯著。真實資料(n = 464)中,四個變項解釋自我設限約 12% 變異,成績與自我效能負向、逃避目標正向、性別不顯著。"},"pitfalls":["迴歸建立在相關之上,只能說變項如何相關與預測,不能證明誰造成誰。","截距可能落在不合理的值(如月收入 −3.77 千美元),它只是 X = 0 的預測值,不必當真。","未標準化係數 B 受測量單位影響,不能直接比大小;比較相對強度要看 β。","預測變項彼此高度相關(多元共線性)時,各自的獨特貢獻會被吃掉;樣本太小(如書中示範的 10 人)也不適合跑多元迴歸。"],"apa":"以多元迴歸檢驗自我設限的預測因子,同時投入逃避目標、學業平均成績、性別與自我效能四個變項,合計解釋 11% 的變異。除性別外皆為顯著預測變項:學業成績(β = −.21)與自我效能(β = −.20)為最強的負向預測因子,逃避目標則為正向預測(β = .13)。","clinical":"想預測病人住院天數,可同時放入年齡、共病數與入院時功能分數。多元迴歸會告訴你三者合起來解釋多少變異,以及控制年齡與共病後,功能分數是否仍有獨立預測力。","quiz":[{"q":"書中說簡單線性迴歸「其實不比相關更有用」,那為什麼還要學它?","a":"因為它把關係寫成可代入的預測方程式,解讀較直觀(X 每增加一單位 Y 變多少),更重要的是它是理解多元迴歸的基礎,後者才能看控制他項後的獨特貢獻。"},{"q":"多元迴歸中,某預測變項的迴歸係數顯著,這句話完整的意思是什麼?","a":"指在控制(排除)模型中其他預測變項已解釋的變異之後,這個變項與依變項之間仍有顯著關係,也就是它的斜率顯著不為 0,具有獨特解釋力。"},{"q":"如果兩個預測變項彼此相關高達 0.90,把兩個都放進模型會發生什麼事?","a":"它們與依變項重疊的部分大多是共享變異,各自的獨特變異很小,所以第二個變項幾乎不增加解釋力,也難以分辨個別效果,這就是多元共線性。"}],"slide":{"headline":"迴歸:從相關走向預測","bullets":["Ŷ = bX + a:斜率看變化量,截距看起點","最小平方法找出殘差平方和最小的直線","多元迴歸看整體 R² 與各變項的獨特貢獻","比強弱看 β;能預測不等於有因果"],"stat":{"num":"R² = .896","label":"兩變項解釋收入變異"}},"ocr_notes":["表 13-2、13-3 的月收入與工作年資欄 OCR 多數缺漏,僅平均數、標準差、相關係數可辨,個別數值需對原書。","表 13-5、13-6 的自由度欄部分缺失(13-5 應為迴歸 2、殘差 7、總和 9;13-6 迴歸應為 4),為依均方推算。","表 13-6 中學業成績與自我效能的 β 負號被 OCR 吃掉(依行文表述應為 −0.209、−0.198);截距 a = −3.77 的負號亦同。","書 175 頁關於多元迴歸樣本數的經驗法則(「至少 30 個對象,各預測變項不少於 10…」)OCR 語意不清,需核對原書。","術語表中「多元相關係數」與「普通最小二乘回歸」兩條的詞頭被 OCR 截掉,依釋義補回。","書中 177 頁稱決定係數見第 7 章,章首則說第 8 章,疑為原書/譯本筆誤。"],"title_tw":"迴歸"},{"n":14,"title_cn":"卡方独立性检验","title_en":"The Chi-Square Test of Independence","pages":"185–192","one_liner":"兩個類別變項有沒有關聯?比較觀察次數與期望次數,用卡方來判斷。","summary":"前面各章的 t 檢定、變異數分析、相關與迴歸都假設資料來自常態分布的母體,現實研究常做不到。違反假設不一定讓結果失效,但嚴重時可改用不需常態與隨機抽樣假設的無母數統計。本章只介紹最常用的一種:卡方獨立性檢定,適用於兩個類別(名義)變項。做法是把資料排成列聯表,由行列合計算出各細格「純憑機率」應有的期望次數,再把觀察次數與期望次數的差距平方後除以期望次數並加總成 χ²,依自由度 (R − 1)(C − 1) 查臨界值,整個流程就是一次假設檢定。作者以性別與主修科系、性別與移民世代兩個例子示範,後者說明卡方可用來排除混淆的分組因素。","sections":[{"heading":"為什麼需要無母數統計","points":["母數統計假設資料取自常態母體,但社會科學的母體常偏態、測量困難、研究過程也不完美。","違反常態假設即使改變結果,多半不致讓結果無效;真的嚴重違反時,可改用無母數統計。","曼-惠特尼 U 檢定約等於獨立樣本 t 檢定的無母數版本,克-瓦二氏檢定則約對應單因子變異數分析。","卡方獨立性檢定處理兩個類別變項:問的是依某變項的分類是否獨立於另一變項的分類。"]},{"heading":"卡方獨立性檢定詳解:從列聯表到 χ²","points":["先在列聯表加上列合計、行合計與總數;細格期望次數 = 該列合計 × 該行合計 ÷ 總人數。","各細格計算 (O − E)² / E,六格相加得到觀察到的 χ²;差距大的細格對 χ² 貢獻最多。","自由度為 (R − 1)(C − 1);2 × 3 表 df = 2,α = .05 時由附錄 E 查得臨界值 5.99。","觀察 χ² 大於臨界值即拒絕「兩變項獨立」的虛無假設,結論為科系選擇與性別有關。"]},{"heading":"例子:性別與移民世代是否獨立","points":["若男生數學標準化測驗平均顯著高於女生,先別急著下結論,要檢查分組是否與其他因素糾纏。","第三代移民學生考得比第一、二代差;如果女生較多是第三代,性別差異可能其實是世代差異。","913 名學生的 2 × 3 列聯表得 χ² = 5.19,df = 2,小於 5.99,不顯著:性別與世代互相獨立。","因此可排除世代是性別差異的原因,但族裔、社經地位等其他變項仍須另外排除。"]},{"heading":"行文表述與總結","points":["卡方結果的寫法很短:說明檢定目的,報告 χ² 值、自由度與是否顯著,再用一句話解釋。","卡方只是眾多無母數方法之一;母數統計並非永遠合適,研究者應熟悉幾種無母數技術。","下一章(全書最後一章)轉向整理資料的兩種技術:因素分析與 Cronbach's α 信度分析。"]}],"concepts":[{"tw":"卡方獨立性檢定","cn":"卡方独立性检验","en":"chi-square test of independence","diff":true,"note":"檢驗兩個類別變項的分類彼此獨立還是有關聯。"},{"tw":"觀察次數","cn":"观测频数","en":"observed frequencies","diff":true,"note":"列聯表各細格實際數到的人數。"},{"tw":"期望次數","cn":"预期频数","en":"expected frequencies","diff":true,"note":"若兩變項無關、純憑機率,各細格應該出現的人數。"},{"tw":"列聯表","cn":"列联表","en":"contingency table","diff":false,"note":"把兩個類別變項交叉排列、每格放次數的表格。"},{"tw":"無母數統計","cn":"非参数统计量","en":"nonparametric statistics","diff":true,"note":"不依賴常態分布、變異數同質等假設的一組統計方法。"},{"tw":"卡方自由度","cn":"自由度","en":"degrees of freedom","diff":false,"note":"(列數 − 1) × (行數 − 1),用來查卡方臨界值。"},{"tw":"曼-惠特尼 U 檢定","cn":"曼—惠特尼U","en":"Mann-Whitney U","diff":true,"note":"用於次序資料,約等於獨立樣本 t 檢定的無母數版本。"},{"tw":"克-瓦二氏檢定","cn":"克鲁斯卡—沃利斯","en":"Kruskal-Wallis","diff":true,"note":"用於次序資料,約等於單因子變異數分析的無母數版本。"}],"terms":[{"cn":"卡方","tw":"卡方","en":"chi-square (χ²)","diff":false},{"cn":"列联表","tw":"列聯表","en":"contingency table","diff":false},{"cn":"预期频数","tw":"期望次數","en":"expected frequencies","diff":true},{"cn":"克鲁斯卡—沃利斯","tw":"克-瓦二氏檢定(Kruskal-Wallis 檢定)","en":"Kruskal-Wallis","diff":true},{"cn":"曼—惠特尼U","tw":"曼-惠特尼 U 檢定","en":"Mann-Whitney U","diff":true},{"cn":"非参数统计量","tw":"無母數統計","en":"nonparametric statistics","diff":true},{"cn":"观测频数","tw":"觀察次數","en":"observed frequencies","diff":true},{"cn":"卡方独立性检验","tw":"卡方獨立性檢定","en":"chi-square test of independence","diff":true},{"cn":"分类变量","tw":"類別變項","en":"categorical variable","diff":true},{"cn":"单元格","tw":"細格","en":"cell","diff":true},{"cn":"临界值","tw":"臨界值","en":"critical value","diff":false},{"cn":"零假设","tw":"虛無假設","en":"null hypothesis","diff":true},{"cn":"对立假设","tw":"對立假設","en":"alternative hypothesis","diff":false}],"symbols":[{"sym":"χ²","meaning":"卡方統計量"},{"sym":"O","meaning":"觀察次數"},{"sym":"E","meaning":"期望次數"},{"sym":"df","meaning":"自由度"},{"sym":"R","meaning":"列聯表的列數(橫列)"},{"sym":"C","meaning":"列聯表的行數(直行)"}],"formulas":[{"name":"卡方統計量","expr":"χ² = Σ [ (O − E)² / E ]","note":"每個細格算一次再全部加總"},{"name":"細格期望次數","expr":"E = (列合計 / N) × (行合計 / N) × N = (列合計 × 行合計) / N","note":"例:100 × 65 / 200 = 32.5"},{"name":"卡方獨立性檢定自由度","expr":"df = (R − 1)(C − 1)","note":"R 為列數、C 為行數;2 × 3 表 df = 2"}],"example":{"title":"性別 × 主修科系(虛構)與性別 × 移民世代(SPSS 實例)","takeaway":"男女各 100 人選心理、英語、生物:觀察次數男 35/50/15、女 30/25/45,心理與英語期望次數為 32.5、37.5。書中算得 χ² = 22.89,df = 2,遠大於臨界值 5.99,p \u003c .001,科系選擇與性別有關。另一例 913 名學生的性別 × 世代,χ² = 5.19,不顯著,兩者獨立。"},"pitfalls":["卡方處理的是類別(名義)變項的次數,不是平均數;連續分數不能直接丟進來。","期望次數來自行列合計,不是「每格平均分」;男女人數相同時兩列期望值才會一樣。","卡方不顯著只排除了這一個分組變項的混淆,其他類別或連續變項仍可能是真正原因。","母數統計並非總是合適,但違反常態假設也不一定讓結果失效,要看嚴重程度。"],"apa":"以卡方獨立性檢定檢驗男女生在三個移民世代組中的分布是否與其在樣本中的比例相符,結果未達顯著,χ²(2, N = 913) = 5.19,ns,顯示男女生在各世代組中皆未被過度代表。","clinical":"想知道病房別(內科/外科/加護)與是否發生壓力性損傷有無關聯,可排成 3 × 2 列聯表:若各病房發生人數與「純憑機率」的期望人數差距夠大,χ² 就會顯著。","quiz":[{"q":"期望次數代表什麼?為什麼書中男生、女生兩列的期望次數完全相同?","a":"期望次數是假設兩變項互相獨立、只憑行列合計與機率時各格該有的人數。因為樣本中男女各 100 人,列合計相同,所以每個科系的期望人數男女一樣。"},{"q":"一個 3 × 4 的列聯表做卡方獨立性檢定,自由度是多少?若 χ² 小於臨界值代表什麼?","a":"df = (3 − 1)(4 − 1) = 6。若觀察到的 χ² 小於該自由度與 α 下的臨界值,就不能拒絕虛無假設,結論是兩個類別變項彼此獨立。"},{"q":"在數學成績的性別差異例子裡,作者為什麼要先做性別與世代的卡方檢定?","a":"因為第三代學生成績較低,若女生較集中在第三代,成績的性別差異可能其實是世代造成的。卡方不顯著表示性別與世代獨立,可排除這個混淆來源。"}],"slide":{"headline":"卡方:類別變項獨立嗎?","bullets":["資料不符常態假設時可改用無母數統計","期望次數 = 列合計 × 行合計 ÷ 總人數","χ² = Σ (O − E)² / E,差距愈大值愈大","df = (R − 1)(C − 1),查附錄 E 臨界值"],"stat":{"num":"χ² = Σ(O−E)²/E","label":"觀察對期望"}},"ocr_notes":["原書印刷本身有不一致(已對頁面影像確認):生物學期望次數印為 33.3(依公式 100 × 60 / 200 應為 30),據此算出 χ² = 22.89;同頁假設檢定摘要卻寫觀察 χ² = 29.76。若用 30 重算,χ² 約為 23.72。結論(p \u003c .001、拒絕虛無假設)不受影響。","表 14-5 公式與表 14-6 部分細格被 OCR 破壞,公式依文字說明重建為 χ² = Σ (O − E)² / E。","書 190–191 頁之間、191 頁「总结与展望」各有一行 OCR 掉字(句子不完整),不影響主旨。"],"title_tw":"卡方獨立性檢定"},{"n":15,"title_cn":"因子分析与信度分析：数据整理技术","title_en":"Factor Analysis and Reliability Analysis: Data Reduction Techniques","pages":"193–209","one_liner":"因素分析把相關高的題項歸成因素,信度分析再檢查同組題項是否一致。","summary":"問卷研究常用好幾個題項去測一個無法直接觀察的構念。本章介紹兩種整理題項的技術,目的在幫讀者看懂文獻而非教操作。探索性因素分析(EFA)依題項間相關的強弱萃取因素:最相關的一群先成為第一個因素,解釋最多變異,其後遞減;再透過轉軸讓因素盡量彼此區隔,並以特徵值、解釋變異比例、因素負荷量與概念是否說得通來決定保留幾個因素。驗證性因素分析(CFA)則先依理論指定結構,再用適配度統計量檢驗模型與資料合不合。因素分好之後,用 Cronbach's α 檢查每組題項的內部一致性。作者以 857 名高中生的九個動機題項貫穿全章:表現與精熟兩個因素清楚可靠,家庭題項則否。","sections":[{"heading":"構念、觀察變項與為何要用多個題項","points":["題項是可直接測量的觀察變項;它們共同反映的「價值」「工作滿意度」等是不能直接測量的潛在變項。","只問一題,不同受訪者可能各自解讀;用多題才能涵蓋構念的不同面向,並確認大家理解一致。","若多個題項真的在測同一構念,作答應高度相關,且彼此的相關要強於與其他構念題項的相關。","因素分析要求變項為等距尺度且近似常態,樣本要夠大:第一個變項 30 人,每多一個再加 10 人。"]},{"heading":"探索性因素分析:萃取、負荷量與轉軸","points":["EFA 先找出相關最強的一群題項組成第一個因素,再找次強的,直到新因素不再明顯增加解釋變異為止。","因素負荷量類似相關係數,多介於 −1 到 1;負荷愈強,該題愈能定義這個因素,反向題會出現負的負荷。","轉軸讓因素彼此盡量區隔:直交轉軸(最大變異法)最常用;因素間可能相關時改用斜交(直接斜交法)。","保留因素的依據:特徵值大於 1.0、解釋總變異不低於約 10%,而且負荷最高的題項放在一起要有意義。","負荷量低於 0.30 的題項不算該因素的有力指標;同一題在兩個因素都有明顯負荷稱為交叉負荷。"]},{"heading":"具體例子與驗證性因素分析簡介","points":["九個題項(精熟、表現、家庭各三題)以主成分萃取加直交轉軸,初步得到四個特徵值大於 1 的因素。","表現因素解釋約 22%、精熟因素約 21%,都很乾淨;三個家庭題項卻拆成兩個互相重疊的因素。","限定為三因素後,家庭題項合成一個因素,但「父母幫忙輔導作業」負荷僅 0.353,概念上屬具體行為而非信念。","CFA 由研究者依理論先指定哪些題項屬於哪個因素,再看適配度統計量;它是結構方程模式的一部分。"]},{"heading":"信度分析:Cronbach's α","points":["Cronbach's α 衡量一組題項的內部一致性,概念上像題項間的平均關聯,最大為 1.0。","α 同時受題數與題項間相關強度影響:題數愈多 α 通常愈高;經驗法則是大於 0.70 可接受。","輸出會列出校正後題項-總分相關,以及刪除該題後的 α,可看出哪一題與其他題不太合。","表現題項 α = 0.73、精熟題項 α = 0.70 可接受;家庭題項 α 只有 0.265,刪任何一題也不超過 0.36。"]},{"heading":"行文表述與全書總結","points":["報告時依序交代:萃取與轉軸方法、因素個數與特徵值、各因素的題項與解釋變異、再報各量表的 α。","因素的特徵值大於 1 不代表量表可信:家庭因素通過了因素分析,卻沒通過信度分析。","兩種技術變化很多,實際使用前應再讀專書;作者也以此章為全書作結,鼓勵讀者把本書當作起點。"]}],"concepts":[{"tw":"因素分析","cn":"因子分析","en":"factor analysis","diff":true,"note":"依題項間相關的強弱,把一組觀察變項整理、歸類成較少的因素。"},{"tw":"潛在變項(構念)","cn":"潜变量(构造)","en":"latent variable (construct)","diff":true,"note":"無法直接測量,只能由一組觀察題項推論出來的概念。"},{"tw":"探索性因素分析","cn":"探索性因子分析","en":"exploratory factor analysis (EFA)","diff":true,"note":"不預設結構,讓資料的相關型態決定題項如何分群。"},{"tw":"因素負荷量","cn":"因子载荷","en":"factor loading","diff":true,"note":"某題項與某因素之間關聯的強度,解讀方式近似相關係數。"},{"tw":"因素轉軸","cn":"因子旋转","en":"factor rotation","diff":true,"note":"調整因素使其彼此盡量區隔;分直交(varimax)與斜交兩大類。"},{"tw":"特徵值","cn":"特征值","en":"eigenvalue","diff":false,"note":"衡量一個因素強度、解釋多少題項總變異;通常大於 1 才考慮保留。"},{"tw":"驗證性因素分析","cn":"验证性因子分析","en":"confirmatory factor analysis (CFA)","diff":true,"note":"先依理論指定因素結構,再用適配度統計量檢驗與資料合不合。"},{"tw":"Cronbach's α 係數","cn":"克龙巴赫系数","en":"Cronbach's alpha","diff":true,"note":"一組題項內部一致性的指標,一般以大於 0.70 為可接受。"},{"tw":"信度分析","cn":"信度分析","en":"reliability analysis","diff":false,"note":"檢查同一量表的題項彼此相關多強、能否可靠地代表同一構念。"}],"terms":[{"cn":"Alpha","tw":"α(Cronbach's α 的簡寫)","en":"alpha","diff":false},{"cn":"公因子方差","tw":"共同性","en":"communalities","diff":true},{"cn":"验证性因子分析","tw":"驗證性因素分析","en":"confirmatory factor analysis (CFA)","diff":true},{"cn":"构造","tw":"構念","en":"constructs","diff":true},{"cn":"克龙巴赫系数","tw":"Cronbach's α 係數","en":"Cronbach's alpha","diff":true},{"cn":"交叉载荷","tw":"交叉負荷","en":"cross-loaded","diff":true},{"cn":"直接斜交旋转","tw":"直接斜交轉軸","en":"direct oblimin rotation","diff":true},{"cn":"特征值","tw":"特徵值","en":"eigenvalue","diff":false},{"cn":"探索性因子分析","tw":"探索性因素分析","en":"exploratory factor analysis (EFA)","diff":true},{"cn":"提取","tw":"萃取","en":"extraction","diff":true},{"cn":"因子分析","tw":"因素分析","en":"factor analysis","diff":true},{"cn":"因子载荷","tw":"因素負荷量","en":"factor loading","diff":true},{"cn":"因子旋转","tw":"因素轉軸","en":"factor rotation","diff":true},{"cn":"因子","tw":"因素","en":"factors","diff":true},{"cn":"拟合统计量","tw":"適配度統計量","en":"fit statistics","diff":true},{"cn":"反映","tw":"作為指標(反映)","en":"indicated","diff":false},{"cn":"潜变量","tw":"潛在變項","en":"latent variable","diff":true},{"cn":"最大似然","tw":"最大概似法","en":"maximum likelihood","diff":true},{"cn":"非直角旋转","tw":"斜交轉軸","en":"oblique rotation","diff":true},{"cn":"观测变量","tw":"觀察變項","en":"observed variable","diff":true},{"cn":"主成分分析","tw":"主成分分析","en":"principal components analysis (PCA)","diff":false},{"cn":"信度分析","tw":"信度分析","en":"reliability analysis","diff":false},{"cn":"可靠地","tw":"可靠地(具內部一致性)","en":"reliably","diff":false},{"cn":"旋转因子矩阵","tw":"轉軸後因素矩陣","en":"rotated factor matrix","diff":true},{"cn":"量表","tw":"量表","en":"scale","diff":false},{"cn":"强相关","tw":"高度相關","en":"strongly correlated","diff":false},{"cn":"结构方程建模","tw":"結構方程模式","en":"structural equation modeling","diff":true},{"cn":"非观测变量","tw":"未觀察變項","en":"unobserved variable","diff":true},{"cn":"最大方差法","tw":"最大變異法","en":"varimax","diff":true},{"cn":"题项","tw":"題項","en":"item","diff":false},{"cn":"正交因子旋转","tw":"直交轉軸","en":"orthogonal rotation","diff":true},{"cn":"测试—复测信度","tw":"再測信度","en":"test-retest reliability","diff":true}],"symbols":[{"sym":"α","meaning":"Cronbach's α 係數(內部一致性信度)"}],"formulas":[{"name":"因素分析樣本數經驗法則","expr":"所需樣本數 ≈ 30 + 10 × (觀察變項數 − 1)","note":"10 個變項至少 30 + 90 = 120 人"},{"name":"保留因素的經驗法則","expr":"特徵值 > 1.0,且解釋總變異 ≥ 約 10%","note":"還要概念上說得通"},{"name":"可接受信度的經驗法則","expr":"Cronbach's α > 0.70","note":"α 受題數與題間相關共同影響"}],"example":{"title":"857 名高中生的九個動機題項:精熟目標、表現目標、家庭背景","takeaway":"精熟題項彼此相關皆高於 0.40,表現題項亦然,家庭題項彼此相關都低於 0.30。EFA 先得四因素(合計解釋約 69% 變異),限定三因素後表現與精熟因素負荷量都在 0.72 以上,家庭題項的「父母輔導作業」只有 0.353。信度分析:表現 α = 0.73、精熟 α = 0.70、家庭 α = 0.27,家庭三題不能當成一個量表。"},"pitfalls":["特徵值大於 1 的因素不一定有意義,也不一定可靠;還要看概念是否合理以及 α 是否夠高。","α 會隨題數增加而升高,題數少時一題不合就會把 α 拉得很低,解讀時要考慮題數。","直交轉軸假設因素互不相關;社會科學的構念常彼此相關,此時應考慮斜交轉軸。","Cronbach's α 評的是內部一致性,不是再測信度;兩者回答的問題不同。"],"apa":"對九個題項進行探索性因素分析(主成分萃取、直交轉軸),初步得到四個特徵值大於 1.0 的因素;限定三因素後,表現與精熟因素維持不變,家庭題項合為單一因素。信度分析顯示表現量表(Cronbach's α = .73)與精熟量表(α = .70)內部一致性可接受,家庭題項則否(α = .27)。","clinical":"發展一份護理人員職場疲勞量表時,先用因素分析看題項是否如預期分成「情緒耗竭」「工作負荷」等面向,再對每個面向算 Cronbach's α;若某面向 α 低於 0.70,就要檢討題目。","quiz":[{"q":"探索性與驗證性因素分析在出發點上有什麼不同?","a":"探索性因素分析不預設結構,由題項間的相關強弱決定怎麼分群;驗證性因素分析則先依理論指定哪些題項屬於哪個因素,再用適配度統計量檢驗這個模型與資料是否相符。"},{"q":"三個家庭題項在三因素解中確實歸成一個因素,為何作者仍說它們不構成量表?","a":"因為信度分析顯示它們的 Cronbach's α 只有 0.27,刪掉任何一題最高也只到 0.36,代表三題彼此相關都弱,內部一致性不足,無法可靠地代表同一個構念。"},{"q":"同樣是題項間平均相關 0.5,為什麼 8 題量表的 α 會比 3 題量表高、也比較不怕一題不合?","a":"α 取決於題數和題間相關。題數多時共同變異累積得多,α 自然較高;而且單一不合群的題項在 8 題中被稀釋,在 3 題中卻會明顯拉低整體平均相關。"}],"slide":{"headline":"因素分析與信度分析","bullets":["多題測一構念:題項是觀察變項,構念是潛在變項","EFA 依相關萃取因素,轉軸讓因素更分明","留因素看特徵值 > 1、負荷量與概念意義","Cronbach's α > .70 才算內部一致"],"stat":{"num":"α > 0.70","label":"可接受的信度"}},"ocr_notes":["書 198–199 頁之間 OCR 漏掉一行(應為「許多研究者以特徵值大於 1.0 作為保留因素的準則」一類文字),依後文補足語意,需對原書。","表 15-4 的因素欄位(1–4)標題被 OCR 打散,各負荷量所屬因素依正文與圖 15-2 判讀;圖 15-2 中精熟 3 為 0.735(OCR 誤作 0.733)。","表 15-5 已對頁面影像確認:家庭 3 = 0.669、家庭 2 = 0.805、家庭 1 = 0.353。正文卻說家庭 3 負荷最大、家庭 2 為中等,與表中數字不符,疑為原書表格誤植。","表 15-6「題項數 N」數值(應為 3)與表 15-3 因素編號欄 OCR 缺漏。","術語表中「提取(extraction)」詞頭被 OCR 截掉,依釋義補回;正文用「最大变异法」、術語表用「最大方差法」指同一個 varimax。"],"title_tw":"資料化約的技術──因素分析與信度分析"}],"front":{"preface_summary":"作者是常用統計的研究者,看到人們寧可相信個人軼事也不信數據,又普遍懷疑「統計會說謊」,因此想把統計講得讓人看得懂:數字本身不說謊,會出入的是解讀,懂原理才能自己判斷。他說明統計的三種用途:把眾人的資料概括成典型經驗、比較群體之間的整體差異、檢視變項間的關係並做預測;統計談的是普遍趨勢,不適用於單一個人。本書刻意精簡,適合搭配傳統教科書或當複習參考。每章先簡介、再詳解、最後舉例,各章自成一體,可依需要跳讀。","how_to_use":["當作補充讀物:搭配較詳盡的傳統教科書一起讀,不要指望一本學完。","當作複習參考書:學過一兩門統計課的人用來溫習概念。","各取所需:每章先讀 1–2 頁簡介,需要再讀詳解與例子。","各章獨立,可跳讀;例如已懂 t 檢定就直接從第 9 章跳到第 10 章。","想更完整理解某概念時,回頭查更傳統、更詳細的教科書。"],"new_in_3e":["新增第 15 章:因素分析與信度分析等資料整理技術。","第 1 章新增「理解資料分布」一節,並加入數張圖表示範如何使用與解讀。","許多章新增「行文表述」一節,示範論文中如何報告統計量。","設有配套網站:各章課件摘要、多數章的互動習題與延伸學習連結。","訂正前一版的全部已知錯誤(作者自嘲可能又寫進新的)。"],"chapter_structure":"每章三部分:1–2 頁的統計量簡介(用途與提供的資訊)、3–8 頁的詳解(用法、公式、優缺點、前提條件)、章末應用與解釋的實例。","blurbs_note":"Elliot(羅徹斯特大學)、Anderman(俄亥俄州立)、Kaplan(天普)、Roster(新墨西哥)四位教授。","series":"管理者终身学习","copyright_page":{"publisher":"中国人民大学出版社","edition":"2013年12月第1版","print":"2013年12月第1次印刷","format":"175mm×250mm 16开本(印张15.25,插页2)","words (function(){

  <h4>主要差異</h4><ul>${C.keyDiffs.map(d=>`<li><b>${esc(d.t)}</b>:${esc(d.d)}</li>`).join('')}</ul>
  <h4>章節對照</h4><div class="tw"><table><tr><th>簡體 3E</th><th>章名(簡體)</th><th>台灣三版</th><th>章名(台灣)</th><th>差異</th></tr>
  ${C.chapterMap.map(m=>`<tr><td>${m.cn_n?'第 '+m.cn_n+' 章':'—'}</td><td>${esc(m.cn||'—')}</td><td>${m.tw_n?'第 '+m.tw_n+' 章':'—'}</td><td>${esc(m.tw||'—')}</td><td class="${m.note?'diff':''}">${esc(m.note||'')}</td></tr>`).join('')}</table></div>
  <h4>附錄對照</h4><div class="tw"><table><tr><th>內容</th><th>簡體 3E</th><th>台灣三版</th></tr>${C.appendices.map(a=>`<tr><td>${esc(a.what)}</td><td>${esc(a.cn)}</td><td>${esc(a.tw)}</td></tr>`).join('')}</table></div>
  <p class="srcnote">${esc(C.sourceNote)}</p>
  <div class="chips"><a href="#" data-open="terms">看術語譯名差異</a></div>`,true);
}
function terms(){
  const T=B.compare.terms;
  openDrawer(`<div class="k">GLOSSARY DIFF</div><h2>術語譯名對照</h2>
  <div class="sub">共 ${T.length} 組。黃底代表兩岸譯名不同,讀簡體版時最容易卡住的地方。</div>
  <div class="tw"><table><tr><th>English</th><th>台灣</th><th>簡體</th><th>章</th></tr>${T.map(t=>`<tr><td>${esc(t.en)}</td><td><b>${esc(t.tw)}</b></td><td class="${t.diff?'diff':''}">${esc(t.cn)}</td><td>${esc(t.ch)}</td></tr>`).join('')}</table></div>
  <p class="srcnote">${esc(B.compare.termNote)}</p>
  ${B.back?.symbols?.length?`<h4>全書符號表(${B.back.symbols.length} 個)</h4><div class="tw"><table><tr><th>符號</th><th>台灣用語</th><th>簡體版寫法</th></tr>${B.back.symbols.map(y=>`<tr><td><b>${esc(y.sym)}</b></td><td>${esc(y.meaning_tw)}</td><td>${esc(y.meaning_cn)}</td></tr>`).join('')}</table></div>`:''}`,true);
}
let qi=0; const quizzes=B.chapters.flatMap(c=>(c.quiz||[]).map(z=>({...z,n:c.n})));
function setQuiz(){ if(!quizzes.length)return; const z=quizzes[qi%quizzes.length]; $('#quizQ').textContent=z.q; $('#quizCh').textContent='CH '+String(z.n).padStart(2,'0'); }
function showQuiz(){ const z=quizzes[qi%quizzes.length]; openDrawer(`<div class="k">QUIZ · CH ${String(z.n).padStart(2,'0')}</div><h2>${esc(z.q)}</h2><details><summary>看答案</summary><p>${esc(z.a)}</p></details><div class="chips"><a href="#" id="nextQ">下一題</a><a class="alt" href="#" data-ch="${z.n}">回到這一章</a></div>`); }

document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){e.preventDefault();({compare,terms})[o.dataset.open]();return}
  if(e.target.closest('#nextQ')){e.preventDefault();qi++;setQuiz();showQuiz();return}
  const ch=e.target.closest('[data-ch]'); if(ch){e.preventDefault();chapter(+ch.dataset.ch);return}
  const a=e.target.closest('[data-act]'), card=e.target.closest('.card');
  if(a&&card){const n=+card.dataset.n; if(a.dataset.act==='toggle'){done.has(n)?done.delete(n):done.add(n);save();render()} else location.href='slides.html#ch'+n; return}
  if(card){chapter(+card.dataset.n)}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeDrawer(); if(e.key==='Enter'&&e.target.classList?.contains('card'))chapter(+e.target.dataset.n) });
$('#close').onclick=closeDrawer; $('#scrim').onclick=closeDrawer; $('#q').oninput=render;
$('#quizBtn').onclick=showQuiz; $('#dockQuiz').onclick=()=>{qi++;setQuiz();showQuiz()};
$('#resetBtn').onclick=()=>{done.clear();save();render()};
$('#evCompare').textContent=B.compare.teaser;
qi=Math.floor(Math.random()*Math.max(1,quizzes.length)); setQuiz(); render();
const h=location.hash.match(/^#ch(\d+)/); if(h)chapter(+h[1]); if(location.hash==='#compare')compare();
})();
</script>
</body>
</html>
